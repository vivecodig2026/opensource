name: Publicar descargas medibles
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".github/workflows/downloads.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-downloads
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar HTML completos conservando el historial
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, json, os, subprocess, shutil, tempfile, shutil, tempfile
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          source = pathlib.Path('index.html').read_text()
          config = json.loads(re.search(r'<script id="siteConfig" type="application/json">([\s\S]*?)</script>', source)[1])
          tag = 'apps-' + os.environ['GITHUB_SHA']
          releases = json.loads(gh('api', 'repos/' + os.environ['GH_REPO'] + '/releases?per_page=100'))
          current = next((r for r in releases if r['tag_name'] == tag), None)
          if current is None:
              current = json.loads(gh('api', '--method', 'POST', 'repos/' + os.environ['GH_REPO'] + '/releases', '-f', 'tag_name=' + tag, '-f', 'target_commitish=' + os.environ['GITHUB_SHA'], '-f', 'name=Aplicaciones ' + os.environ['GITHUB_SHA'][:7], '-f', 'body=Descargas del catálogo. Conservar esta versión para mantener el historial.', '-F', 'draft=true'))
          uploaded = {a['name'] for a in current['assets']}
          valid = 0
          for app in config['apps']:
              if app.get('catalogIssue'):
                  print('Omitido por revisión del catálogo:', app['file'])
                  continue
              path = pathlib.Path(app['file'])
              if path.parent != pathlib.Path('.') or not path.is_file():
                  continue
              size = path.stat().st_size
              with path.open('rb') as f:
                  prefix = f.read(8192)
              if not 256 <= size <= 60 * 1024 * 1024 or not re.search(br'<(?:!doctype\s+html|html\b)', prefix, re.I):
                  print('Omitido por estar vacío o incompleto:', path)
                  continue
              valid += 1
              asset_name = app.get('assetFile', path.name)
              if not re.fullmatch(r'[A-Za-z0-9_.-]+', asset_name):
                  raise SystemExit('Nombre de descarga no válido: ' + asset_name)
              if asset_name not in uploaded:
                  with tempfile.TemporaryDirectory() as tmp:
                      upload_path = pathlib.Path(tmp) / asset_name
                      shutil.copyfile(path, upload_path)
                      gh('release', 'upload', tag, str(upload_path))
          if not valid:
              raise SystemExit('No hay aplicaciones HTML completas para publicar.')
          if current['draft']:
              gh('release', 'edit', tag, '--draft=false', '--latest')
          print('Publicadas', valid, 'aplicaciones; historial anterior conservado.')
          PY

