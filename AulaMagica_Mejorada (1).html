};
ACT.msgInc = b => { const i = S.inc.find(x => x.id === b.dataset.id); const sid = (i.sids || [])[0]; if (!sid) { toast('Esta novedad no tiene estudiantes involucrados'); return; }
  const tpl = i.cat === 'positivo' ? 'felic' : i.cat === 'evasion' ? 'volada' : 'novedad'; openMsg(sid, null, tpl, { detalle: i.desc, inc: i.id }); };

/* =========================================================
   NOTAS (escala 1.0 – 5.0, Decreto 1290 de 2009)
   ========================================================= */
let NP = null;
R.notas = () => {
  if (!G()) return noGroup(); const list = studs(); if (!list.length) return noStudents();
  if (NP == null) NP = +S.cfg.period;
  const items = S.gitems.filter(i => i.gid === S.gid && i.per === NP); const sumW = items.reduce((a, i) => a + (+i.w || 0), 0);
  let h = vh('📊', 'Notas', 'Planilla de calificaciones con definitiva automática', `<button class="btn pri" data-act="newItem">＋ Nueva actividad</button>`);
  h += tip(`Crea actividades con su porcentaje y escribe las notas (1.0 a 5.0). La <b>definitiva</b> se calcula sola: si una actividad aún no tiene nota, su peso se reparte entre las demás. Las notas de la <b>ruleta</b> valen el <b>${S.cfg.partWeight}%</b> como “Participación”.`);
  h += `<div class="card"><div class="row"><div class="seg">${[1, 2, 3, 4].map(p => `<button class="${NP === p ? 'on' : ''}" data-act="np" data-v="${p}">Periodo ${p}</button>`).join('')}</div><span class="sp"></span>
    <label class="sm"><b>Periodo en curso:</b> <select data-ch="cfgVal" data-k="period" data-rr="1">${[1, 2, 3, 4].map(p => `<option ${+S.cfg.period === p ? 'selected' : ''} value="${p}">${p}</option>`).join('')}</select></label>
    <label class="sm"><b>Participación vale:</b> <input type="number" min="0" max="100" value="${S.cfg.partWeight}" style="width:66px" data-ch="cfgVal" data-k="partWeight" data-rr="1">%</label></div>
    ${items.length && sumW !== 100 ? `<div class="banner mt"><span>⚖️ Los porcentajes de las actividades suman <b>${sumW}%</b>. No pasa nada: el cálculo se ajusta proporcionalmente, pero lo ideal es que sumen 100%.</span></div>` : ''}</div>`;
  const colAvg = items.map(i => { const v = list.map(s => S.scores[i.id]?.[s.id]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; });
  const fins = list.map(s => finalGrade(S.gid, s.id, NP)); const withF = fins.filter(x => x != null);
  const dist = { Bajo: 0, 'Básico': 0, Alto: 0, Superior: 0 }; withF.forEach(v => dist[perf(v)[0]]++);
  h += `<div class="kpis"><div class="kpi" style="--k:#4F46E5"><div class="kl">Promedio del grupo</div><div class="kv">${fmtN(withF.length ? withF.reduce((a, b) => a + b, 0) / withF.length : null)}</div></div>
    <div class="kpi" style="--k:#16A34A"><div class="kl">🟢 Superior</div><div class="kv">${dist.Superior}</div></div><div class="kpi" style="--k:#2563EB"><div class="kl">🔵 Alto</div><div class="kv">${dist.Alto}</div></div>
    <div class="kpi" style="--k:#D97706"><div class="kl">🟡 Básico</div><div class="kv">${dist['Básico']}</div></div><div class="kpi" style="--k:#DC2626"><div class="kl">🔴 Bajo</div><div class="kv">${dist.Bajo}</div></div></div>`;
  h += `<div class="card"><div class="card-h"><h3>Planilla · Periodo ${NP}</h3><button class="btn sm" data-act="notasCSV">⬇️ Excel (CSV)</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="stick">Estudiante</th>${items.map(i => `<th style="text-align:center">${esc(i.name)}<br><small class="muted">${i.w}%</small> <button class="ib" style="font-size:13px" data-act="editItem" data-id="${i.id}">✏️</button></th>`).join('')}<th style="text-align:center">🎡 Particip.<br><small class="muted">${S.cfg.partWeight}%</small></th><th>Definitiva</th></tr></thead><tbody>
    ${list.map((s, k) => `<tr><td class="stick"><b>${esc(shortName(s.name))}</b></td>${items.map(i => { const v = S.scores[i.id]?.[s.id]; return `<td style="text-align:center"><input class="gi ${v != null && v < S.cfg.passMin ? 'low' : ''}" inputmode="decimal" value="${v != null ? v.toFixed(1) : ''}" data-ch="score" data-i="${i.id}" data-s="${s.id}"></td>`; }).join('')}<td style="text-align:center">${fmtN(partAvg(S.gid, s.id, NP))} <small class="muted">(${partsOf(S.gid, s.id, NP).length})</small></td><td id="fin_${s.id}">${perfBadge(fins[k])}</td></tr>`).join('')}
    <tr><td class="stick"><b>Promedio</b></td>${colAvg.map(v => `<td style="text-align:center"><b>${fmtN(v)}</b></td>`).join('')}<td></td><td></td></tr></tbody></table></div>
    ${!items.length ? '<div class="empty sm mt">Crea tu primera actividad con el botón <b>＋ Nueva actividad</b> (ej: Taller 1 – 20%).</div>' : ''}
    <p class="muted sm">Escala: 🔴 Bajo &lt; ${S.cfg.passMin} · 🟡 Básico ${S.cfg.passMin}–3.9 · 🔵 Alto 4.0–4.5 · 🟢 Superior 4.6–5.0. Usa Tab o Enter para pasar a la siguiente casilla.</p></div>`;
  return h;
};
ACT.np = b => { NP = +b.dataset.v; render(); };
function itemForm(i = {}) { return `<div class="fld"><label>Nombre de la actividad</label><input name="name" value="${esc(i.name || '')}" placeholder="Ej: Taller 1, Evaluación, Cuaderno, Exposición"></div><div class="fld"><label>Porcentaje (%)</label><input type="number" name="w" min="0" max="100" value="${i.w ?? 20}"></div>`; }
ACT.newItem = () => modal('📝 Nueva actividad · Periodo ' + NP, itemForm(), { ok: 'Crear', color: '#4F46E5', onOk: (f, o) => { if (!o.name) return false; S.gitems.push({ id: uid(), gid: S.gid, per: NP, name: o.name, w: +o.w || 0 }); save(); render(); } });
ACT.editItem = b => { const i = S.gitems.find(x => x.id === b.dataset.id); modal('✏️ Editar actividad', itemForm(i) + `<button class="btn sm danger-o" data-act="delItem" data-id="${i.id}">🗑️ Eliminar actividad y sus notas</button>`, { ok: 'Guardar', color: '#4F46E5', onOk: (f, o) => { i.name = o.name || i.name; i.w = +o.w || 0; save(); render(); } }); };
ACT.delItem = b => { const id = b.dataset.id; S.gitems = S.gitems.filter(x => x.id !== id); delete S.scores[id]; save(); closeModal(); render(); };
CH.score = el => {
  const v = parseGrade(el.value); const { i, s } = el.dataset;
  if (Number.isNaN(v)) { toast('La nota debe estar entre 1.0 y 5.0'); el.value = S.scores[i]?.[s]?.toFixed(1) || ''; el.focus(); return; }
  S.scores[i] = S.scores[i] || {}; if (v == null) delete S.scores[i][s]; else S.scores[i][s] = v; save();
  el.value = v != null ? v.toFixed(1) : ''; el.classList.toggle('low', v != null && v < S.cfg.passMin);
  const fc = document.getElementById('fin_' + s); if (fc) fc.innerHTML = perfBadge(finalGrade(S.gid, s, NP));

document.addEventListener('keydown', e => { if (e.key !== 'Enter' || !e.target.classList?.contains('gi')) return; e.preventDefault();
  const el = e.target; const all = $$('.gi'); const nx = all.find((x, k) => k > all.indexOf(el) && x.dataset.i === el.dataset.i); el.blur(); if (nx) { nx.focus(); nx.select(); } });
ACT.notasCSV = () => { const list = studs(); const items = S.gitems.filter(i => i.gid === S.gid && i.per === NP);
  const rows = [['Estudiante', ...items.map(i => `${i.name} (${i.w}%)`), `Participación (${S.cfg.partWeight}%)`, 'Definitiva', 'Desempeño']];
  list.forEach(s => { const f = finalGrade(S.gid, s.id, NP); rows.push([s.name, ...items.map(i => S.scores[i.id]?.[s.id]?.toFixed(1).replace('.', ',') ?? ''), partAvg(S.gid, s.id, NP)?.toFixed(1).replace('.', ',') ?? '', f != null ? f.toFixed(1).replace('.', ',') : '', perf(f)[0]]); });
  download(`notas_${G().name}_P${NP}.csv`, csv(rows), 'text/csv'); };

/* =========================================================
   FINANZAS DEL SALÓN
   ========================================================= */
let FSEL = 'all';
function actTotals(aid) { let inn = 0, out = 0; S.moves.filter(m => m.gid === S.gid && (aid === 'all' || (aid === 'gen' ? !m.aid : m.aid === aid))).forEach(m => m.type === 'in' ? inn += m.amt : out += m.amt); return { inn, out, bal: inn - out }; }
R.finanzas = () => {
  if (!G()) return noGroup();
  const acts = S.acts.filter(a => a.gid === S.gid);
  if (FSEL !== 'all' && FSEL !== 'gen' && !acts.some(a => a.id === FSEL)) FSEL = 'all';
  let h = vh('💰', 'Finanzas del salón', 'Ingresos, gastos, compras y cuotas por actividad', `<button class="btn pri" data-act="newAct">＋ Nueva actividad</button>`);
  h += tip('Crea una actividad (rifa, bazar, salida pedagógica, día del niño…) con su meta y cuota por estudiante. Luego registra <b>💵 ingresos</b> y <b>🛒 gastos/compras</b>. Toca a cada estudiante para marcar que <b>pagó su cuota</b>: el ingreso se registra solo.');
  const T = actTotals('all');
  h += `<div class="kpis"><div class="kpi" style="--k:#16A34A"><div class="kl">💵 Ingresos</div><div class="kv pos" style="font-size:24px">${money(T.inn)}</div></div><div class="kpi" style="--k:#DC2626"><div class="kl">🛒 Gastos y compras</div><div class="kv neg" style="font-size:24px">${money(T.out)}</div></div><div class="kpi" style="--k:#D97706"><div class="kl">🏦 Saldo en caja</div><div class="kv ${T.bal >= 0 ? 'pos' : 'neg'}" style="font-size:24px">${money(T.bal)}</div></div></div>`;
  const card = (id, name, sub, meta) => { const t = actTotals(id); const pct = meta ? Math.min(100, Math.round(t.inn / meta * 100)) : null; return `<div class="acard ${FSEL === id ? 'on' : ''}" data-act="fsel" data-id="${id}"><b>${name}</b><div class="muted sm">${sub}</div><div class="am ${t.bal >= 0 ? 'pos' : 'neg'}">${money(t.bal)}</div><div class="sm">+${money(t.inn)} · −${money(t.out)}</div>${meta ? `<div class="progress mt"><div style="width:${pct}%"></div></div><div class="muted sm">${pct}% de la meta (${money(meta)})</div>` : ''}</div>`; };
  h += `<div class="acards">${card('all', '📊 Todo el salón', 'Resumen general')}${card('gen', '🏦 Caja general', 'Sin actividad específica')}${acts.map(a => card(a.id, '🎉 ' + esc(a.name), a.fee ? `Cuota ${money(a.fee)} por estudiante` : (a.date ? fmtDate(a.date) : 'Actividad'), +a.goal)).join('')}</div>`;
  const cur = acts.find(a => a.id === FSEL);
  h += `<div class="card"><div class="card-h"><h3>${FSEL === 'all' ? '📊 Todos los movimientos' : FSEL === 'gen' ? '🏦 Caja general' : '🎉 ' + esc(cur.name)}</h3><div class="row">${cur ? `<button class="btn sm" data-act="editAct">✏️ Editar</button><button class="btn sm danger-o" data-act="delAct">🗑️</button>` : ''}<button class="btn sm" data-act="finCSV">⬇️ CSV</button></div></div>
    <div class="row" style="margin-bottom:14px"><button class="btn ok" data-act="newMove" data-v="in">💵 Registrar ingreso</button><button class="btn danger" data-act="newMove" data-v="out">🛒 Registrar gasto o compra</button></div>`;
  if (cur && +cur.fee) {
    const paid = new Set(S.moves.filter(m => m.aid === cur.id && m.auto && m.sid).map(m => m.sid)); const list = studs();
    h += `<h4>👛 Cuotas: ${paid.size}/${list.length} pagaron · faltan ${money((list.length - paid.size) * cur.fee)}</h4><div class="progress" style="margin-bottom:10px"><div style="width:${list.length ? paid.size / list.length * 100 : 0}%;background:#16A34A"></div></div><div class="feegrid" style="margin-bottom:16px">${list.map(s => `<div class="fee ${paid.has(s.id) ? 'paid' : ''}" data-act="feeTog" data-id="${s.id}">${paid.has(s.id) ? '✅' : '⬜'} ${esc(shortName(s.name))}</div>`).join('')}</div>`;
  }
  const mv = S.moves.filter(m => m.gid === S.gid && (FSEL === 'all' || (FSEL === 'gen' ? !m.aid : m.aid === FSEL))).sort((a, b) => b.date.localeCompare(a.date));
  h += mv.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Concepto</th>${FSEL === 'all' ? '<th>Actividad</th>' : ''}<th>Responsable</th><th class="r">Valor</th><th></th></tr></thead><tbody>${mv.map(m => `<tr><td>${fmtDate(m.date)}</td><td>${m.type === 'in' ? '💵' : '🛒'} ${esc(m.concept)}</td>${FSEL === 'all' ? `<td class="muted sm">${esc(S.acts.find(a => a.id === m.aid)?.name || 'Caja general')}</td>` : ''}<td class="muted sm">${esc(m.who || '')}</td><td class="r"><b class="${m.type === 'in' ? 'pos' : 'neg'}">${m.type === 'in' ? '+' : '−'}${money(m.amt)}</b></td><td><button class="ib" data-act="delMove" data-id="${m.id}">🗑️</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty sm">Aún no hay movimientos aquí.</div>';
  return h + '</div>';
};
ACT.fsel = b => { FSEL = b.dataset.id; SFX.click(); render(); };
function actForm(a = {}) { return `<div class="fld"><label>Nombre de la actividad</label><input name="name" value="${esc(a.name || '')}" placeholder="Ej: Rifa día de la familia, Salida pedagógica"></div><div class="grid2"><div class="fld"><label>Meta a recaudar ($)</label><input type="number" name="goal" min="0" value="${a.goal || ''}" placeholder="Opcional"></div><div class="fld"><label>Cuota por estudiante ($)</label><input type="number" name="fee" min="0" value="${a.fee || ''}" placeholder="Opcional"></div></div><div class="fld"><label>Fecha</label><input type="date" name="date" value="${a.date || todayStr()}"></div>`; }
ACT.newAct = () => modal('🎉 Nueva actividad', actForm(), { ok: 'Crear', color: '#D97706', onOk: (f, o) => { if (!o.name) return false; const a = { id: uid(), gid: S.gid, name: o.name, goal: +o.goal || 0, fee: +o.fee || 0, date: o.date }; S.acts.push(a); FSEL = a.id; save(); SFX.coin(); render(); } });
ACT.editAct = () => { const a = S.acts.find(x => x.id === FSEL); modal('✏️ Editar actividad', actForm(a), { ok: 'Guardar', color: '#D97706', onOk: (f, o) => { Object.assign(a, { name: o.name || a.name, goal: +o.goal || 0, fee: +o.fee || 0, date: o.date }); save(); render(); } }); };
ACT.delAct = () => confirmBox('Se eliminará la actividad y todos sus movimientos.', () => { S.moves = S.moves.filter(m => m.aid !== FSEL); S.acts = S.acts.filter(a => a.id !== FSEL); FSEL = 'all'; save(); render(); });
ACT.newMove = b => { const t = b.dataset.v; const acts = S.acts.filter(a => a.gid === S.gid);
  modal(t === 'in' ? '💵 Registrar ingreso' : '🛒 Registrar gasto o compra', `<div class="fld"><label>Concepto</label><input name="concept" placeholder="${t === 'in' ? 'Ej: venta de boletas, donación, venta de empanadas' : 'Ej: compra de marcadores, refrigerio, transporte'}"></div>
  <div class="grid2"><div class="fld"><label>Valor ($)</label><input type="number" name="amt" min="0" inputmode="numeric" placeholder="0"></div><div class="fld"><label>Fecha</label><input type="date" name="date" value="${todayStr()}"></div></div>
  <div class="grid2"><div class="fld"><label>Actividad</label><select name="aid"><option value="">🏦 Caja general</option>${acts.map(a => `<option value="${a.id}" ${FSEL === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div><div class="fld"><label>Responsable</label><input name="who" placeholder="Quién ${t === 'in' ? 'entregó' : 'compró'}"></div></div>`,
  { ok: 'Guardar', color: t === 'in' ? '#16A34A' : '#DC2626', onOk: (f, o) => { const amt = +o.amt; if (!o.concept || !(amt > 0)) { toast('Escribe el concepto y un valor mayor a 0'); return false; } S.moves.push({ id: uid(), gid: S.gid, aid: o.aid || null, type: t, amt, concept: o.concept, date: o.date || todayStr(), who: o.who }); save(); t === 'in' ? SFX.coin() : SFX.click(); toast(t === 'in' ? `💵 +${money(amt)} registrado` : `🛒 −${money(amt)} registrado`); render(); } }); };
ACT.delMove = b => confirmBox('¿Eliminar este movimiento?', () => { S.moves = S.moves.filter(m => m.id !== b.dataset.id); save(); render(); });
ACT.feeTog = b => { const a = S.acts.find(x => x.id === FSEL); const sid = b.dataset.id; const ex = S.moves.find(m => m.aid === a.id && m.auto && m.sid === sid);
  if (ex) S.moves = S.moves.filter(m => m !== ex); else { S.moves.push({ id: uid(), gid: S.gid, aid: a.id, type: 'in', amt: +a.fee, concept: 'Cuota de ' + sname(sid), date: todayStr(), who: sname(sid), sid, auto: true }); SFX.coin(); }
  save(); render(); };
ACT.finCSV = () => { const mv = S.moves.filter(m => m.gid === S.gid).sort((a, b) => a.date.localeCompare(b.date)); const rows = [['Fecha', 'Tipo', 'Concepto', 'Actividad', 'Responsable', 'Valor']]; mv.forEach(m => rows.push([m.date, m.type === 'in' ? 'Ingreso' : 'Gasto', m.concept, S.acts.find(a => a.id === m.aid)?.name || 'Caja general', m.who || '', (m.type === 'in' ? 1 : -1) * m.amt])); download(`finanzas_${G().name}.csv`, csv(rows), 'text/csv'); };

/* =========================================================
   HERRAMIENTAS: temporizador, equipos, turnos, semáforo de ruido
   ========================================================= */
let HT = 'timer';
const TM = { total: 300, left: 300, running: false, last: 0, lastSec: -1 };
const TEAMN = [['🦁', 'Leones', '#F59E0B'], ['🐬', 'Delfines', '#0EA5E9'], ['🦜', 'Guacamayas', '#22C55E'], ['🐯', 'Tigres', '#F97316'], ['🦋', 'Mariposas', '#A855F7'], ['🐢', 'Tortugas', '#14B8A6'], ['🦊', 'Zorros', '#EF4444'], ['🐝', 'Abejas', '#EAB308'], ['🦉', 'Búhos', '#6366F1'], ['🐸', 'Ranas', '#84CC16'], ['🐙', 'Pulpos', '#EC4899'], ['🦅', 'Águilas', '#78716C']];
let TEAMS = null, ORDER = null;
R.herramientas = () => {
  let h = vh('🧰', 'Herramientas mágicas', 'Para manejar el tiempo, formar equipos y cuidar el ruido');
  h += `<div class="seg" style="margin-bottom:16px">${[['timer', '⏱️ Temporizador'], ['teams', '🧩 Equipos al azar'], ['order', '🔢 Orden de turnos'], ['noise', '🚦 Semáforo de ruido']].map(([k, t]) => `<button class="${HT === k ? 'on' : ''}" data-act="ht" data-v="${k}">${t}</button>`).join('')}</div>`;
  if (HT === 'timer') {
    h += tip('Ideal para actividades, exámenes o pausas activas. Suena una alarma al terminar y los últimos 10 segundos hacen tic-tac.');
    h += `<div class="card"><div class="timer-wrap"><svg class="timer-svg" viewBox="0 0 240 240"><circle cx="120" cy="120" r="104" fill="none" stroke="#F1ECE3" stroke-width="18"/><circle id="tArc" cx="120" cy="120" r="104" fill="none" stroke="#0D9488" stroke-width="18" stroke-linecap="round" transform="rotate(-90 120 120)" stroke-dasharray="653.5" stroke-dashoffset="0"/><text id="tDig" x="120" y="134" text-anchor="middle" font-size="46" font-weight="900" fill="#1E1B4B" style="font-variant-numeric:tabular-nums">${mmss(TM.left * 1000)}</text></svg>
      <div class="chips">${[1, 2, 3, 5, 10, 15, 20, 30].map(m => `<button class="chip" data-act="tSet" data-v="${m}">${m} min</button>`).join('')}<span class="row"><input id="tCustom" type="number" min="1" max="180" placeholder="min" style="width:80px"><button class="btn sm" data-act="tSet" data-v="custom">Usar</button></span></div>
      <div class="row center"><button class="btn xl pri" data-act="tToggle">${TM.running ? '⏸️ Pausar' : '▶️ Iniciar'}</button><button class="btn lg" data-act="tReset">↺ Reiniciar</button></div></div></div>`;
  } else if (HT === 'teams') {
    h += tip('<b>Aleatorio</b> mezcla con el algoritmo Fisher-Yates. <b>Equilibrado</b> ordena por la definitiva del periodo y reparte en “serpiente” (1-2-3-3-2-1) para que todos los equipos queden parejos.');

      const sens = +(S.cfg.nzSens || 5); lvl = lvl * .85 + Math.min(1, rms * sens * 6) * .15;

attStats=function(gid,sid){const c={P:0,A:0,T:0,E:0,V:0};attendanceRows(gid).forEach(b=>{if(sid in b.roster&&b.marks[sid] in c)c[b.marks[sid]]++;});const tot=Object.values(c).reduce((a,b)=>a+b,0);return {tot,p:c.P,a:c.A,t:c.T,e:c.E,v:c.V,pct:tot?Math.round(100*(c.P+c.T)/tot):null};};
recentCount=function(gid,sid,code,n=30){const lim=dstr(new Date(Date.now()-n*864e5));return attendanceRows(gid).filter(b=>b.date>=lim&&b.date<=todayStr()&&b.marks[sid]===code).length;};
consecAbs=function(gid,sid){let n=0;for(const b of attendanceRows(gid).reverse()){if(!(sid in b.roster)||b.marks[sid]==='N')continue;if(b.marks[sid]==='A')n++;else break;}return n;};
function recordType(b){return b?.kind==='hour'?'Hora de clase':b?.kind==='block'?'Bloque completo · 2 horas':b?.legacy?'Registro anterior':'Clase';}
function blockToolbar(date=todayStr(),editable=false){const b=activeBlock(S.gid,date),siblings=b?.lessonId?blocks(S.gid,date).filter(x=>x.lessonId===b.lessonId).sort((a,b)=>a.hourIndex-b.hourIndex):[];return `<div class="blockbar"><div><span class="eyebrow">${esc(G().name)} · ${fmtDate(date)}</span><b>${esc(b?recordType(b):'Hora o bloque de clase')}</b></div><select aria-label="Hora o bloque activo" data-ch="blockSelect" data-date="${date}">${blocks(S.gid,date).length?blocks(S.gid,date).map(x=>`<option value="${x.id}" ${x.id===b?.id?'selected':''}>${esc(blockLabel(x))}</option>`).join(''):'<option>Sin clase iniciada</option>'}</select><button class="btn sm" data-act="blockNew" data-date="${date}">＋ Nueva hora / bloque</button>${editable&&b?'<button class="btn sm" data-act="blockEdit">Editar horario</button>':''}${editable&&b&&!b.legacy&&b.kind!=='hour'?'<button class="btn sm" data-act="blockSplit">Separar en dos horas</button>':''}${siblings.length>1?`<div class="hour-switch" role="group" aria-label="Horas del bloque">${siblings.map(x=>`<button class="btn sm ${x.id===b.id?'pri':''}" aria-pressed="${x.id===b.id}" data-act="hourSelect" data-id="${x.id}" data-date="${date}">${x.hourIndex===1?'Primera':'Segunda'} hora · ${x.start}–${x.end}</button>`).join('')}</div>`:''}</div>`;}
const hmMinutes=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const fromMinutes=n=>pad(Math.floor(Math.max(0,Math.min(1439,n))/60))+':'+pad(Math.max(0,Math.min(1439,n))%60);
function newBlockForm(b={},editing=false){const start=b.start||nowTime(),end=b.end||fromMinutes(hmMinutes(start)+60),count=blocks(S.gid,AM2.date).length+1;return `${editing?`<p class="muted sm">${recordType(b)} · los estados guardados se conservan.</p>`:`<div class="fld"><label>¿Cómo quieres tomar la asistencia?</label><select name="mode" data-ch="attendanceMode"><option value="hour">Una hora de clase</option><option value="block">Bloque completo de 2 horas · una sola lista</option><option value="split">Bloque de 2 horas · una lista para cada hora</option></select></div>`}<div class="fld"><label>Nombre de la clase</label><input name="label" maxlength="60" value="${esc(b.label||'Clase '+count)}" placeholder="Ej: Matemáticas"></div><div class="grid2"><div class="fld"><label id="hourStartLabel">Desde</label><input type="time" name="start" value="${start}" data-ch="attendanceStart"></div><div class="fld"><label id="hourEndLabel">Hasta</label><input type="time" name="end" value="${end}" data-ch="attendanceEnd"></div></div>${!editing?`<div id="secondHourFields" class="hidden"><h4>Segunda hora</h4><div class="grid2"><div class="fld"><label>Desde</label><input type="time" name="start2" value="${end}" disabled></div><div class="fld"><label>Hasta</label><input type="time" name="end2" value="${fromMinutes(hmMinutes(end)+60)}" disabled></div></div><p class="muted sm">Si hay descanso, ajusta la entrada de la segunda hora. Cada hora conserva sus propias novedades.</p></div><div class="banner"><span>✓ <b>Todos empiezan presentes.</b> Solo cambia las ausencias, tardanzas u otras novedades.</span></div>`:''}<p class="muted sm">Los horarios son editables: una hora pedagógica puede durar menos de 60 minutos.</p>`;}
CH.attendanceMode=el=>{const f=$('#mform'),split=el.value==='split';$('#secondHourFields').classList.toggle('hidden',!split);$$('#secondHourFields input').forEach(x=>x.disabled=!split);$('#hourStartLabel').textContent=split?'Primera hora · desde':'Desde';$('#hourEndLabel').textContent=split?'Primera hora · hasta':'Hasta';f.elements.end.value=fromMinutes(hmMinutes(f.elements.start.value)+(el.value==='block'?120:60));f.elements.start2.value=f.elements.end.value;f.elements.end2.value=fromMinutes(hmMinutes(f.elements.end.value)+60);};

function validClassTimes(o,existing,skipId=null){const intervals=[{a:o.start,b:o.end}];if(o.mode==='split')intervals.push({a:o.start2,b:o.end2});if(!o.label||intervals.some(x=>!x.a||!x.b||x.a>=x.b)||(o.mode==='split'&&o.start2<o.end)){toast('Completa el nombre y los horarios. La segunda hora debe empezar al terminar la primera o después.');return false;}if(intervals.some(i=>existing.some(x=>x.id!==skipId&&x.start&&i.a<x.end&&i.b>x.start))){toast('Ese horario se cruza con otra hora o bloque del día');return false;}return true;}
ACT.blockNew=b=>{
 const date=b?.dataset?.date||AM2.date;if(date>todayStr())return toast('La asistencia se registra hasta la fecha de hoy');const gid=S.gid;
 modal('Nueva hora o bloque · '+fmtDate(date),newBlockForm(),{ok:'Iniciar asistencia',onOk:(f,o)=>{
  if(!validClassTimes(o,blocks(gid,date)))return false;
  const roster=Object.fromEntries(studs(gid).map(s=>[s.id,s.name]));const lessonId=o.mode==='split'?uid():null;
  const make=(start,end,hourIndex)=>({id:uid(),kind:o.mode==='block'?'block':'hour',hours:o.mode==='block'?2:1,label:o.label+(lessonId?' · '+hourIndex+'.ª hora':''),start,end,...(lessonId?{lessonId,lessonLabel:o.label,hourIndex}:{}),roster:{...roster},marks:Object.fromEntries(Object.keys(roster).map(id=>[id,'P'])),times:{},defaultPresent:true,saved:Date.now()});
  const records=[make(o.start,o.end,1)];if(o.mode==='split')records.push(make(o.start2,o.end2,2));
  S.att[gid]||={};S.att[gid][date]||={marks:{},times:{},blocks:[]};S.att[gid][date].blocks.push(...records);selectBlock(records[0].id,date);refreshDay(gid,date);save();go('asistencia');AM2.date=date;render();
 }});
};

ACT.blockSplit=()=>{const b=activeBlock(S.gid,AM2.date);if(!b||b.legacy||b.kind==='hour'||!b.start||!b.end)return;const mid=fromMinutes(Math.floor((hmMinutes(b.start)+hmMinutes(b.end))/2));modal('Separar el bloque en dos horas',`<p><b>${esc(b.label)}</b> · ${b.start}–${b.end}</p><p>Las novedades que ya guardaste se copiarán a las dos horas; luego podrás cambiar cada hora por separado.</p><div class="fld"><label>Hora de separación</label><input type="time" name="mid" value="${mid}"></div>`,{ok:'Crear primera y segunda hora',onOk:(f,o)=>{if(!o.mid||o.mid<=b.start||o.mid>=b.end){toast('La separación debe quedar dentro del horario del bloque');return false;}const original=JSON.parse(JSON.stringify(b)),lessonId=uid(),second=JSON.parse(JSON.stringify(b));Object.assign(second,{id:uid(),kind:'hour',hours:1,label:b.label+' · 2.ª hora',start:o.mid,lessonId,lessonLabel:b.label,hourIndex:2});Object.assign(b,{kind:'hour',hours:1,label:b.label+' · 1.ª hora',end:o.mid,lessonId,lessonLabel:original.label,hourIndex:1,splitSource:original});blocks(S.gid,AM2.date).push(second);S.perm.filter(p=>p.gid===S.gid&&p.date===AM2.date&&p.blockId===b.id).forEach(p=>{if(new Date(p.out).toTimeString().slice(0,5)>=o.mid)p.blockId=second.id;});S.alerts.filter(a=>a.gid===S.gid&&a.date===AM2.date&&a.blockId===b.id).forEach(a=>{if(a.time>=o.mid)a.blockId=second.id;});refreshDay(S.gid,AM2.date);save();render();}});};

CH.attDate=el=>{AM2.date=el.value&&el.value<=todayStr()?el.value:todayStr();AM2.query='';render();};
function setAttendance(sid,code,date=AM2.date,gid=S.gid,bid=null,time=null){
 const b=bid?blocks(gid,date).find(x=>x.id===bid):activeBlock(gid,date);if(!b||!ATT[code])return false;
 const s=stu(sid);b.roster[sid]||=s?.name||sid;b.marks[sid]=code;
 if(['T','V'].includes(code))b.times[sid]=time||(date===todayStr()?nowTime():b.start||'');else delete b.times[sid];
 b.saved=Date.now();refreshDay(gid,date);save();return true;
}

ACT.attTime=b=>{const rec=activeBlock(S.gid,AM2.date);modal('Hora de la novedad',`<p>${esc(sname(b.dataset.id))}</p><div class="fld"><label>Hora</label><input type="time" name="time" value="${rec.times[b.dataset.id]||rec.start||''}"></div>`,{ok:'Guardar hora',onOk:(f,o)=>{if(!o.time)return false;rec.times[b.dataset.id]=o.time;refreshDay(S.gid,AM2.date);save();render();}});};

function attendanceHistory(){const rows=attendanceRows(S.gid,AM),names={};rows.forEach(b=>Object.assign(names,b.roster));const ids=Object.keys(names).sort((a,b)=>names[a].localeCompare(names[b],'es'));
 return `<div class="card"><div class="card-h"><div><h3>Historial por horas y bloques</h3><small class="muted">Cada columna corresponde a una hora o a un bloque completo, según la modalidad elegida; ○ indica sin registrar.</small></div><div class="row"><input aria-label="Mes del historial" type="month" value="${AM}" data-ch="attMonth"><button class="btn sm" data-act="attCSV">Exportar CSV</button><button class="btn sm" data-act="attPrint">Imprimir</button></div></div>${rows.length?`<div class="tbl-wrap"><table class="tbl hist"><thead><tr><th class="stick">Estudiante</th>${rows.map(b=>`<th><button class="histlink" data-act="openBlock" data-date="${b.date}" data-id="${b.id}">${+b.date.slice(8)} ${MES[+b.date.slice(5,7)-1]}<br>${esc(b.label)}<br><small>${b.start||'Diario'}${b.end?'–'+b.end:''}</small></button></th>`).join('')}</tr></thead><tbody>${ids.map(id=>`<tr><td class="stick">${esc(names[id])}</td>${rows.map(b=>{const k=b.marks[id]||'N';return `<td class="c c${k}" title="${esc(ATT[k]?.[1]||'')} ${b.times[id]||''}">${id in b.roster?(k==='N'?'○':k):'—'}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div><p class="muted sm">P: presente · A: ausente · T: tarde · E: excusa · V: se retiró · —: no pertenecía a la lista de ese bloque.</p>`:'<div class="empty sm">Todavía no hay registros en este mes.</div>'}</div>`;

R.asistencia=()=>{
 if(!G())return noGroup();if(!studs().length)return noStudents();
 const b=activeBlock(S.gid,AM2.date),list=studs(),counts={P:0,A:0,T:0,E:0,V:0,N:0};list.forEach(s=>counts[b?.marks[s.id]||'N']++);

 }});

/* Voz local: nunca se usan voces remotas para los nombres */
function localVoices(){return ('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>v.localService&&/^es(?:[-_]|$)/i.test(v.lang)):[];}
function voicePanel(){const list=localVoices();return `<div class="card"><h3>Voz de la ruleta</h3>${tgl('voiceOn','Decir el nombre elegido','El nombre se anuncia después de los efectos, con una voz local en español.')}<div class="fld"><label>Voz local disponible</label><select data-ch="cfgVal" data-k="voiceURI" id="localVoiceSelect"><option value="">Automática</option>${list.map(v=>`<option value="${esc(v.voiceURI)}" ${S.cfg.voiceURI===v.voiceURI?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}</select></div><div class="grid2"><div class="fld"><label>Volumen de la voz</label><select data-ch="cfgVal" data-k="voiceVolume">${[[1,'100 % · máximo'],[.85,'85 %'],[.7,'70 %'],[.5,'50 %']].map(([v,label])=>`<option value="${v}" ${+S.cfg.voiceVolume===v?'selected':''}>${label}</option>`).join('')}</select><small>Independiente del volumen de los efectos. Ajusta también el volumen del dispositivo si hace falta.</small></div><div class="fld"><label>Velocidad de lectura</label><select data-ch="cfgVal" data-k="voiceRate">${[[.6,'Muy pausada'],[.72,'Pausada · recomendada'],[.85,'Moderada'],[1,'Normal']].map(([v,label])=>`<option value="${v}" ${+S.cfg.voiceRate===v?'selected':''}>${label}</option>`).join('')}</select><small>Se lee el nombre completo en una sola frase para conservar la fluidez.</small></div></div><p class="muted sm" id="voiceStatus">${list.length?'✓ Hay '+list.length+' voz(es) local(es) en español. Prueba con el dispositivo sin conexión.':'No se detecta una voz local en español. Instálala en las opciones de voz / texto a voz del sistema y vuelve a abrir el navegador. La ruleta funciona igualmente sin voz.'}</p><button class="btn sm" data-act="voiceTest">🔊 Probar voz</button></div>`;}
const VOICE={timer:null,token:0,active:false,fallback:null,utterance:null};
function clearVoice(){clearTimeout(VOICE.timer);clearTimeout(VOICE.fallback);VOICE.token++;VOICE.active=false;VOICE.utterance=null;window.speechSynthesis?.cancel();}
function sayName(text,force=false,delay=0){
 clearVoice();if((!force&&!S.cfg.voiceOn)||!text.trim())return;
 const voices=localVoices(),v=voices.find(x=>x.voiceURI===S.cfg.voiceURI)||voices.find(x=>x.lang==='es-CO')||voices[0];if(!v){toast('No hay voz local en español disponible; revisa “Voz de la ruleta”');return;}
 const token=VOICE.token,wait=Math.max(delay,(SFX.audibleUntil||0)-performance.now()+150,0);
 VOICE.timer=setTimeout(()=>{if(token!==VOICE.token||(!force&&!S.cfg.voiceOn))return;try{
  const u=new SpeechSynthesisUtterance(text.trim().replace(/\s+/g,' '));u.voice=v;u.lang=v.lang;u.rate=Math.max(.5,Math.min(1,Number(S.cfg.voiceRate)||.72));u.volume=Math.max(0,Math.min(1,Number(S.cfg.voiceVolume)||1));u.pitch=1;VOICE.active=true;VOICE.utterance=u;
  const finish=()=>{if(token===VOICE.token){VOICE.active=false;VOICE.utterance=null;clearTimeout(VOICE.fallback);}};
  u.onend=finish;u.onerror=e=>{finish();if(!['canceled','interrupted'].includes(e.error))toast('La voz no pudo reproducirse. Pulsa “Repetir nombre” o prueba otra voz local.');};
  VOICE.fallback=setTimeout(finish,30000);speechSynthesis.resume();speechSynthesis.speak(u);
 }catch{VOICE.active=false;toast('El navegador no pudo reproducir la voz');}},wait);
}
// Dejar terminar los sonidos programados y atenuar los nuevos mientras se anuncia el nombre.
const voiceTone=SFX.tone.bind(SFX),voiceNoise=SFX.noise.bind(SFX);
SFX.tone=function(f,d=.1,type='sine',v=.3,when=0,slide=null){if(S.cfg.sound)SFX.audibleUntil=Math.max(SFX.audibleUntil||0,performance.now()+(when+d+.03)*1000);return voiceTone(f,d,type,v*(VOICE.active?.12:1),when,slide);};
SFX.noise=function(d=.05,v=.3,when=0,freq=2000,type='highpass'){if(S.cfg.sound)SFX.audibleUntil=Math.max(SFX.audibleUntil||0,performance.now()+(when+d)*1000);return voiceNoise(d,v*(VOICE.active?.12:1),when,freq,type);};
ACT.voiceTest=()=>sayName('Aula Mágica. Es tu turno de participar.',true);
ACT.repeatName=()=>sayName(W.lastName||'',true);
if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',()=>{const el=$('#localVoiceSelect');if(el){const vs=localVoices();el.innerHTML='<option value="">Automática</option>'+vs.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===S.cfg.voiceURI?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('');$('#voiceStatus').textContent=vs.length?'✓ Voces locales en español disponibles. Usa Probar voz.':'No se detecta una voz local en español. Instálala en el sistema y vuelve a abrir el navegador.';}});
/* Ruleta: presencia explícita, permisos, selección justa y revelación oculta */
const wheelItemsV1=wheelItems;
wheelItems=function(){if(W.spinning&&W.items)return W.items;if(S.cfg.wmode==='custom')return wheelItemsV1();const outside=new Set(S.perm.filter(p=>!p.back).map(p=>p.sid));return studs().filter(s=>isPresent(S.gid,todayStr(),s.id)&&!outside.has(s.id)).map(s=>({id:s.id,label:shortName(s.name),full:s.name}));};
wState=function(){S.wheel[S.gid]||={};const key=todayStr()+'|'+(S.cfg.wmode||'est');S.wheel[S.gid].sessions||={};return S.wheel[S.gid].sessions[key]||=( {round:[]} );};
function rand(){if(window.crypto?.getRandomValues){const x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]/4294967296;}return Math.random();}
pickTarget=function(items){if(!items.length)return null;const state=wState();let pool=S.cfg.wnorep?items.filter(i=>!state.round.includes(i.id)):items;if(!pool.length){state.round=[];pool=items;}const count={};S.part.filter(p=>p.gid===S.gid).forEach(p=>count[p.sid]=(count[p.sid]||0)+1);const min=Math.min(...pool.map(i=>count[i.id]||0));const w=pool.map(i=>S.cfg.wfair&&S.cfg.wmode!=='custom'?1/Math.pow(1+(count[i.id]||0)-min,2):1);let n=rand()*w.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){n-=w[i];if(n<0)return pool[i];}return pool[pool.length-1];};
const wheelViewV1=R.ruleta;
R.ruleta=()=>{
 let h=wheelViewV1();if(!G())return h;
 const custom=S.cfg.wmode==='custom',b=activeBlock(),items=wheelItems(),pending=studs().filter(s=>!b?.marks[s.id]||b.marks[s.id]==='N').length;
 h=h.replace(/<div class="fld"><label>¿Quiénes entran a la ruleta\?<\/label>.*?<\/div><\/div>/s,`<div class="banner">Solo estudiantes con presencia registrada (P o T) en la hora o bloque activo de hoy, sin permisos abiertos.</div>`);
 h=h.replace(/Si alguien no está en el salón, márcalo y sale de la ruleta por hoy\./,'La asistencia y los permisos determinan quién puede participar.');
 h=h.replace('<div class="cols">',`${custom?'':blockToolbar()+`<div class="wheel-summary"><b>${items.length} disponibles</b><span>${pending} sin registrar</span><span>${outNow(S.gid).length} con permiso abierto</span><button class="text-btn" data-act="go" data-v="asistencia">Revisar asistencia →</button></div>`}<div class="cols">`);
 h=h.replace('<div class="wheel-wrap">','<div class="wheel-wrap"><div class="mystery" id="wheelMystery" aria-hidden="true"><b>?</b><span>Un momento…</span></div>');
 h=h.replace('id="spinBtn" data-act="spin" '+(items.length<2?'disabled':''),'id="spinBtn" data-act="spin" '+(!items.length?'disabled':''));
 h=h.replace('¡GIRAR! 🎉</button>','¡GIRAR! 🎉</button><button class="btn sm hidden" id="cancelSpin" data-act="cancelSpin">Cancelar giro</button>');
 h=h.replace('</div></div>','</div></div>');return h+voicePanel();
};
const originalReveal=reveal;
reveal=function(item){originalReveal(item);W.lastName=item.full;const body=$('#mform');if(body){body.insertAdjacentHTML('beforeend','<div class="row center mt"><button class="btn" data-act="repeatName">🔊 Repetir nombre</button></div>');body.innerHTML=body.innerHTML.replace('🤐 No respondió','Evidencia mínima').replace('😐 Básico','Básico');}if(S.cfg.voiceOn)sayName(item.full,false,1650);};
spin=function(){
 if(W.spinning)return;clearVoice();const items=wheelItems();if(!items.length){toast('Registra estudiantes presentes en la hora o bloque activo de hoy');return;}
 const gid=S.gid,bid=activeBlock()?.id,mode=S.cfg.wmode,date=todayStr(),target=pickTarget(items),idx=items.findIndex(x=>x.id===target.id),TAU=2*Math.PI,seg=TAU/items.length;
 const finalAngle=-Math.PI/2-(idx+.3+rand()*.4)*seg,cur=W.rot,delta=((finalAngle-cur)%TAU+TAU)%TAU;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,dur=reduced?1500:({corta:3400,normal:6000,epica:8500}[S.cfg.wdur]||6000)+rand()*1100;
 const final=cur+(5+Math.floor(rand()*4))*TAU+delta,token=++AM2.token,start=performance.now();let tick=-1,rolled=false;
 W.spinning=true;W.items=items;$('#spinBtn').disabled=true;$('#cancelSpin').classList.remove('hidden');document.body.classList.add('wheel-running');$('#liveName').textContent='¿Quién será…?';SFX.whoosh();
 function frame(now){
  if(token!==AM2.token)return;
  if(S.gid!==gid||VIEW!=='ruleta'||LOCKED||todayStr()!==date){ACT.cancelSpin();return;}
  const t=Math.min(1,(now-start)/dur),ease=t*t*(3-2*t);W.rot=cur+(final-cur)*Math.max(0,Math.min(1,ease));
  const i=idxAt(W.rot,items.length);if(i!==tick){tick=i;SFX.tick();}
  W.lights=Math.floor(now/110)%2;
  if(t>.63){$('#wheelMystery')?.classList.add('show');if(!rolled){SFX.drumroll(Math.min(2,dur*.35/1000));rolled=true;}}
  if(!reduced)drawWheel();
  if(t<1)requestAnimationFrame(frame);else{
   W.spinning=false;W.items=null;W.rot=((final%TAU)+TAU)%TAU;document.body.classList.remove('wheel-running');$('#wheelMystery')?.classList.remove('show');$('#cancelSpin')?.classList.add('hidden');if($('#spinBtn'))$('#spinBtn').disabled=false;drawWheel();
   if(mode!=='custom'&&(activeBlock()?.id!==bid||!wheelItems().some(i=>i.id===target.id))){toast('Cambió la disponibilidad. Vuelve a girar.');return;}
   reveal(target);
  }
 }
 requestAnimationFrame(frame);
};
ACT.spin=()=>spin();
ACT.cancelSpin=()=>{AM2.token++;W.spinning=false;W.items=null;document.body.classList.remove('wheel-running');clearVoice();render();toast('Giro cancelado; no se registró participación');};
document.addEventListener('click',e=>{if(W.spinning&&!e.target.closest('[data-act="cancelSpin"]')){e.stopImmediatePropagation();e.preventDefault();toast('Espera el resultado o cancela el giro');}},true);
document.addEventListener('change',e=>{if(W.spinning){e.stopImmediatePropagation();e.preventDefault();}},true);
document.addEventListener('keydown',e=>{if(W.spinning&&e.key==='Escape'){e.stopImmediatePropagation();ACT.cancelSpin();}},true);
const autoGroupV1=autoGroup;autoGroup=function(initial){if(!W.spinning)autoGroupV1(initial);};
ACT.partAbsent=()=>{const sid=W.current;if(!sid)return;setAttendance(sid,'A',todayStr());wState().round=wState().round.filter(id=>id!==sid);save();closeModal();toast('Ausencia registrada en este bloque; excluido de la ruleta');};
ACT.wsrc=()=>{S.cfg.wsrc='pres';save();render();};
/* Continuidad de datos y copias */
const exportV1=exportGroupData;exportGroupData=gid=>({...exportV1(gid),alerts:S.alerts.filter(x=>x.gid===gid),transfers:S.transfers.filter(t=>t.from===gid||t.to===gid),scoreNotes:S.scoreNotes||{},activeBlocks:Object.fromEntries(Object.entries(S.activeBlocks).filter(([k])=>k.startsWith(gid+'|')))});
const mergeV1=mergeData;mergeData=d=>{
 const r=mergeV1(d);initV2();['alerts','transfers'].forEach(k=>{S[k]||=[];const ids=new Set(S[k].map(x=>x.id));(d[k]||[]).forEach(x=>{if(!ids.has(x.id)){S[k].push(x);ids.add(x.id);}});});
 Object.entries(d.att||{}).forEach(([gid,days])=>Object.entries(days).forEach(([date,day])=>{if(!day.blocks)return;const target=S.att[gid][date];const ids=new Set(target.blocks.map(b=>b.id));day.blocks.forEach(b=>{if(!ids.has(b.id)){target.blocks.push(b);ids.add(b.id);r.nr++;}});refreshDay(gid,date);}));
 S.scoreNotes||={};Object.entries(d.scoreNotes||{}).forEach(([id,notes])=>{S.scoreNotes[id]={...notes,...S.scoreNotes[id]};});return r;
};
const settingsV1=R.ajustes;R.ajustes=()=>settingsV1().replace('Funciona 100% sin conexión','Gestión de aula sin conexión · WhatsApp requiere internet').replace('En el celular: abre el archivo en Chrome → menú ⋮ → <b>Agregar a pantalla principal</b> para tenerlo como una app.','Si cambias de archivo, carpeta, navegador o dispositivo, importa tu copia JSON para recuperar los registros.')+voicePanel()+contactsSchoolHTML();
const renderV1=render;render=function(){initV2();renderV1();$('#toast').setAttribute('role','status');$('#toast').setAttribute('aria-live','polite');$('#liveName')?.setAttribute('aria-live','polite');$$('.gi').forEach(x=>{x.setAttribute('aria-label','Nota de '+sname(x.dataset.s));});};
const oldGoV2=go;go=function(v){AM2.query='';if(v==='asistencia'&&VIEW!=='asistencia')AM2.date=todayStr();oldGoV2(v);};
/* Modales accesibles: foco inicial, Tab contenido y regreso al origen */
let dialogOrigin=null;const modalV1=modal;modal=function(t,b,o={}){if($('#modal').classList.contains('hidden'))dialogOrigin=document.activeElement;modalV1(t,b,o);const box=$('#modal .mbox');box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-labelledby','mtitle');box.tabIndex=-1;setTimeout(()=>{if(!$('#modal').classList.contains('hidden')&&!$('#modal').contains(document.activeElement))box.focus();},80);};
const closeV1=closeModal;closeModal=function(){closeV1();if(dialogOrigin?.isConnected)dialogOrigin.focus();};
document.addEventListener('keydown',e=>{if(e.key!=='Tab'||$('#modal').classList.contains('hidden'))return;const list=$$('#modal button:not([disabled]),#modal input:not([type=hidden]):not([disabled]),#modal select:not([disabled]),#modal textarea').filter(x=>x.getClientRects().length);if(!list.length)return;const first=list[0],last=list.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#modal .mbox'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||!list.includes(document.activeElement))){e.preventDefault();first.focus();}});
const storageSaveV1=save;save=function(){storageSaveV1();if(!STORAGE_OK)toast('No se pudo guardar en este navegador. Descarga una copia desde Ajustes antes de cerrar.');};

function pendingAttendance(){return studs().filter(s=>attCode(S.gid,todayStr(),s.id)==='N').length;}
const navFinal=navBadge;navBadge=k=>k==='asistencia'&&G()?(pendingAttendance()?'<i class="nb dot"></i>':''):navFinal(k);
const homeFinal=R.inicio;R.inicio=()=>{let h=homeFinal();if(!S.groups.length)return h+`<div class="card mt"><h3>¿Ya usabas Aula Mágica?</h3><p>En la versión anterior, entra a Ajustes y descarga una copia completa JSON. Impórtala aquí para recuperar tus grupos y registros.</p><label class="btn">Importar copia JSON<input type="file" accept=".json,application/json" data-ch="importFile" hidden></label></div>`;const n=pendingAttendance();h=h.replace('Asistencia hoy','Asistencia · hora / bloque activo').replace('<div class="ks">Registrada</div>',`<div class="ks">${n?n+' pendientes de registrar':'Lista completa'}</div>`);return h;};

const quickHelp=`<h3>Una clase en cinco pasos</h3><ol><li><b>Asistencia:</b> elige una hora, un bloque completo de dos horas o un bloque separado por horas. Todos empiezan presentes; marca solo las novedades.</li><li><b>Después del descanso:</b> selecciona la segunda hora o crea una nueva hora. Todos empiezan presentes; marca a quienes no regresaron.</li><li><b>Notas:</b> usa “Nota directa” para un estudiante o “Nueva actividad” para completar la planilla del grupo.</li><li><b>Permisos:</b> pulsa el motivo dentro de la tarjeta. Al regresar, usa “Regresó”; la ruleta lo reincorpora.</li><li><b>Alertas:</b> elige acudiente, coordinación u orientación, revisa el mensaje y abre WhatsApp. Confirma manualmente el envío después.</li></ol><h3>Conserva tus registros</h3><p>Descarga una <b>copia completa JSON</b> desde Ajustes. Es la mejor opción antes de cambiar de archivo, navegador o dispositivo y para conservar el historial de los traslados. El archivo HTML no incluye automáticamente los datos guardados en tu navegador.</p><h3>Voz sin conexión</h3><p>En “Voz de la ruleta”, pulsa “Probar voz”. Se usan únicamente voces locales en español. Si no aparece ninguna, instala una voz en las opciones de texto a voz del dispositivo y vuelve a abrir el navegador.</p>`;
