<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4DFF">
<title>Aula Mágica 2 · Mi clase, organizada</title>
<style>
:root{
  --bg:#FFF7EC;--card:#FFFFFF;--ink:#1E1B4B;--muted:#6B6880;--line:#EFE6D8;--soft:#FBF5EC;
  --pri:#6C4DFF;--pink:#FF4D8D;--yel:#FFC93C;--grn:#16A34A;--red:#DC2626;--amb:#D97706;--cy:#0891B2;--blue:#2563EB;
  --rad:20px;--sh:0 8px 24px rgba(60,40,120,.08);--vc:#6C4DFF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Nunito",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;
  background-image:radial-gradient(#F2E4CF 1.2px,transparent 1.2px);background-size:22px 22px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .3em;line-height:1.15}
.hidden{display:none!important}
#app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
/* header */
header.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;justify-content:space-between;padding:10px 18px;
  background:linear-gradient(95deg,#5B3DF5 0%,#A23CF0 55%,#FF4D8D 100%);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 4px 18px rgba(90,40,200,.25)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:24px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px) rotate(-6deg)}}
.brand b{font-size:20px;letter-spacing:.3px;display:block}
.brand small{opacity:.85;font-size:12px}
.hdr-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hchip{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.hchip.alert{background:#fff;color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.grpSel{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:14px;padding:4px 6px 4px 12px}
.grpSel label{font-size:12px;opacity:.9;font-weight:600}
.grpSel select{background:#fff;color:var(--ink);border:0;border-radius:10px;padding:7px 10px;font-weight:700;max-width:170px}
/* nav */
nav#nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
nav#nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:8px 12px;border-radius:14px;font-size:15px;font-weight:650;color:var(--ink);cursor:pointer;text-align:left;transition:.15s}
nav#nav button:hover{background:#fff}
nav#nav .ic{font-size:21px;width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#fff);flex:none}
nav#nav button.on{background:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}
nav#nav button.on .ic{background:rgba(255,255,255,.25)}
main{padding:22px 26px 40px;max-width:1240px;width:100%;min-width:0}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  nav#nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px}
  nav#nav button{flex-direction:column;gap:1px;font-size:10.5px;padding:5px 6px;min-width:66px;text-align:center}
  nav#nav .ic{width:32px;height:32px;font-size:19px}
  nav#nav button span:last-child{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:14px 14px 110px}
  .brand small{display:none}
  header.top{padding:8px 12px;flex-wrap:wrap}
  .grpSel label{display:none}
}
/* view header */
.vh{display:flex;align-items:center;gap:14px;margin:4px 0 16px;flex-wrap:wrap}
.vh .vic{width:58px;height:58px;border-radius:18px;background:var(--vc);display:grid;place-items:center;font-size:30px;box-shadow:0 8px 18px color-mix(in srgb,var(--vc) 35%,transparent);flex:none}
.vh h2{font-size:26px;margin:0}
.vh p{margin:2px 0 0;color:var(--muted)}
.vh .vact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* cards & layout */
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:18px;margin-bottom:16px;border:1px solid #F3EADC}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{margin:0;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1000px){.cols,.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.row.end{justify-content:flex-end}
.sp{flex:1}
.muted{color:var(--muted)}
.sm{font-size:13px}
.r{text-align:right}
.mt{margin-top:12px}
/* buttons */
.btn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .08s,box-shadow .15s;white-space:nowrap}
.btn:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--vc);border-color:var(--vc);color:#fff}
.btn.ok{background:var(--grn);border-color:var(--grn);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-o{color:var(--red);border-color:#F6C9C9}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:11px}
.btn.lg{padding:14px 22px;font-size:18px;border-radius:18px}
.btn.xl{padding:18px 30px;font-size:22px;border-radius:22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{border:0;background:transparent;cursor:pointer;font-size:17px;padding:5px;border-radius:9px}
.ib:hover{background:var(--soft)}
/* inputs */
input[type=text],input[type=number],input[type=date],input[type=month],input[type=time],input[type=tel],input:not([type]),select,textarea{
  border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--vc)}
textarea{width:100%;resize:vertical;min-height:90px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>label{font-weight:700;font-size:14px}
.fld small{color:var(--muted)}
.fld input,.fld select{width:100%}
.addrow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.addrow input{flex:1;min-width:200px}
/* tip */
.tip{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--vc) 9%,#fff);border:2px dashed color-mix(in srgb,var(--vc) 35%,#fff);border-radius:16px;padding:10px 14px;margin-bottom:16px;font-size:14.5px}
.tip>span{font-size:20px}
/* chips / badges */
.badge{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.b-red{background:#FEE2E2;color:#B91C1C}.b-amb{background:#FEF3C7;color:#B45309}.b-grn{background:#DCFCE7;color:#15803D}.b-blue{background:#DBEAFE;color:#1D4ED8}.b-pur{background:#EDE9FE;color:#6D28D9}.b-gray{background:#F1F5F9;color:#475569}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:11px;font-weight:700;cursor:pointer;font-size:14px}
.seg button.on{background:#fff;color:var(--vc);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;user-select:none}
.chip.on,.chip:has(input:checked){background:var(--vc);border-color:var(--vc);color:#fff}
.chip input{display:none}
.tgl{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0;user-select:none}
.tgl input{display:none}
.tgl .sw{width:44px;height:26px;border-radius:99px;background:#D6D0C4;position:relative;flex:none;transition:.2s}
.tgl .sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl input:checked+.sw{background:var(--vc)}
.tgl input:checked+.sw::after{left:21px}
.tgl small{display:block;color:var(--muted);font-size:12.5px}
/* avatar */
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.who{display:flex;align-items:center;gap:9px}
/* tables */
.tbl-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{background:var(--soft);text-align:left;padding:9px 10px;font-size:13px;white-space:nowrap;position:sticky;top:0;z-index:1}
.tbl td{padding:8px 10px;border-top:1px solid var(--line)}
.tbl tr:hover td{background:#FFFCF7}
.tbl .stick{position:sticky;left:0;background:#fff;z-index:2}
.tbl th.stick{background:var(--soft);z-index:3}
/* empty */
.empty{text-align:center;padding:36px 18px;background:#fff;border-radius:var(--rad);box-shadow:var(--sh)}
.empty .big{font-size:64px;animation:float 3s ease-in-out infinite}
.empty.sm{padding:18px;box-shadow:none;background:var(--soft);color:var(--muted)}
/* hero */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(120deg,#6C4DFF,#A855F7 60%,#FF7AB0);color:#fff;border-radius:26px;padding:22px 26px;margin-bottom:18px;box-shadow:0 12px 30px rgba(108,77,255,.3);position:relative;overflow:hidden}
.hero h1{font-size:28px}
.hero p{margin:0;opacity:.92}
.hero-art{font-size:46px;letter-spacing:6px;animation:float 4s ease-in-out infinite}
@media(max-width:600px){.hero-art{display:none}.hero h1{font-size:23px}.hero{padding:16px 18px;margin-bottom:14px}.hero p:last-child{display:none}}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);border-left:6px solid var(--k,#6C4DFF);cursor:pointer}
.kpi .kl{font-size:13px;color:var(--muted);font-weight:700}
.kpi .kv{font-size:28px;font-weight:900;margin-top:2px}
.kpi .ks{font-size:12.5px;color:var(--muted)}
/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{border:0;border-radius:20px;padding:16px 12px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--c);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 35%,transparent);transition:transform .12s}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.tile span{font-size:34px}
/* alerts */
.alert-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--soft);margin-bottom:8px;font-size:14.5px}
.alert-item .ai{font-size:22px}
/* groups */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.gcard{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--sh);cursor:pointer;border:3px solid transparent;position:relative;transition:.15s}
.gcard.on{border-color:var(--vc)}
.gcard .gname{font-size:22px;font-weight:900}
.gcard .gcount{position:absolute;right:12px;top:12px;font-weight:800;color:var(--vc)}
/* attendance */
.stugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stu{border:3px solid #D9F2E1;background:#F3FCF6;border-radius:18px;padding:10px;display:flex;align-items:center;gap:9px;cursor:pointer;text-align:left;font-weight:700;font-size:14px;position:relative;transition:transform .1s;min-height:62px}
.stu:active{transform:scale(.95)}
.stu .st{position:absolute;right:8px;top:6px;font-size:16px}
.stu.A{border-color:#FCA5A5;background:#FEF2F2}
.stu.T{border-color:#FCD34D;background:#FFFBEB}
.stu.E{border-color:#93C5FD;background:#EFF6FF}
.stu.V{border-color:#C4B5FD;background:#F5F3FF}
.stu.dis{opacity:.4;cursor:not-allowed}
.stu .nm{line-height:1.15;padding-right:18px}
.stu .cnt{position:absolute;right:6px;bottom:5px;font-size:11px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.hist td.c{text-align:center;font-weight:800;min-width:30px;padding:6px 4px}
.cP{color:#16A34A}.cA{background:#FEE2E2!important;color:#B91C1C}.cT{background:#FEF3C7!important;color:#B45309}.cE{background:#DBEAFE!important;color:#1D4ED8}.cV{background:#EDE9FE!important;color:#6D28D9}
/* wheel */
.wheel-stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.live{font-size:26px;font-weight:900;min-height:40px;text-align:center;background:linear-gradient(90deg,#FF4D8D,#FF7A00);-webkit-background-clip:text;background-clip:text;color:transparent;transition:transform .1s}
.live.bump{transform:scale(1.12)}
.wheel-wrap{position:relative;width:100%;max-width:500px;aspect-ratio:1}
.wheel-wrap canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 24px rgba(80,30,150,.28))}
.pointer{position:absolute;left:50%;top:-6px;width:44px;height:54px;transform:translateX(-50%);z-index:3;transform-origin:50% 12px}
.pointer::before{content:"";position:absolute;left:0;top:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:50px solid #FFC93C;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.pointer::after{content:"";position:absolute;left:14px;top:4px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 -2px 3px rgba(0,0,0,.2)}
.pointer.wig{animation:wig .12s}
@keyframes wig{50%{transform:translateX(-50%) rotate(-16deg)}}
.btn.spin{background:linear-gradient(135deg,#FF4D8D,#FF7A00);color:#fff;border:0;font-size:26px;padding:16px 46px;border-radius:999px;box-shadow:0 10px 26px rgba(255,77,141,.45);letter-spacing:1px;animation:breathe 2.4s ease-in-out infinite}
.btn.spin:disabled{animation:none;opacity:.6}
@keyframes breathe{50%{transform:scale(1.05)}}
.reveal{text-align:center;padding:6px 0}
.reveal .rv-av{display:flex;justify-content:center;animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
.reveal .rv-name{font-size:36px;font-weight:900;margin:10px 0 2px;background:linear-gradient(90deg,#6C4DFF,#FF4D8D);-webkit-background-clip:text;background-clip:text;color:transparent;animation:popin .7s .1s both cubic-bezier(.2,1.6,.4,1)}
.reveal .rv-sub{color:var(--muted);font-weight:700;margin-bottom:12px}
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.comodin{perspective:600px;margin:4px auto 14px;max-width:320px}
.cflip{background:linear-gradient(135deg,#FFC93C,#FF7A00);color:#fff;border-radius:18px;padding:12px 16px;animation:flip .9s .5s both;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 18px rgba(255,122,0,.35)}
.cflip span{font-size:34px}.cflip b{font-size:18px}.cflip small{opacity:.95}
@keyframes flip{0%{transform:rotateY(90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}
.gradebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.gradebtns button{border:0;border-radius:16px;padding:12px 6px;font-weight:900;cursor:pointer;color:#fff;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.gradebtns button b{font-size:22px}
.gradebtns button:active{transform:scale(.94)}
@media(max-width:480px){.gradebtns{grid-template-columns:repeat(2,1fr)}}
.plist{max-height:320px;overflow:auto}
.pitem{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.pitem:last-child{border:0}
.progress{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress>div{height:100%;border-radius:99px;background:var(--vc);transition:width .4s}
/* caracterización */
.stack{display:flex;height:22px;border-radius:99px;overflow:hidden;margin-bottom:12px;background:#F1ECE3}
.stack>div{min-width:4px;transition:flex .4s}
.leg{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:14px}
.leg:hover,.leg.on{background:var(--soft)}
.leg.on{outline:2px solid var(--vc)}
.leg i{width:14px;height:14px;border-radius:4px;flex:none}
.leg small{color:var(--muted);width:38px;text-align:right}
/* acudientes */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ccard{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--sh);border:1px solid #F3EADC}
.cch{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cline{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--soft);margin-top:6px;font-size:14px}
.cline.main{background:#ECFEFF;outline:2px solid #A5F3FC}
.cnum{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.cnum.bad{color:#B45309}
.cbtns{display:flex;gap:6px}
.cb{width:42px;height:42px;border-radius:50%;border:0;font-size:19px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.cb.wa{background:#25D366}.cb.tel{background:#DBEAFE}
.cb:active{transform:scale(.9)}
.crow{display:grid;grid-template-columns:34px 140px 1fr 150px 34px;gap:6px;align-items:center;margin-bottom:8px}
.crow input,.crow select{width:100%;padding:8px 9px}
.crow input.low{border-color:#FCA5A5;background:#FEF2F2}
.cstar{cursor:pointer;display:grid;place-items:center;font-size:20px;filter:grayscale(1);opacity:.4}
.cstar input{display:none}.cstar:has(input:checked){filter:none;opacity:1}
@media(max-width:600px){.crow{grid-template-columns:34px 1fr 34px}.crow .c_name,.crow .c_phone{grid-column:1/-1}}
/* permits */
.outcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.outcard{border-radius:18px;padding:12px 14px;background:#ECFEFF;border:3px solid #A5F3FC;display:flex;flex-direction:column;gap:6px}
.outcard.warn{background:#FFFBEB;border-color:#FCD34D}
.outcard.over{background:#FEF2F2;border-color:#F87171;animation:pulse 1.2s infinite}
.outcard .tmr{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}
/* incidents */
.inc{border-left:6px solid var(--ic,#DC2626)}
.inc .ih{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inc .ie{font-size:30px}
.inc p{margin:6px 0}
/* grades */
.gi{width:62px;text-align:center;padding:6px 4px!important;font-weight:800}
.gi.low{border-color:#FCA5A5;background:#FEF2F2}
/* finance */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.acard{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh);cursor:pointer;border:3px solid transparent}
.acard.on{border-color:var(--vc)}
.acard .am{font-size:22px;font-weight:900}
.pos{color:var(--grn)}.neg{color:var(--red)}
.feegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.fee{border:2px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;background:#fff}
.fee.paid{background:#F0FDF4;border-color:#86EFAC}
/* tools */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.timer-svg{width:min(320px,80vw);height:min(320px,80vw)}
.tdig{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.team{border-radius:18px;padding:12px 14px;color:#fff;animation:popin .5s both cubic-bezier(.2,1.5,.4,1)}
.team h4{font-size:18px;margin-bottom:6px}
.team div{background:rgba(255,255,255,.2);border-radius:10px;padding:5px 9px;margin-top:5px;font-weight:700;font-size:14px}
.order{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.order div{background:#fff;border-radius:14px;padding:9px 12px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center;font-weight:700;animation:popin .4s both}
.order b{width:32px;height:32px;border-radius:50%;background:var(--vc);color:#fff;display:grid;place-items:center;flex:none}
.noise{width:min(260px,70vw);height:min(260px,70vw);border-radius:50%;display:grid;place-items:center;font-size:90px;transition:background .3s,box-shadow .3s;margin:auto}
.meter{height:22px;border-radius:99px;background:linear-gradient(90deg,#22C55E,#FACC15 60%,#EF4444);position:relative;overflow:hidden}
.meter>div{position:absolute;right:0;top:0;bottom:0;background:#EEE;transition:width .1s}
/* report */
.ficha h2{margin:0}
.ficha .fhead{display:flex;gap:16px;align-items:center;margin-bottom:14px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,20,70,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{background:#fff;border-radius:24px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.3);animation:up .25s cubic-bezier(.2,1.3,.4,1)}
.modal.wide .mbox{max-width:760px}
@keyframes up{from{transform:translateY(30px) scale(.96);opacity:0}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
.mhead h3{margin:0;font-size:20px}
#mbody{padding:6px 20px 8px;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px}
/* toast */
#toast{pointer-events:none;position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:#1E1B4B;color:#fff;padding:12px 20px;border-radius:16px;font-weight:700;z-index:200;transition:transform .3s cubic-bezier(.2,1.4,.4,1);max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:860px){#toast{bottom:96px}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300;width:100%;height:100%}
.banner{background:#FEF3C7;border:2px solid #FCD34D;border-radius:16px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.5px}
.banner.red{background:#FEE2E2;border-color:#FCA5A5}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0;text-align:left}
.steps div{background:var(--soft);border-radius:16px;padding:14px}
.steps b{display:block;font-size:26px}
#printArea{display:none}
@media print{
  body{background:#fff}
  body.printing #app,body.printing #modal,body.printing #toast,body.printing #confetti{display:none!important}
  body.printing #printArea{display:block;font-size:13px;color:#000}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #999;padding:4px 6px;text-align:left}
  #printArea h1{font-size:20px}#printArea h2{font-size:16px;margin-top:14px}
  .sign{display:flex;gap:30px;margin-top:50px}.sign div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}
}

/* ================= v5: navegación, accesibilidad y pulido ================= */
.navm{display:none}
.navd{display:flex;flex-direction:column;gap:2px}
.nsec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:14px 12px 4px}
.navd .nsec:first-child{padding-top:0}
nav#nav .ic{position:relative}
.nb{position:absolute;top:-6px;right:-8px;min-width:19px;height:19px;border-radius:10px;background:#EF4444;color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg);line-height:1}
.nb.dot{min-width:13px;width:13px;height:13px;padding:0;top:-3px;right:-3px}
.nb.soft{background:#F59E0B}
@media(max-width:860px){
  nav#nav{overflow:visible;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .navd{display:none}
  .navm{display:grid;grid-template-columns:repeat(5,1fr);width:100%;gap:2px}
  .navm button{min-width:0!important;padding:6px 2px!important;font-size:11px!important}
  .nb{border-color:#fff}
}
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.moregrid button{border:0;border-radius:16px;padding:12px 4px;background:color-mix(in srgb,var(--c) 12%,#fff);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--ink);position:relative}
.moregrid button.on{background:var(--c);color:#fff}
.moregrid button .ic{font-size:26px;position:relative}
.msec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:10px 0 6px}
/* accesibilidad */
:focus-visible{outline:3px solid #FFB800;outline-offset:2px;border-radius:8px}
.ib{min-width:36px;min-height:36px}
@media(max-width:860px){.ib{min-width:42px;min-height:42px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* celular: sin desbordes */
@media(max-width:600px){
  .btn{white-space:normal;text-align:center;justify-content:center}
  .vh .vact{width:100%}.vh .vact .btn{flex:1}
  .vh h2{font-size:22px}.vh .vic{width:48px;height:48px;font-size:26px}
  .row>label{max-width:100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card{padding:14px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .kv{font-size:24px}
}
select{max-width:100%}
.grid2>*,.grid3>*,.cols>*{min-width:0}
.ficha table.tbl{display:block;overflow-x:auto}
/* ayuda plegable */
.tip{position:relative}
.tip>div{flex:1}
.tipx{flex:none;align-self:flex-start;border:0;background:rgba(255,255,255,.7);border-radius:10px;cursor:pointer;font-weight:800;font-size:12px;padding:5px 8px;color:var(--muted)}
.tipmini{border:0;background:none;color:var(--vc);font-weight:700;cursor:pointer;margin:-8px 0 10px;padding:4px 0;font-size:14px}
/* deshacer */
#undo{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#1E1B4B;color:#fff;padding:10px 12px 10px 18px;border-radius:16px;z-index:210;display:flex;gap:12px;align-items:center;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.2,1.4,.4,1);max-width:92vw}
#undo.show{transform:translateX(-50%) translateY(0)}
#undo button{background:#FFC93C;border:0;border-radius:11px;padding:8px 14px;font-weight:900;cursor:pointer;color:#1E1B4B;white-space:nowrap}
@media(max-width:860px){#undo{bottom:92px}}
/* bloqueo con PIN */
#lock{position:fixed;inset:0;z-index:500;background:linear-gradient(150deg,#5B3DF5,#A23CF0 60%,#FF4D8D);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#lock .dots{display:flex;gap:14px;margin:6px 0 10px}
#lock .dots i{width:18px;height:18px;border-radius:50%;border:3px solid #fff}
#lock .dots i.f{background:#fff}
#lock .dots.err{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#lock .pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
#lock .pad button{height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:28px;font-weight:800;cursor:pointer}
#lock .pad button:active{background:rgba(255,255,255,.4)}
#lock .lnk{background:none;border:0;color:#fff;opacity:.85;text-decoration:underline;cursor:pointer;font-size:14px}
/* modo proyector */
body.proj #app{grid-template-columns:1fr}
body.proj header.top,body.proj nav#nav,body.proj .vh,body.proj .tip,body.proj .tipmini,body.proj .cols>div:not(:first-child),body.proj .view>.seg,body.proj .timer-wrap .chips,body.proj .wheel-stage>.seg,body.proj .wheel-stage>.muted{display:none!important}
body.proj main{max-width:none;padding:12px}
body.proj .cols{grid-template-columns:1fr}
body.proj .card{box-shadow:none;border:0;background:transparent}
body.proj .wheel-wrap{max-width:min(calc(100vh - 230px),94vw)}
body.proj .live{font-size:clamp(28px,5vw,60px);min-height:70px}
body.proj .timer-svg{width:min(72vh,92vw);height:min(72vh,92vw)}
body.proj{background:#1E1B4B}
body.proj .live{background:linear-gradient(90deg,#FFC93C,#FF7AB0);-webkit-background-clip:text;background-clip:text}
body.proj #tDig{fill:#fff}
body.proj [data-act=projOn]{display:none!important}
#projExit{position:fixed;top:12px;right:12px;z-index:90;display:none}
body.proj #projExit{display:inline-flex}
/* clases de hoy */
.today{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.slot{flex:none;min-width:150px;border-radius:16px;padding:10px 14px;background:#fff;box-shadow:var(--sh);cursor:pointer;border:3px solid transparent}
.slot.now{border-color:#16A34A;background:#F0FDF4}
.slot.past{opacity:.55}
.slot b{font-size:18px;display:block}
.srow{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;margin-bottom:6px}
/* pendientes */
.todo{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-bottom:6px;background:var(--soft);cursor:pointer;font-size:14.5px}
.todo.ok{background:#F0FDF4;color:#15803D}
.todo .tk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #E5DCCB;flex:none;font-size:14px}
.todo.ok .tk{background:#16A34A;border-color:#16A34A;color:#fff}
/* búsqueda global */
.sres{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:2px solid var(--line);margin-bottom:8px}
.sres:hover{border-color:#C7B8FF}

/* ================= v6: turnos y fechas ================= */
.filas{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fila{border:3px solid color-mix(in srgb,var(--tc) 35%,#fff);background:color-mix(in srgb,var(--tc) 8%,#fff);border-radius:16px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.fila.on{background:var(--tc);border-color:var(--tc);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--tc) 40%,transparent)}
.fila small{opacity:.85}
.zcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.zcol{background:var(--soft);border-radius:16px;padding:10px}
.zch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.zch .zi{font-size:26px}.zch small{display:block}
.zn{display:flex;align-items:center;gap:4px;background:#fff;border-radius:12px;padding:2px}
.zn .ib{min-width:34px;min-height:34px;font-size:20px;font-weight:900}
.zn b{min-width:20px;text-align:center}
.zcount{font-size:18px}
.zm{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:5px 6px 5px 8px;margin-top:5px;font-size:14px;font-weight:700;cursor:pointer;border:2px solid transparent}
.zm.ok{border-color:#86EFAC;background:#F0FDF4}.zm.no{border-color:#FCA5A5;background:#FEF2F2}.zm.aus{border-color:#CBD5E1;background:#F1F5F9;opacity:.75}
.zm .ib{min-width:32px;min-height:32px;font-size:14px}
.zrow{display:grid;grid-template-columns:1fr auto auto auto 36px;gap:6px;align-items:center;margin-bottom:6px}
.zrow input[type=number]{width:62px;padding:7px}
.zrow label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
@media(max-width:600px){.zrow{grid-template-columns:1fr 1fr 1fr 36px}.zrow>input:first-child{grid-column:1/-1}}
.stu.duty{cursor:pointer}
.stu.ok{border-color:#86EFAC;background:#F0FDF4}
.stu .swap{position:absolute;right:4px;bottom:2px;min-width:30px;min-height:30px;font-size:14px}
.duties{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.dcol{border-radius:16px;overflow:hidden;border:2px solid color-mix(in srgb,var(--tc) 40%,#fff);background:#fff}
.dcol .dh{background:var(--tc);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline}
.dcol .dh small{opacity:.9}
.dcol .dt{font-weight:800;padding:8px 12px 4px}
.dcol .dm{display:flex;justify-content:space-between;padding:3px 12px;font-size:14px}
.dcol .dm:last-child{padding-bottom:10px}
.tcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tcol{border-radius:16px;background:color-mix(in srgb,var(--tc) 10%,#fff);padding:10px;border:2px solid color-mix(in srgb,var(--tc) 35%,#fff)}
.tch{font-weight:900;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline}
.tch small{font-weight:700;color:var(--muted)}
.tm{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:10px;padding:7px 10px;margin-top:5px;font-weight:700;cursor:pointer;font-size:14px}
.tm:hover{outline:2px solid var(--tc)}
.opt{display:block;border:3px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;background:#fff}
.opt input{display:none}.opt.on,.opt:has(input:checked){border-color:#059669;background:#ECFDF5}
.opt small{display:block;color:var(--muted);margin-top:4px}
details.card>summary{cursor:pointer;list-style:none;font-size:16px}
details.card>summary::before{content:'▸ ';color:var(--vc)}
details.card[open]>summary::before{content:'▾ '}
.bdhero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#DB2777,#F472B6 55%,#FBBF24);color:#fff;border-radius:24px;padding:18px 22px;margin-bottom:16px;box-shadow:0 12px 26px rgba(219,39,119,.3)}
.bdcake{font-size:56px;animation:float 2s ease-in-out infinite}
.bdcake.big{font-size:110px}
.bdname{font-size:28px;font-weight:900;line-height:1.1}
.bdshow{text-align:center;padding:10px 0 4px}
.bdtitle{font-size:22px;font-weight:900;color:#DB2777;letter-spacing:1px;text-transform:uppercase}
.bdage{font-size:26px;font-weight:900;margin:6px 0}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mon{border-radius:14px;background:var(--soft);padding:10px 12px;cursor:pointer;min-height:80px}
.mon.cur{background:#FDF2F8;outline:3px solid #F9A8D4}
.mon.empty{opacity:.6}
.monh{font-weight:900;display:flex;justify-content:space-between;margin-bottom:4px}
.monh span{font-size:12px;color:#DB2777}
.mond{font-size:13.5px;padding:2px 0}
.mond b{display:inline-block;min-width:22px;color:#DB2777}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mgrid .chip{justify-content:center;padding:8px 4px}
@media(max-width:600px){.mgrid{grid-template-columns:repeat(4,1fr)}.bdname{font-size:22px}}

ound:radial-gradient(circle,#395a7cf5,#132f48fa);border:8px solid #88c1bc;border-radius:50%;align-items:center;justify-content:center;flex-direction:column;color:white;backdrop-filter:blur(14px)}.mystery.show{display:flex}.mystery b{font-size:120px;line-height:1.1}.mystery span{font-size:17px;letter-spacing:.6px}.wheel-running .wheel-wrap .pointer{visibility:hidden}.wheel-running #groupSel{pointer-events:none;opacity:.6}.wheel-running #liveName{color:#426376}.mfoot{gap:10px}.mbox{max-width:min(720px,96vw)}.modal{z-index:160}.modal.wide .mbox{max-width:min(920px,96vw)}.mbody,#mbody{overflow-wrap:anywhere}#toast{z-index:300}.outcard{background:#fffaf0;border-color:#e5d7b6}.cN{color:#8a98a2}.gi{min-height:40px}.tbl th{font-weight:750}.view{animation:none}.proj .wheel-summary,.proj .blockbar{display:none}

<div id="app">
  <header class="top">

<script>
'use strict';
/* =========================================================
   AULA MÁGICA · Núcleo: datos, utilidades, sonido, confeti
   ========================================================= */
const KEY = 'aulaMagica_v1';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => dstr(new Date());
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Math.round(n || 0).toLocaleString('es-CO');
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${+d} ${MES[m - 1]} ${y}`; };
const fmtLong = d => d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
const round1 = v => Math.round(v * 10) / 10;
const fmtN = v => v == null || isNaN(v) ? '—' : round1(v).toFixed(1);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const titleCase = s => s.trim().replace(/\s+/g, ' ').toLocaleLowerCase('es').replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toLocaleUpperCase('es'));

const DEF = () => ({
  v: 1, groups: [], gid: null, att: {}, part: [], perm: [], inc: [], acts: [], moves: [], gitems: [], scores: {}, wheel: {}, calls: [], aseo: {}, aseoGen: [], genCfg: {}, celeb: [], lastBackup: 0,
  cfg: { teacher: '', school: '', sound: true, vol: 0.8, permMin: 8, permMax: 1, partWeight: 20, passMin: 3, period: 1,
    wmode: 'est', wsrc: 'pres', wfair: true, wnorep: true, wcom: true, wdur: 'normal', customWheel: '' }
});
let STORAGE_OK = true;
function load() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) { const d = JSON.parse(r); const base = DEF(); const o = Object.assign(base, d); o.cfg = Object.assign(DEF().cfg, d.cfg || {}); return o; }
  } catch (e) { STORAGE_OK = false; }
  return DEF();
}
let S = load();
let LAST_SAVE = 0;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); STORAGE_OK = true; LAST_SAVE = Date.now(); } catch (e) { STORAGE_OK = false; } }

/* ---------- estudiantes / grupos ---------- */
function G() { return S.groups.find(g => g.id === S.gid) || null; }
function studs(gid = S.gid) { const g = S.groups.find(x => x.id === gid); return g ? [...g.students].sort((a, b) => a.name.localeCompare(b.name, 'es')) : []; }
function stu(sid) { for (const g of S.groups) { const s = g.students.find(x => x.id === sid); if (s) return s; } return null; }
function sname(sid) { return stu(sid)?.name || '(retirado)'; }
function shortName(n) { const w = n.split(' '); let s = w.slice(0, 2).join(' '); if (w.length >= 4) s = w[0] + ' ' + w[2]; return s.length > 18 ? s.slice(0, 17) + '…' : s; }
function initials(n) { return n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatar(s, size = 36) { return `<span class="av" style="width:${size}px;height:${size}px;background:hsl(${hue(s.name)} 72% 54%);font-size:${Math.round(size * .4)}px">${esc(initials(s.name))}</span>`; }

/* ---------- asistencia ---------- */
const ATT = { P: ['✅', 'Presente', 'b-grn'], A: ['❌', 'Ausente', 'b-red'], T: ['⏰', 'Llegó tarde', 'b-amb'], E: ['📄', 'Con excusa', 'b-blue'], V: ['🏃', 'Se voló de clase', 'b-pur'] };
function attRec(gid, d) { return S.att[gid]?.[d] || null; }
function attCode(gid, d, sid) { const r = attRec(gid, d); if (!r) return null; return r.marks[sid] || 'P'; }
function isPresent(gid, d, sid) { const c = attCode(gid, d, sid); return c === null || c === 'P' || c === 'T'; }
function attStats(gid, sid) {
  const days = Object.keys(S.att[gid] || {}); let p = 0, a = 0, t = 0, e = 0, v = 0;
  days.forEach(d => { const c = S.att[gid][d].marks[sid] || 'P'; if (c === 'P') p++; else if (c === 'A') a++; else if (c === 'T') t++; else if (c === 'E') e++; else if (c === 'V') v++; });
  const tot = days.length; return { tot, p, a, t, e, v, pct: tot ? Math.round((p + t) / tot * 100) : null };
}
function recentCount(gid, sid, code, n = 30) { const lim = dstr(new Date(Date.now() - n * 864e5)); return Object.entries(S.att[gid] || {}).filter(([d, r]) => d >= lim && r.marks[sid] === code).length; }
function consecAbs(gid, sid) { const days = Object.keys(S.att[gid] || {}).sort().reverse(); let n = 0; for (const d of days) { if (S.att[gid][d].marks[sid] === 'A') n++; else break; } return n; }

/* ---------- participación / notas ---------- */
function partsOf(gid, sid, per) { return S.part.filter(p => p.gid === gid && p.sid === sid && p.val != null && (per == null || p.per === per)); }
function partAvg(gid, sid, per) { const l = partsOf(gid, sid, per); return l.length ? l.reduce((a, p) => a + p.val, 0) / l.length : null; }
function actAvg(gid, sid, per) {
  const items = S.gitems.filter(i => i.gid === gid && i.per === per); let sw = 0, sv = 0;
  items.forEach(i => { const v = S.scores[i.id]?.[sid]; if (v != null && v !== '') { const w = +i.w || 0; sw += w; sv += w * v; } });
  return sw ? sv / sw : null;
}
function finalGrade(gid, sid, per) {
  const act = actAvg(gid, sid, per), pa = partAvg(gid, sid, per), pw = (+S.cfg.partWeight || 0) / 100;
  if (act == null && pa == null) return null;
  if (act == null) return pa;
  if (pa == null || !pw) return act;
  return act * (1 - pw) + pa * pw;
}
function perf(v) {
  if (v == null) return ['Sin nota', 'b-gray'];
  v = round1(v);
  if (v < +S.cfg.passMin) return ['Bajo', 'b-red'];
  if (v < 4) return ['Básico', 'b-amb'];
  if (v < 4.6) return ['Alto', 'b-blue'];
  return ['Superior', 'b-grn'];
}
const perfBadge = v => { const [t, c] = perf(v); return `<span class="badge ${c}">${v == null ? '' : fmtN(v) + ' · '}${t}</span>`; };
function parseGrade(v) { if (v == null) return null; v = String(v).trim().replace(',', '.'); if (v === '') return null; const n = parseFloat(v); if (isNaN(n) || n < 1 || n > 5) return NaN; return round1(n); }

/* ---------- permisos ---------- */
const PT = { bano: ['🚽', 'Baño'], agua: ['💧', 'Agua / tienda'], enfer: ['🏥', 'Enfermería'], coord: ['🏢', 'Coordinación'], otro: ['📋', 'Otro'] };
const outNow = gid => S.perm.filter(p => p.gid === gid && !p.back);

/* ---------- UI helpers ---------- */
function vh(ic, t, sub, act = '') { return `<div class="vh"><div class="vic">${ic}</div><div><h2>${t}</h2><p>${sub}</p></div>${act ? `<div class="vact">${act}</div>` : ''}</div>`; }
function tip(t) { const off = (S.cfg.tipsOff || {})[VIEW]; return off ? `<button class="tipmini" data-act="tipOn">❔ ¿Cómo funciona esta sección?</button>` : `<div class="tip"><span>💡</span><div>${t}</div><button class="tipx" data-act="tipOff" title="Ocultar ayuda">Entendido ✓</button></div>`; }
function noGroup() { return `<div class="empty"><div class="big">🏫</div><h3>Primero crea un grupo</h3><p class="muted">Todo en Aula Mágica se organiza por salón. Crea tu primer grupo y agrega a tus estudiantes.</p><div class="row center"><button class="btn pri lg" data-act="go" data-v="grupos">👩‍🎓 Ir a Estudiantes</button><button class="btn lg" data-act="demo">✨ Probar con ejemplo</button></div></div>`; }
function noStudents() { return `<div class="empty"><div class="big">👧🧒</div><h3>Este grupo aún no tiene estudiantes</h3><p class="muted">Agrégalos uno por uno o pega la lista completa.</p><button class="btn pri lg" data-act="go" data-v="grupos">Agregar estudiantes</button></div>`; }
function tgl(key, label, help) { return `<label class="tgl"><input type="checkbox" data-ch="cfgBool" data-k="${key}" ${S.cfg[key] ? 'checked' : ''}><span class="sw"></span><span><b>${label}</b>${help ? `<small>${help}</small>` : ''}</span></label>`; }

let TT;
function toast(msg) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(TT); TT = setTimeout(() => t.classList.remove('show'), 2800); }

let MOK = null, MCLOSE = null;
function modal(title, body, opt = {}) {
  $('#mtitle').innerHTML = title;
  $('#mbody').innerHTML = `<form id="mform" autocomplete="off" onsubmit="return false">${body}</form>`;
  const f = $('#mfoot');
  f.innerHTML = opt.ok ? `<button class="btn" data-act="closeModal">Cancelar</button><button class="btn ${opt.danger ? 'danger' : 'pri'}" data-act="modalOk" style="--vc:${opt.color || 'var(--pri)'};background:${opt.danger ? '' : (opt.color || 'var(--pri)')};border-color:${opt.danger ? '' : (opt.color || 'var(--pri)')}">${opt.ok}</button>` : '';
  f.classList.toggle('hidden', !opt.ok);
  $('#modal').className = 'modal' + (opt.wide ? ' wide' : '');
  MOK = opt.onOk || null; MCLOSE = opt.onClose || null;
  setTimeout(() => { const i = $('#mform input:not([type=hidden]):not([type=checkbox]):not([type=radio]),#mform textarea'); if (i && !opt.noFocus) i.focus(); }, 60);
}
function closeModal() { $('#modal').classList.add('hidden'); const c = MCLOSE; MOK = null; MCLOSE = null; if (c) c(); }
function formObj(f) {
  const o = {};
  for (const el of f.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') { if (el.dataset.multi) { o[el.name] = o[el.name] || []; if (el.checked) o[el.name].push(el.value); } else o[el.name] = el.checked; }
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; else if (!(el.name in o)) o[el.name] = ''; }
    else o[el.name] = el.value.trim();
  }
  return o;
}
function confirmBox(msg, cb, ok = 'Sí, continuar', danger = true) { modal('¿Estás seguro?', `<p style="font-size:17px">${msg}</p>`, { ok, danger, onOk: () => { cb(); }, noFocus: true }); }

function download(name, text, mime = 'text/plain') {
  const b = new Blob([text], { type: mime + ';charset=utf-8' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function csv(rows) { return '﻿' + rows.map(r => r.map(c => { c = String(c ?? ''); return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(';')).join('\r\n'); }
function printHTML(html) {
  $('#printArea').innerHTML = html; document.body.classList.add('printing');
  setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('printing'), 400); }, 60);
}
function printHeader(title) { const g = G(); return `<h1>${esc(title)}</h1><p><b>${esc(S.cfg.school || 'Institución Educativa')}</b> · Docente: ${esc(S.cfg.teacher || '________')} · Grupo: ${esc(g?.name || '')} · Fecha de impresión: ${fmtDate(todayStr())}</p>`; }

/* =========================================================
   SONIDO (Web Audio, 100% sintetizado: funciona sin internet)
   ========================================================= */
const SFX = {
  ctx: null,
  ac() {
    if (!S.cfg.sound) return null;
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, d = .1, type = 'sine', v = .3, when = 0, slide = null) {
    const c = this.ac(); if (!c) return; const t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, v * S.cfg.vol), t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .03);
  },
  noise(d = .05, v = .3, when = 0, freq = 2000, type = 'highpass') {
    const c = this.ac(); if (!c) return; const t = c.currentTime + when;
    const len = Math.max(1, Math.floor(c.sampleRate * d)); const b = c.createBuffer(1, len, c.sampleRate); const data = b.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain(); g.gain.value = v * S.cfg.vol; s.connect(f).connect(g).connect(c.destination); s.start(t);
  },
  tick(p = 1) { this.noise(.025, .5, 0, 3000); this.tone(1400 * p, .025, 'square', .06); },
  click() { this.tone(700, .05, 'triangle', .18); },
  pop() { this.tone(380, .12, 'sine', .3, 0, 950); },
  whoosh() { this.noise(.6, .25, 0, 700, 'bandpass'); },
  heart() { this.tone(70, .14, 'sine', .9); this.tone(60, .16, 'sine', .7, .17); },
  drumroll(dur) { for (let t = 0; t < dur; t += .042) this.noise(.05, .12 + .35 * (t / dur), t, 260, 'lowpass'); this.noise(.5, .5, dur, 180, 'lowpass'); },
  fanfare() {
    [523, 659, 784].forEach((f, i) => this.tone(f, .18, 'triangle', .3, i * .11));
    [1047, 1319, 1568].forEach(f => this.tone(f, 1.1, 'triangle', .2, .36));
    this.noise(.8, .15, .36, 6000);
  },
  sad() { [392, 370, 349, 311].forEach((f, i) => this.tone(f, .35, 'sawtooth', .1, i * .3)); },
  success() { this.tone(660, .1, 'triangle', .25); this.tone(990, .2, 'triangle', .25, .09); },
  coin() { this.tone(988, .08, 'square', .12); this.tone(1319, .3, 'square', .12, .08); },
  alarm() { for (let i = 0; i < 6; i++) { this.tone(880, .14, 'square', .2, i * .3); this.tone(660, .14, 'square', .2, i * .3 + .15); } },
  warn() { this.tone(520, .2, 'triangle', .3); this.tone(420, .3, 'triangle', .3, .22); }
};

/* =========================================================
   CONFETI
   ========================================================= */
const Confetti = {
  parts: [], run: false,
  burst(n = 180, y = .35) {
    const c = $('#confetti'); c.width = innerWidth; c.height = innerHeight;
    const cols = ['#FF4D8D', '#FFC93C', '#6C4DFF', '#22C55E', '#06B6D4', '#FF7A00', '#A855F7'];
    for (let i = 0; i < n; i++) this.parts.push({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * y, vx: (Math.random() - .5) * 18, vy: Math.random() * -16 - 4, s: Math.random() * 9 + 5, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - .5) * .35, life: 0, sh: Math.random() < .3 });
    if (!this.run) { this.run = true; this.loop(); }
  },
  loop() {
    const c = $('#confetti'), x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
    this.parts.forEach(p => { p.vy += .33; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      if (p.sh) { x.beginPath(); x.arc(0, 0, p.s / 2.4, 0, 7); x.fill(); } else x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    this.parts = this.parts.filter(p => p.y < c.height + 40 && p.life < 420);
    if (this.parts.length) requestAnimationFrame(() => this.loop()); else { this.run = false; x.clearRect(0, 0, c.width, c.height); }
  }
};

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
const VIEWS = [
  ['inicio', '🏠', 'Inicio', '#6C4DFF'],
  ['grupos', '👩‍🎓', 'Estudiantes', '#2563EB'],
  ['caract', '🏡', 'Caracterización', '#DB2777'],
  ['acud', '📞', 'Acudientes', '#0EA5E9'],
  ['asistencia', '✅', 'Asistencia', '#16A34A'],
  ['ruleta', '🎡', 'Ruleta', '#F43F5E'],
  ['permisos', '🚪', 'Permisos', '#0891B2'],
  ['novedades', '📒', 'Novedades', '#DC2626'],
  ['notas', '📊', 'Notas', '#4F46E5'],
  ['finanzas', '💰', 'Finanzas', '#D97706'],
  ['herramientas', '🧰', 'Herramientas', '#0D9488'],
  ['turnos', '🧹', 'Turnos y fechas', '#059669'],
  ['reportes', '🖨️', 'Reportes', '#475569'],
  ['ajustes', '⚙️', 'Ajustes', '#7C3AED']
];
const R = {}, AFTER = {}, ACT = {}, CH = {}, INP = {};
let VIEW = 'inicio';
function go(v) { if (VIEW === 'herramientas' && v !== 'herramientas') Noise.stop(); VIEW = v; render(); window.scrollTo({ top: 0 }); }
const NAVSEC = [['Hoy en clase', ['inicio', 'asistencia', 'ruleta', 'permisos', 'turnos', 'herramientas']], ['Seguimiento', ['novedades', 'notas', 'reportes']], ['Mis estudiantes', ['grupos', 'acud', 'caract']], ['Administración', ['finanzas', 'ajustes']]];
const MOBBAR = ['inicio', 'asistencia', 'ruleta', 'permisos'];
function navBadge(k) {
  if (!S.gid) return '';
  if (k === 'permisos') { const n = outNow(S.gid).length; return n ? `<i class="nb">${n}</i>` : ''; }
  if (k === 'novedades') { const n = S.inc.filter(i => i.gid === S.gid && i.status === 'abierto').length; return n ? `<i class="nb">${n}</i>` : ''; }
  if (k === 'asistencia') return attRec(S.gid, todayStr()) || !G()?.students.length ? '' : '<i class="nb dot"></i>';
  if (k === 'acud') { const n = studs().filter(s => !contactsOf(s).some(c => c.phone)).length; return n ? `<i class="nb soft">${n}</i>` : ''; }

function alertsFor(gid) {
  const out = []; const list = studs(gid); const t = todayStr(); const per = +S.cfg.period;
  list.forEach(s => {
    const c = consecAbs(gid, s.id);
    if (c >= 3) out.push(['🚨', `<b>${esc(s.name)}</b> lleva <b>${c} faltas seguidas</b>. Conviene contactar al acudiente.`, 3, s.id, 'falta']);
    const st = attStats(gid, s.id);
    if (st.tot >= 5 && st.pct < 80 && c < 3) out.push(['📉', `<b>${esc(s.name)}</b> tiene ${st.pct}% de asistencia (${st.a} fallas).`, 2]);
    const lt = recentCount(gid, s.id, 'T'), lv = recentCount(gid, s.id, 'V');
    if (lv) out.push(['🏃', `<b>${esc(s.name)}</b> se ha volado de clase <b>${lv} ${lv === 1 ? 'vez' : 'veces'}</b> en los últimos 30 días.`, 3, s.id, 'volada']);
    if (lt >= 3) out.push(['⏰', `<b>${esc(s.name)}</b> llegó tarde <b>${lt} veces</b> en los últimos 30 días.`, 2, s.id, 'tarde']);
    const pt = S.perm.filter(p => p.gid === gid && p.sid === s.id && p.date === t).length;
    if (pt >= 3) out.push(['🚪', `<b>${esc(s.name)}</b> ha salido <b>${pt} veces</b> hoy del salón.`, 1]);
    const fg = finalGrade(gid, s.id, per);
    if (fg != null && fg < +S.cfg.passMin) out.push(['📊', `<b>${esc(s.name)}</b> va en desempeño <b>Bajo</b> (${fmtN(fg)}) en el periodo ${per}.`, 2, s.id, 'notas']);
  });
  S.inc.filter(i => i.gid === gid && i.status !== 'cerrado' && (i.level === 'II' || i.level === 'III')).forEach(i => out.push(['⚠️', `Novedad <b>Tipo ${i.level}</b> abierta del ${fmtDate(i.date)}: ${esc((i.desc || '').slice(0, 70))}…`, 3]));
  return out.sort((a, b) => b[2] - a[2]);
}

AFTER.ruleta = () => drawWheel();
function drawWheel() {
  const cv = $('#wheel'); if (!cv) return; const items = wheelItems();
  const size = cv.parentElement.clientWidth || 400; const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(size * dpr)) { cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr); }
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2, R0 = size / 2 - 4, R = R0 - 16;
  // aro exterior con luces
  const gr = x.createLinearGradient(0, 0, size, size); gr.addColorStop(0, '#4C1D95'); gr.addColorStop(1, '#1E1B4B');
  x.beginPath(); x.arc(cx, cy, R0, 0, 7); x.fillStyle = gr; x.fill();
  const nb = 28; for (let i = 0; i < nb; i++) { const a = i / nb * Math.PI * 2; const on = (i + W.lights) % 2 === 0;
    x.beginPath(); x.arc(cx + Math.cos(a) * (R0 - 8), cy + Math.sin(a) * (R0 - 8), 3.6, 0, 7); x.fillStyle = on ? '#FFE680' : '#7C5AC7'; x.shadowColor = '#FFE680'; x.shadowBlur = on ? 10 : 0; x.fill(); }
  x.shadowBlur = 0;
  const n = items.length;
  if (!n) { x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fillStyle = '#F3EEFF'; x.fill(); x.fillStyle = '#6B6880'; x.font = '700 16px system-ui'; x.textAlign = 'center'; x.fillText(S.cfg.wmode === 'custom' ? 'Escribe tus opciones →' : 'Nadie presente para girar', cx, cy); return; }
  const seg = Math.PI * 2 / n;
  for (let i = 0; i < n; i++) {
    const a0 = W.rot + i * seg; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, R, a0, a0 + seg); x.closePath();
    let col = WCOL[i % WCOL.length]; if (n % WCOL.length === 1 && i === n - 1) col = WCOL[5];
    x.fillStyle = col; x.fill(); x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = n > 30 ? 1 : 2; x.stroke();
    x.save(); x.translate(cx, cy); x.rotate(a0 + seg / 2); x.textAlign = 'right'; x.textBaseline = 'middle';
    let fs = Math.max(9, Math.min(22, (R * seg) * .55)); const maxW = R - 14 - Math.max(24, size * .07) - 8;
    x.font = `800 ${fs}px "Segoe UI",system-ui,sans-serif`; while (fs > 8 && x.measureText(items[i].label).width > maxW) { fs -= .5; x.font = `800 ${fs}px "Segoe UI",system-ui,sans-serif`; }
    x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 3; x.fillText(items[i].label, R - 12, 1); x.restore();
  }
  // brillo
  const sh = x.createRadialGradient(cx, cy - R * .4, R * .1, cx, cy, R); sh.addColorStop(0, 'rgba(255,255,255,.18)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fillStyle = sh; x.fill();
  // centro
  const hub = x.createRadialGradient(cx - 6, cy - 6, 4, cx, cy, 36); hub.addColorStop(0, '#FFF6C8'); hub.addColorStop(1, '#FFB800');
  x.beginPath(); x.arc(cx, cy, Math.max(24, size * .07), 0, 7); x.fillStyle = hub; x.fill(); x.lineWidth = 4; x.strokeStyle = '#fff'; x.stroke();
  x.font = `${Math.max(18, size * .06)}px system-ui`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('✨', cx, cy + 1);

/* =========================================================

let CQ = 'cel', CV = 'trae', CF = null; // pregunta, respuesta a marcar, filtro {q,v}
const carOf = s => s.car || {};
const carLbl = (q, v) => v ? CARQ[q].opts[v][1] : 'Sin dato';

const viveTxt = s => { const c = carOf(s); return c.vive ? carTxt('vive', c.vive) + (c.viveQuien ? ` (${c.viveQuien})` : '') : 'Sin dato'; };

R.caract = () => {
  if (!G()) return noGroup(); const list = studs(); if (!list.length) return noStudents();
  const Q = CARQ[CQ]; if (!Q.opts[CV]) CV = Object.keys(Q.opts)[0];

  // indicadores clave
  const n = list.length, cnt = (q, v) => list.filter(s => carOf(s)[q] === v).length, filled = q => list.filter(s => carOf(s)[q]).length;

  h += `<div class="kpis">
    <div class="kpi" style="--k:#7C3AED" data-act="carFilter" data-q="cel" data-v="_tiene"><div class="kl">📱 Tienen celular</div><div class="kv">${tiene}<small style="font-size:15px;color:var(--muted)">/${n}</small></div><div class="ks">${cnt('cel', 'no')} no tienen</div></div>
    <div class="kpi" style="--k:#DB2777" data-act="carFilter" data-q="cel" data-v="trae"><div class="kl">🎒 Lo traen al colegio</div><div class="kv">${cnt('cel', 'trae')}</div><div class="ks">${cnt('cel', 'casa')} lo dejan en casa</div></div>
    <div class="kpi" style="--k:#16A34A" data-act="carFilter" data-q="vive" data-v="ambos"><div class="kl">👨‍👩‍👧 Viven con papá y mamá</div><div class="kv">${cnt('vive', 'ambos')}</div><div class="ks">${n ? Math.round(cnt('vive', 'ambos') / n * 100) : 0}% del grupo</div></div>

    <div class="kpi" style="--k:#DC2626" data-act="carFilter" data-q="net" data-v="no"><div class="kl">🌐 Sin internet en casa</div><div class="kv">${sinNet}</div><div class="ks">${cnt('net', 'datos')} solo con datos</div></div>
  </div>`;
  // gráficos de barras apiladas por pregunta
  h += `<div class="grid3">${Object.entries(CARQ).map(([q, D]) => { const f = filled(q);
    return `<div class="card"><div class="card-h"><h3>${D.t}</h3><span class="badge ${f === n ? 'b-grn' : 'b-amb'}">${f}/${n} con dato</span></div>
      <div class="stack">${Object.entries(D.opts).map(([v, o]) => { const c = cnt(q, v); return c ? `<div style="flex:${c};background:${o[2]}" title="${o[1]}: ${c}"></div>` : ''; }).join('')}${n - f ? `<div style="flex:${n - f};background:#E7E0D4" title="Sin dato: ${n - f}"></div>` : ''}</div>
      ${Object.entries(D.opts).map(([v, o]) => { const c = cnt(q, v); return `<div class="leg ${CF && CF.q === q && CF.v === v ? 'on' : ''}" data-act="carFilter" data-q="${q}" data-v="${v}"><i style="background:${o[2]}"></i><span class="sp">${o[0]} ${o[1]}</span><b>${c}</b><small>${n ? Math.round(c / n * 100) : 0}%</small></div>`; }).join('')}
      ${n - f ? `<div class="leg ${CF && CF.q === q && CF.v === '_none' ? 'on' : ''}" data-act="carFilter" data-q="${q}" data-v="_none"><i style="background:#E7E0D4"></i><span class="sp">❔ Sin dato</span><b>${n - f}</b><small>${Math.round((n - f) / n * 100)}%</small></div>` : ''}</div>`; }).join('')}</div>`;
  // lista filtrada
  if (CF) {
    const fl = carFilterList(list);
    h += `<div class="card" style="border:3px solid var(--vc)"><div class="card-h"><h3>🔎 ${carFilterLabel()} <span class="badge">${fl.length}</span></h3><div class="row"><button class="btn sm" data-act="carFilterPrint">🖨️ Imprimir lista</button><button class="btn sm" data-act="carFilter" data-q="" data-v="">✖ Quitar filtro</button></div></div>
      ${fl.length ? `<div class="chips">${fl.map(s => `<span class="badge" style="font-size:14px;padding:6px 12px">${esc(s.name)}${CF.q === 'vive' && carOf(s).viveQuien ? ` · ${esc(carOf(s).viveQuien)}` : ''}</span>`).join('')}</div>` : '<div class="empty sm">Ningún estudiante en esta categoría.</div>'}</div>`;
  }
  // marcado rápido
  h += `<div class="card"><h3>✋ Marcado rápido</h3>
    <div class="row" style="margin-bottom:10px"><b>1. Pregunta:</b><div class="seg">${Object.entries(CARQ).map(([q, D]) => `<button class="${CQ === q ? 'on' : ''}" data-act="carQ" data-v="${q}">${D.t}</button>`).join('')}</div></div>
    <div class="row" style="margin-bottom:14px"><b>2. Respuesta:</b><div class="chips">${Object.entries(Q.opts).map(([v, o]) => `<button class="chip ${CV === v ? 'on' : ''}" style="${CV === v ? `background:${o[2]};border-color:${o[2]}` : ''}" data-act="carV" data-v="${v}">${o[0]} ${o[1]}</button>`).join('')}</div></div>
    <b>3. Toca a los estudiantes:</b> <span class="muted sm">${Q.q}</span>
    <div class="stugrid mt">${list.map(s => { const c = carOf(s); const v = c[CQ]; const o = v ? Q.opts[v] : null;
      return `<button class="stu" style="${o ? `border-color:${o[2]};background:color-mix(in srgb,${o[2]} 10%,#fff)` : 'border-color:#EDE5D8;background:#fff'}" data-act="carTap" data-id="${s.id}">${avatar(s, 36)}<span class="nm">${esc(s.name)}<br><small class="muted">${o ? o[1] : '❔ sin dato'}</small></span><span class="st">${o ? o[0] : ''}</span>
        <span class="cnt" title="Celular · Vive con · Internet">${['cel', 'vive', 'net'].map(q => c[q] ? CARQ[q].opts[c[q]][0] : '·').join(' ')}</span></button>`; }).join('')}</div>
    <p class="muted sm mt">Los iconos pequeños abajo a la derecha de cada tarjeta muestran las tres respuestas: celular · con quién vive · internet. Para anotar <b>con quién exactamente</b> vive (ej. “tía Rosa”), usa ✏️ Editar estudiante en Estudiantes.</p></div>`;
  return h;
};
function carFilterList(list) {
  const { q, v } = CF;
  return list.filter(s => { const x = carOf(s)[q];
    if (v === '_none') return !x; if (v === '_tiene') return x === 'trae' || x === 'casa'; if (v === '_diff') return x && x !== 'ambos'; return x === v; });
}
function carFilterLabel() {
  const { q, v } = CF; if (v === '_none') return `${CARQ[q].t}: sin dato`; if (v === '_tiene') return '📱 Tienen celular (lo traigan o no)';
  if (v === '_diff') return '🏡 Viven con alguien diferente a papá y mamá juntos'; return `${CARQ[q].t}: ${CARQ[q].opts[v][0]} ${CARQ[q].opts[v][1]}`;
}
ACT.carQ = b => { CQ = b.dataset.v; CV = Object.keys(CARQ[CQ].opts)[0]; SFX.click(); render(); };
ACT.carV = b => { CV = b.dataset.v; SFX.click(); render(); };
ACT.carTap = b => {
  const s = stu(b.dataset.id); s.car = s.car || {};

  s.car.upd = todayStr(); save(); render();
};
ACT.carFilter = b => { const q = b.dataset.q, v = b.dataset.v; CF = !q || (CF && CF.q === q && CF.v === v) ? null : { q, v }; SFX.click(); render(); if (CF) setTimeout(() => $('.card[style*="border:3px"]')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); };
const carRow = s => { const c = carOf(s); return [s.name, carLbl('cel', c.cel), carLbl('vive', c.vive), c.viveQuien || '', carLbl('net', c.net), c.upd || '']; };
const CARHEAD = ['Estudiante', 'Celular', 'Vive con', '¿Con quién exactamente?', 'Internet en casa', 'Actualizado'];
ACT.carCSV = () => download(`caracterizacion_${G().name}.csv`, csv([CARHEAD, ...studs().map(carRow)]), 'text/csv');
ACT.carPrint = () => {

  printHTML(printHeader('Caracterización del grupo') + Object.entries(CARQ).map(([q, D]) => `<h2>${D.t}</h2><table><tr>${Object.values(D.opts).map(o => `<th>${o[1]}</th>`).join('')}<th>Sin dato</th></tr><tr>${Object.keys(D.opts).map(v => `<td>${cnt(q, v)} (${n ? Math.round(cnt(q, v) / n * 100) : 0}%)</td>`).join('')}<td>${list.filter(s => !carOf(s)[q]).length}</td></tr></table>`).join('')
    + `<h2>Detalle por estudiante</h2><table><tr>${CARHEAD.slice(0, 5).map(x => `<th>${x}</th>`).join('')}</tr>${list.map(s => `<tr>${carRow(s).slice(0, 5).map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`);
};
ACT.carFilterPrint = () => { const fl = carFilterList(studs()); printHTML(printHeader(carFilterLabel().replace(/^\S+\s/, '')) + `<table><tr><th>#</th><th>Estudiante</th><th>Acudiente</th><th>Teléfono</th><th>Detalle</th></tr>${fl.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)}</td><td>${esc(s.guardian || '')}</td><td>${esc(s.phone || '')}</td><td>${esc(carOf(s).viveQuien || '')}</td></tr>`).join('')}</table>`); };

/* formulario para el modal de editar estudiante */

function carFromForm(s, o) {

/* =========================================================
   ACUDIENTES: varios contactos por estudiante, directorio,
   mensajes por WhatsApp/SMS, historial de contactos,
   llenado rápido e importación con emparejamiento inteligente.
   ========================================================= */
const REL = ['Mamá', 'Papá', 'Abuela', 'Abuelo', 'Tía', 'Tío', 'Hermana', 'Hermano', 'Madrastra', 'Padrastro', 'Madrina', 'Padrino', 'Otro'];
const RELICO = { 'Mamá': '👩', 'Papá': '👨', 'Abuela': '👵', 'Abuelo': '👴', 'Tía': '👩‍🦱', 'Tío': '👨‍🦱', 'Hermana': '👧', 'Hermano': '👦', 'Madrastra': '👩', 'Padrastro': '👨', 'Madrina': '🤱', 'Padrino': '🧔', 'Otro': '🧑' };
/* ---- teléfonos (Colombia) ---- */
const phDigits = p => String(p || '').replace(/\D/g, '');
function phNorm(p) { let d = phDigits(p); if (d.length === 12 && d.startsWith('57')) d = d.slice(2); return d; }
function phFmt(p) { const d = phNorm(p); return d.length === 10 ? d.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3') : (p || ''); }
function phOk(p) { const d = phNorm(p); return /^3\d{9}$/.test(d) || /^60\d{8}$/.test(d) || d.length === 7; }
const waLink = (p, m) => `https://wa.me/57${phNorm(p)}?text=${encodeURIComponent(m)}`;
const smsLink = (p, m) => `sms:${phNorm(p)}?body=${encodeURIComponent(m)}`;
/* ---- modelo: s.contacts = [{id,name,rel,phone,wa,main}] ; s.guardian/s.phone quedan como espejo del principal ---- */
function normContacts(s) {
  if (!Array.isArray(s.contacts)) { s.contacts = []; if (s.guardian || s.phone) s.contacts.push({ id: uid(), name: s.guardian || '', rel: '', phone: s.phone || '', wa: true, main: true }); }
  if (s.contacts.length && !s.contacts.some(c => c.main)) s.contacts[0].main = true;
  const m = s.contacts.find(c => c.main); s.guardian = m?.name || ''; s.phone = m?.phone || '';
}
const contactsOf = s => { normContacts(s); return [...s.contacts].sort((a, b) => (b.main ? 1 : 0) - (a.main ? 1 : 0)); };
const mainC = s => contactsOf(s)[0] || null;
const cLabel = c => `${RELICO[c.rel] || '🧑'} ${esc(c.name || c.rel || 'Acudiente')}${c.rel && c.name ? ` <small class="muted">(${esc(c.rel)})</small>` : ''}`;
function siblingsOf(s, phone) { const d = phNorm(phone); if (d.length < 7) return []; const out = []; S.groups.forEach(g => g.students.forEach(x => { if (x.id !== s.id && contactsOf(x).some(c => phNorm(c.phone) === d)) out.push([x, g]); })); return out; }

/* ---- plantillas de mensajes ---- */
const TPL = {
  falta: ['❌ Inasistencia', 'Le informo que {est} no asistió hoy {fecha} a clase. ¿Nos puede indicar el motivo? Muchas gracias.'],
  tarde: ['⏰ Llegó tarde', 'Le informo que {est} llegó tarde hoy {fecha}{hora}. Le agradezco su apoyo con la puntualidad. Gracias.'],
  volada: ['🏃 Se voló', 'Le informo que {est} vino hoy {fecha} a la institución pero no estuvo en clase{hora}. Le agradezco comunicarse conmigo. Gracias.'],
  cita: ['📅 Citación', 'Le solicito acercarse a la institución el día ________ a las ________ para dialogar sobre el proceso de {est}. Gracias.'],
  notas: ['📊 Rendimiento', 'Quiero conversar con usted sobre el rendimiento académico de {est}. ¿Cuándo podemos hablar? Gracias.'],
  felic: ['⭐ Felicitación', '¡Quiero felicitar a {est}! Hoy se destacó en clase por su buen desempeño y actitud. ¡Gracias por su apoyo en casa! 🌟'],
  novedad: ['📒 Novedad', 'Le informo que hoy {fecha} se presentó una situación con {est}: {detalle} Le agradezco comunicarse conmigo.'],
  libre: ['✍️ Libre', '']
};
function buildMsg(tpl, s, c, extra = {}) {
  const g = G(); const t = todayStr(); const tm = S.att[S.gid]?.[t]?.times?.[s.id];
  const head = `Buen día${c?.name ? ' ' + c.name.split(' ')[0] : ''}. Le saluda ${S.cfg.teacher ? S.cfg.teacher + ', docente' : 'el docente'} de ${g?.name || ''}${S.cfg.school ? ' de ' + S.cfg.school : ''}. `;
  return head + (TPL[tpl]?.[1] || '').replace(/{est}/g, s.name.split(' ').slice(0, 2).join(' ')).replace(/{fecha}/g, fmtDate(t)).replace(/{hora}/g, tm ? ` (${tm})` : '').replace(/{detalle}/g, extra.detalle || '');
}
function logCall(sid, cid, ch, tpl, incId) {
  S.calls = S.calls || []; S.calls.push({ id: uid(), gid: S.gid, sid, cid, ch, tpl, date: todayStr(), time: nowTime(), inc: incId || null });
  if (incId) { const i = S.inc.find(x => x.id === incId); if (i) i.notified = true; } save();
}
const CHN = { wa: '💬 WhatsApp', sms: '✉️ SMS', tel: '📞 Llamada' };

/* =========================================================
   VISTA: DIRECTORIO DE ACUDIENTES
   ========================================================= */
let AF = 'all';
R.acud = () => {
  if (!G()) return noGroup(); const list = studs(); if (!list.length) return noStudents();
  const withC = list.filter(s => contactsOf(s).some(c => c.phone)); const sinC = list.length - withC.length;
  const multi = list.filter(s => contactsOf(s).length >= 2).length;
  const shared = list.filter(s => contactsOf(s).some(c => siblingsOf(s, c.phone).length)).length;

const toks = t => norm(t).replace(/[^a-zñ\s]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !['del', 'las', 'los'].includes(w));
function matchStudent(text, list) {
  const tt = new Set(toks(text)); let best = null, bs = 0;
  list.forEach(s => { const st = toks(s.name); if (!st.length) return; const hit = st.filter(w => tt.has(w)).length;
    const sc = hit / st.length + (hit >= 2 ? .25 : 0) + (tt.has(st[0]) ? .1 : 0); if (hit && sc > bs) { bs = sc; best = s; } });
  return bs >= .5 ? [best, Math.min(1, bs)] : [null, 0];
}
function detectRel(t) { const n = norm(t); const map = [['mama', 'Mamá'], ['madre', 'Mamá'], ['papa', 'Papá'], ['padre', 'Papá'], ['abuela', 'Abuela'], ['abuelo', 'Abuelo'], ['tia', 'Tía'], ['tio', 'Tío'], ['hermana', 'Hermana'], ['hermano', 'Hermano'], ['madrastra', 'Madrastra'], ['padrastro', 'Padrastro'], ['madrina', 'Madrina'], ['padrino', 'Padrino']];
  for (const [k, v] of map) if (new RegExp('\\b' + k + '\\b').test(n)) return v; return ''; }
let IMP = null;
ACT.acImport = () => modal('📋 Importar números de acudientes', `<p>Pega la lista como la tengas: de Excel, de un grupo de WhatsApp o escrita a mano. Una línea por acudiente. La app <b>reconoce sola</b> a qué estudiante pertenece cada número, aunque el nombre esté incompleto o sin tildes.</p>
  <p class="muted sm">Ejemplos que entiende:<br><code>Ana Sofía Pérez; Carmen Gómez; 300 123 4567</code><br><code>Mamá de Juan David - Luz Díaz 3104445566</code><br><code>santiago lopez abuela rosa 3207778899</code></p>
  <textarea name="txt" rows="9" placeholder="Pega aquí…"></textarea>`, { ok: 'Analizar ➜', color: '#0EA5E9', wide: true, onOk: (f, o) => { impAnalyze(o.txt); return false; } });
function impAnalyze(txt) {
  const list = studs(); const rows = [];
  txt.split(/\r?\n/).forEach(line => { if (!line.trim()) return;
    const m = line.match(/(\+?57[\s-]?)?(3\d{2}|60\d)[\s.-]?\d{3}[\s.-]?\d{4}|\b\d{7,10}\b/); const phone = m ? phNorm(m[0]) : '';
    const rest = m ? line.replace(m[0], ' ') : line; const [s, conf] = matchStudent(rest, list);
    const cells = rest.split(/[;\t|,]|\s[-–:]\s/).map(x => x.trim()).filter(x => /[a-zA-ZÀ-ÿ]/.test(x));
    let gname = '';
    if (cells.length >= 2 && s) gname = (cells.find(x => matchStudent(x, [s])[0] !== s) || '').split(/\s+/).filter(w => !/^(mama|mamá|papa|papá|madre|padre|abuela|abuelo|tia|tía|tio|tío|hermana|hermano|de|del|acudiente)$/i.test(w)).join(' ');
    if (!gname && s) { const st = new Set(toks(s.name)); gname = rest.replace(/[;\t|,\-–:]/g, ' ').split(/\s+/).filter(w => w && !st.has(norm(w)) && !/^(mama|mamá|papa|papá|madre|padre|abuela|abuelo|tia|tía|tio|tío|hermana|hermano|de|del|la|el|acudiente|madrina|padrino|madrastra|padrastro)$/i.test(w) && /[a-zA-ZÀ-ÿ]/.test(w)).join(' '); }
    rows.push({ line, sid: s?.id || '', conf, phone, name: titleCase(gname.replace(/[^a-zA-ZÀ-ÿñÑ\s]/g, ' ').trim()), rel: detectRel(rest) }); });
  IMP = rows;
  modal('🔎 Revisa antes de guardar', `<p class="muted sm">🟢 seguro · 🟡 revisa · 🔴 no encontré al estudiante: elígelo de la lista o déjalo en “Ignorar”.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Estudiante</th><th>Parentesco</th><th>Acudiente</th><th>Celular</th></tr></thead><tbody>${rows.map((r, i) => `<tr><td title="${esc(r.line)}">${r.sid ? (r.conf >= .8 ? '🟢' : '🟡') : '🔴'}</td>
    <td><select data-imp="${i}" data-k="sid" style="max-width:190px"><option value="">— Ignorar —</option>${list.map(s => `<option value="${s.id}" ${s.id === r.sid ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select><div class="muted" style="font-size:11px">${esc(r.line.slice(0, 50))}</div></td>
    <td><select data-imp="${i}" data-k="rel">${['', ...REL].map(x => `<option ${x === r.rel ? 'selected' : ''} value="${x}">${x || '—'}</option>`).join('')}</select></td>
    <td><input data-imp="${i}" data-k="name" value="${esc(r.name)}" style="width:140px"></td><td><input data-imp="${i}" data-k="phone" value="${esc(phFmt(r.phone))}" style="width:125px" class="${r.phone && !phOk(r.phone) ? 'low' : ''}"></td></tr>`).join('')}</tbody></table></div>`,
  { ok: `Guardar ${rows.filter(r => r.sid).length} contactos`, color: '#0EA5E9', wide: true, onOk: () => {
    $$('[data-imp]').forEach(el => { IMP[+el.dataset.imp][el.dataset.k] = el.value; });
    let n = 0, dup = 0; IMP.forEach(r => { if (!r.sid) return; const s = stu(r.sid); normContacts(s); const ph = phNorm(r.phone);
      if (ph && s.contacts.some(c => phNorm(c.phone) === ph)) { dup++; return; }
      s.contacts.push({ id: uid(), name: titleCase(r.name || ''), rel: r.rel, phone: ph, wa: true, main: !s.contacts.length }); normContacts(s); n++; });
    save(); SFX.fanfare(); if (n) Confetti.burst(100); toast(`📞 ${n} acudientes guardados${dup ? ` · ${dup} ya existían` : ''}`); render(); } });
}
const acRows = () => { const rows = []; studs().forEach(s => { const cs = contactsOf(s); if (!cs.length) rows.push([s.name, '', '', '', '']); cs.forEach(c => rows.push([s.name, c.name, c.rel, phFmt(c.phone), c.main ? 'Sí' : ''])); }); return rows; };
