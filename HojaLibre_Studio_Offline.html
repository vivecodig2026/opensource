  <style>
    :root {
      --brand: #0f766e;

      --header-bg: #f8fafc;

    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Estilos de alto rendimiento para la cuadrícula de cálculo */
    #wrap {
      flex: 1;
      overflow: auto;
      position: relative;
      outline: none;
      background: #ffffff;
    }
    table#tbl {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      user-select: none;
      width: max-content;

      position: sticky;
      top: 0;
      background: var(--header-bg);
      color: var(--header-text);
      z-index: 10;
      font-weight: 500;
      font-size: 11.5px;
      height: 25px;
      width: 96px;
      min-width: 50px;
      padding: 0;
      box-shadow: inset 0 -1px 0 #cbd5e1, inset -1px 0 0 #cbd5e1;
      transition: background-color 0.1s;
    }
    #tbl th:hover {
      background: #e2e8f0;
    }
    #tbl th.r {
      left: 0;
      top: auto;
      z-index: 9;
      width: 48px;
      min-width: 48px;
      max-width: 48px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    #tbl th.corner {
      top: 0;
      left: 0;
      z-index: 20;
      cursor: pointer;
    }

      background: #d1fae5;
      color: #065f46;
      font-weight: 700;
      box-shadow: inset 0 -2px 0 #059669, inset -1px 0 0 #cbd5e1;
    }
    #tbl th.r.hl {
      box-shadow: inset -2px 0 0 #059669, inset 0 -1px 0 #cbd5e1;
    }
    /* Tirador de redimensionamiento de columnas */
    .col-resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 5px;
      height: 100%;
      cursor: col-resize;
      z-index: 15;
    }
    .col-resizer:hover, .col-resizer.active {
      background: #0d9488;
    }

body{font-family:Arial,Helvetica,system-ui,sans-serif!important}
#studioRibbon{background:#f8fafc;border-bottom:1px solid #cbd5e1;position:relative;z-index:19}

.studio-tabs button{font-size:12px;font-weight:600;border-radius:5px 5px 0 0;padding:6px 13px;color:#334155;border-bottom:2px solid transparent;cursor:pointer}
.studio-tabs button:hover{background:#fff;color:#0f766e}.studio-tabs button.active{background:#fff;color:#115e59;border-bottom-color:#0f766e}
.studio-ribbon-buttons{display:flex;align-items:center;gap:5px;padding:6px 8px;overflow-x:auto;white-space:nowrap;min-height:44px}
.studio-tool{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:5px 9px;font-size:11px;color:#334155;border:1px solid #cbd5e1;background:#fff;border-radius:5px;cursor:pointer}
.studio-tool:hover{background:#ccfbf1;color:#115e59;border-color:#0f766e}
.studio-input{display:block;width:100%;margin:5px 0 12px;border:1px solid #cbd5e1;border-radius:6px;padding:9px;font:inherit;color:#1e293b;background:white}
.studio-input:focus{outline:2px solid #0f766e;outline-offset:1px}
.studio-stats{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
.studio-stats th,.studio-stats td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}
.studio-stats td{text-align:right;font-variant-numeric:tabular-nums}
.studio-chart{overflow-x:auto;background:white;border:1px solid #ddd;border-radius:8px;margin-top:10px}
.studio-chart svg{max-width:100%;height:auto}
.studio-button{background:#0f766e;color:white;padding:8px 14px;border-radius:7px;cursor:pointer}

<script>
'use strict';

/* ============================================================================
 * 1. MOTOR DE FÓRMULAS PURO (Sin eval, Con Caché AST y Correcciones de Auditoría)
 * ============================================================================ */
let COLS = 26;

// Conversión entre índice de columna (0 -> A, 25 -> Z, 26 -> AA) y nombre
const CN = n => {
  let s = '';
  for (n++; n > 0; n = (n - 1) / 26 | 0) s = String.fromCharCode(65 + (n - 1) % 26) + s;
  return s;
};
const CI = s => {
  let n = 0;
  for (const ch of s) n = n * 26 + ch.charCodeAt(0) - 64;
  return n - 1;
};
const ID = (r, c) => CN(c) + (r + 1);
const PR = id => {
  const m = /^([A-Z]+)(\d+)$/.exec(id);
  return m ? [+m[2] - 1, CI(m[1])] : [0, 0];
};

// Clase de Error Semántico de Hoja de Cálculo
class E {
  constructor(c) { this.c = c; }
  toString() { return this.c; }
}

// Tokenizador léxico para fórmulas
const tk = s => {
  const t = [];
  const re = /\s*(?:(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+)|"((?:[^"]|"")*)"|(\$?[a-z]{1,2}\$?\d+)(?![\w(.])|(true|false|verdadero|falso)(?![\w(])|([a-z_][\w.]*)(?=\()|(<=|>=|<>|[-+*\/^&=<>():,;%]))/iy;
  let p = 0;
  while (p < s.length) {
    re.lastIndex = p;
    const m = re.exec(s);
    if (!m) {
      if (!s.slice(p).trim()) break;
      throw new E('#NOMBRE?');
    }
    p = re.lastIndex;
    if (m[1] != null) t.push(['n', +m[1]]);
    else if (m[2] != null) t.push(['s', m[2].replace(/""/g, '"')]);
    else if (m[3]) t.push(['r', m[3].toUpperCase().replace(/\$/g, '')]);
    else if (m[4]) t.push(['b', /^(t|v)/i.test(m[4])]);
    else if (m[5]) t.push(['f', m[5].toUpperCase()]);
    else t.push(['o', m[6]]);
  }
  return t;
};

// Analizador sintáctico (Parser recursivo descendente -> AST)
const parse = s => {
  const t = tk(s);
  let i = 0, cmp;
  const ok = (...o) => t[i] && t[i][0] === 'o' && o.includes(t[i][1]);
  const bin = (sub, ops) => () => {
    let l = sub();
    while (ok(...ops)) {
      const o = t[i++][1];
      l = { t: 'bin', o, l, r: sub() };
    }
    return l;
  };
  const prim = () => {
    const k = t[i++];
    if (!k) throw new E('#ERROR!');
    if (k[0] === 'n' || k[0] === 's' || k[0] === 'b') return { t: 'v', v: k[1] };
    if (k[0] === 'r') {
      if (ok(':') && t[i + 1] && t[i + 1][0] === 'r') {
        i++;
        return { t: 'rg', a: k[1], b: t[i++][1] };
      }
      return { t: 'r', id: k[1] };
    }
    if (k[0] === 'f') {
      i++; // saltar '('
      const a = [];
      if (!ok(')')) {
        do { a.push(cmp()); } while (ok(',', ';') && (i++, true));
      }
      if (!ok(')')) throw new E('#ERROR!');
      i++;
      return { t: 'fn', n: k[1], a };
    }
    if (k[0] === 'o' && k[1] === '(') {
      const e = cmp();
      if (!ok(')')) throw new E('#ERROR!');
      i++;
      return e;
    }
    throw new E('#ERROR!');
  };
  const post = () => {
    let e = prim();
    while (ok('%')) {
      i++;
      e = { t: 'bin', o: '/', l: e, r: { t: 'v', v: 100 } };
    }
    return e;
  };
  const un = () => {
    if (ok('-', '+')) {
      const o = t[i++][1], x = un();
      return o === '-' ? { t: 'neg', x } : x;
    }
    return post();
  };
  cmp = bin(bin(bin(bin(un, ['^']), ['*', '/']), ['+', '-']), ['&']);
  const cat = cmp;
  cmp = bin(cat, ['=', '<>', '<', '>', '<=', '>=']);
  const r = cmp();
  if (i < t.length) throw new E('#ERROR!');
  return r;
};

// Coerción de tipos y utilidades de evaluación
const num = v => {
  if (v instanceof E) throw v;
  if (v === '' || v == null) return 0;
  if (typeof v === 'boolean') return +v;
  const n = typeof v === 'number' ? v : Number(String(v).trim().replace(',', '.'));
  if (Number.isNaN(n)) throw new E('#VALOR!');
  return n;
};
const str = v => {
  if (v instanceof E) throw v;
  return typeof v === 'boolean' ? (v ? 'VERDADERO' : 'FALSO') : v == null ? '' : String(v);
};
const tb = v => {
  if (typeof v === 'boolean') return v;
  if (typeof v === 'string') {
    if (/^(verdadero|true)$/i.test(v.trim())) return true;
    if (/^(falso|false)$/i.test(v.trim())) return false;
  }
  return num(v) !== 0;
};
const cv = (a, b) => {
  if (a === '') a = typeof b === 'string' ? '' : 0;
  if (b === '') b = typeof a === 'string' ? '' : 0;
  const x = typeof a, y = typeof b;
  if (x === y) return x === 'string' ? a.toLowerCase().localeCompare(b.toLowerCase()) : (a > b) - (a < b);
  return x === 'number' ? -1 : y === 'number' ? 1 : 0;
};
const rng = (a, b, X) => {
  const [r1, c1] = PR(a), [r2, c2] = PR(b);
  const R0 = Math.min(r1, r2), R1 = Math.max(r1, r2), C0 = Math.min(c1, c2), C1 = Math.max(c1, c2);
  if ((R1 - R0 + 1) * (C1 - C0 + 1) > 100000) throw new E('#REF!');
  const arr = [];
  for (let r = R0; r <= R1; r++) {
    for (let c = C0; c <= C1; c++) arr.push(X.val(ID(r, c)));
  }
  return { arr, w: C1 - C0 + 1 };
};

// Corrección de Auditoría #6: Normalizar rango o celda individual de forma segura
const asRange = x => {
  if (!x) throw new E('#VALOR!');
  if (x && Array.isArray(x.arr)) return x;
  return { arr: [x], w: 1 };
};

const flat = a => a.flatMap(x => x && x.arr ? x.arr : [x]);
const nums = a => {
  const o = [];
  for (const x of a) {
    if (x && x.arr) {
      for (const v of x.arr) {
        if (v instanceof E) throw v;
        if (typeof v === 'number') o.push(v);
      }
    } else o.push(num(x));
  }
  return o;
};
const crit = c => {
  const m = /^(<=|>=|<>|=|<|>)?([\s\S]*)$/.exec(String(c ?? ''));
  const o = m[1] || '=', v = m[2];
  const n = v !== '' && !isNaN(+v) ? +v : v;
  return x => {
    if (x instanceof E) return false;
    if (typeof x !== typeof n) return o === '<>';
    const k = cv(x, n);
    return { '=': k === 0, '<>': k !== 0, '<': k < 0, '>': k > 0, '<=': k <= 0, '>=': k >= 0 }[o];
  };
};
const sum = n => n.reduce((s, x) => s + x, 0);

// Diccionario bilingüe Español <-> Inglés para funciones
const AL = {
  SUMA: 'SUM', PROMEDIO: 'AVERAGE', CONTAR: 'COUNT', CONTARA: 'COUNTA',
  'CONTAR.BLANCO': 'COUNTBLANK', SI: 'IF', 'SI.CONJUNTO': 'IFS', Y: 'AND', O: 'OR', NO: 'NOT',
  REDONDEAR: 'ROUND', 'REDONDEAR.MAS': 'ROUNDUP', 'REDONDEAR.MENOS': 'ROUNDDOWN',
  RAIZ: 'SQRT', POTENCIA: 'POWER', ENTERO: 'INT', ABS: 'ABS',
  LARGO: 'LEN', MAYUSC: 'UPPER', MINUSC: 'LOWER', IZQUIERDA: 'LEFT', DERECHA: 'RIGHT',
  EXTRAE: 'MID', HOY: 'TODAY', AHORA: 'NOW', MEDIANA: 'MEDIAN', PRODUCTO: 'PRODUCT',
  RESIDUO: 'MOD', 'SI.ERROR': 'IFERROR', 'SUMAR.SI': 'SUMIF', 'PROMEDIO.SI': 'AVERAGEIF',
  'CONTAR.SI': 'COUNTIF', BUSCARV: 'VLOOKUP', BUSCARX: 'XLOOKUP', CONCATENAR: 'CONCAT',
  ESPACIOS: 'TRIM', 'ALEATORIO.ENTRE': 'RANDBETWEEN', DESVEST: 'STDEV'
};

// Catálogo documentado para el asistente predictivo y modal de ayuda
const FN_DOCS = [
  { es: 'SUMA', en: 'SUM', synt: 'SUMA(rango1; [rango2])', desc: 'Suma todos los números en un rango de celdas.' },

// Implementación de Funciones del Motor
const F = {
  SUM: a => sum(nums(a)),
  AVERAGE: a => { const n = nums(a); if (!n.length) throw new E('#DIV/0!'); return sum(n) / n.length; },
  MIN: a => { const n = nums(a); return n.length ? n.reduce((m, x) => x < m ? x : m, Infinity) : 0; },
  MAX: a => { const n = nums(a); return n.length ? n.reduce((m, x) => x > m ? x : m, -Infinity) : 0; },
  COUNT: a => nums(a).length,
  COUNTA: a => flat(a).filter(v => v !== '' && v != null).length,
  COUNTBLANK: a => flat(a).filter(v => v === '' || v == null).length,
  PRODUCT: a => { const n = nums(a); return n.length ? n.reduce((s, x) => s * x, 1) : 0; },
  MEDIAN: a => {
    const n = nums(a).sort((x, y) => x - y);
    if (!n.length) throw new E('#NUM!');
    const h = n.length >> 1;
    return n.length % 2 ? n[h] : (n[h - 1] + n[h]) / 2;
  },
  STDEV: a => {
    const n = nums(a);
    if (n.length < 2) throw new E('#DIV/0!');
    const avg = sum(n) / n.length;
    const sqDiff = n.reduce((acc, val) => acc + (val - avg) ** 2, 0);
    return Math.sqrt(sqDiff / (n.length - 1));
  },
  ROUND: a => {
    const x = num(a[0]), k = 10 ** (a[1] === undefined ? 0 : num(a[1]));
    return Math.sign(x) * Math.round(Math.abs(x) * k + 1e-9) / k;
  },
  ROUNDUP: a => {
    const x = num(a[0]), k = 10 ** (a[1] === undefined ? 0 : num(a[1]));
    return Math.sign(x) * Math.ceil(Math.abs(x) * k - 1e-9) / k;
  },
  ROUNDDOWN: a => {
    const x = num(a[0]), k = 10 ** (a[1] === undefined ? 0 : num(a[1]));
    return Math.sign(x) * Math.floor(Math.abs(x) * k + 1e-9) / k;
  },
  ABS: a => Math.abs(num(a[0])),
  INT: a => Math.floor(num(a[0])),
  SQRT: a => { const x = num(a[0]); if (x < 0) throw new E('#NUM!'); return Math.sqrt(x); },
  POWER: a => { const r = Math.pow(num(a[0]), num(a[1])); if (!Number.isFinite(r)) throw new E('#NUM!'); return r; },
  MOD: a => { const x = num(a[0]), d = num(a[1]); if (!d) throw new E('#DIV/0!'); return x - d * Math.floor(x / d); },
  RANDBETWEEN: a => {
    const lo = Math.ceil(num(a[0])), hi = Math.floor(num(a[1]));
    if (lo > hi) throw new E('#NUM!');
    return Math.floor(Math.random() * (hi - lo + 1)) + lo;
  },
  AND: a => flat(a).every(tb),
  OR: a => flat(a).some(tb),
  NOT: a => !tb(a[0]),
  CONCAT: a => flat(a).map(str).join(''),
  LEN: a => str(a[0]).length,
  UPPER: a => str(a[0]).toUpperCase(),
  LOWER: a => str(a[0]).toLowerCase(),
  TRIM: a => str(a[0]).trim().replace(/\s+/g, ' '),
  LEFT: a => str(a[0]).slice(0, a[1] === undefined ? 1 : Math.max(0, num(a[1]))),
  RIGHT: a => {
    const s = str(a[0]), n = a[1] === undefined ? 1 : Math.max(0, num(a[1]));
    return s.slice(Math.max(0, s.length - n));
  },
  MID: a => {
    const s = str(a[0]), start = Math.max(1, num(a[1])) - 1, len = Math.max(0, num(a[2]));
    return s.slice(start, start + len);
  },
  TODAY: () => new Date().toISOString().slice(0, 10),
  NOW: () => {
    const d = new Date();
    return d.toISOString().slice(0, 10) + ' ' + d.toTimeString().slice(0, 5);
  },
  // Corrección de Auditoría #6: Uso de asRange() para evitar TypeError cuando no se pasa rango
  SUMIF: a => {
    if (a.length < 2) throw new E('#ERROR!');
    const r = asRange(a[0]).arr, f = crit(a[1]), s = a[2] ? asRange(a[2]).arr : r;
    return r.reduce((t, v, i) => f(v) && typeof s[i] === 'number' ? t + s[i] : t, 0);
  },
  AVERAGEIF: a => {
    if (a.length < 2) throw new E('#ERROR!');
    const r = asRange(a[0]).arr, f = crit(a[1]), s = a[2] ? asRange(a[2]).arr : r;
    const matched = [];
    r.forEach((v, i) => { if (f(v) && typeof s[i] === 'number') matched.push(s[i]); });
    if (!matched.length) throw new E('#DIV/0!');
    return sum(matched) / matched.length;
  },
  COUNTIF: a => {
    if (a.length < 2) throw new E('#ERROR!');
    const r = asRange(a[0]).arr, f = crit(a[1]);
    return r.filter(f).length;
  },
  VLOOKUP: a => {
    if (a.length < 3) throw new E('#ERROR!');
    const [x, rawG, i, ex] = a;
    const g = asRange(rawG), w = g.w, n = num(i);
    if (n < 1 || n > w) throw new E('#REF!');
    const h = g.arr.length / w, exact = ex !== undefined && !tb(ex);
    let hit = -1;
    for (let r = 0; r < h; r++) {
      const c = cv(g.arr[r * w], x);
      if (exact ? c === 0 : c <= 0) hit = r;
      if (exact && c === 0) break;
      if (!exact && c > 0) break;
    }
    if (hit < 0) throw new E('#N/D');
    return g.arr[hit * w + n - 1];
  },
  XLOOKUP: a => {
    if (a.length < 3) throw new E('#ERROR!');
    const [x, rawSearch, rawReturn, notFound] = a;
    const sArr = asRange(rawSearch).arr;
    const rArr = asRange(rawReturn).arr;
    const idx = sArr.findIndex(v => cv(v, x) === 0);
    if (idx < 0) {
      if (notFound !== undefined) return notFound;
      throw new E('#N/D');
    }
    return idx < rArr.length ? rArr[idx] : '';
  }
};

// Despachador de funciones con evaluación perezosa para IF, IFS e IFERROR
let call = (n, X) => {
  const nm = AL[n.n] || n.n;
  if (nm === 'IF') {
    if (n.a.length < 2) throw new E('#ERROR!');
    return tb(ev(n.a[0], X)) ? ev(n.a[1], X) : n.a[2] ? ev(n.a[2], X) : false;
  }
  if (nm === 'IFS') {
    for (let i = 0; i + 1 < n.a.length; i += 2) {
      if (tb(ev(n.a[i], X))) return ev(n.a[i + 1], X);
    }
    throw new E('#N/D');
  }
  if (nm === 'IFERROR') {
    if (n.a.length < 2) throw new E('#ERROR!');
    try {
      const res = ev(n.a[0], X);
      if (res instanceof E) return ev(n.a[1], X);
      return res;
    } catch (e) {
      if (e instanceof E) return ev(n.a[1], X);
      throw e;
    }
  }
  const f = F[nm];
  if (!f) throw new E('#NOMBRE?');
  return f(n.a.map(x => x.t === 'rg' ? rng(x.a, x.b, X) : ev(x, X)));
};

// Evaluador de nodos AST
const ev = (n, X) => {
  switch (n.t) {
    case 'v': return n.v;
    case 'r': {
      const v = X.val(n.id);
      if (v instanceof E) throw v;
      return v;
    }
    case 'neg': return -num(ev(n.x, X));
    case 'rg': throw new E('#VALOR!');
    case 'fn': return call(n, X);
    case 'bin': {
      const a = ev(n.l, X), b = ev(n.r, X);
      switch (n.o) {
        case '+': return num(a) + num(b);
        case '-': return num(a) - num(b);
        case '*': return num(a) * num(b);
        case '/': {
          const d = num(b);
          if (!d) throw new E('#DIV/0!');
          return num(a) / d;
        }
        case '^': {
          const r = Math.pow(num(a), num(b));
          if (!Number.isFinite(r)) throw new E('#NUM!');
          return r;
        }
        case '&': return str(a) + str(b);
        default: {
          const c = cv(a, b);
          return { '=': c === 0, '<>': c !== 0, '<': c < 0, '>': c > 0, '<=': c <= 0, '>=': c >= 0 }[n.o];
        }
      }
    }
  }
};

const lit = s => {
  const t = s.trim();
  if (/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return +t;
  if (/^[-+]?\d+(\.\d+)?%$/.test(t)) return +t.slice(0, -1) / 100;
  return s;
};

const astCache = new Map();
const Engine = cells => {
  const memo = new Map(), stk = new Set();
  const X = {
    val(id) {
      if (memo.has(id)) return memo.get(id);
      if (stk.has(id)) throw new E('#CIRC!');
      const c = cells[id];
      let v;
      if (!c || c.raw === '') v = '';
      else if (c.raw[0] === '=') {
        stk.add(id);
        try {
          let a = astCache.get(c.raw);
          if (!a) {
            if (astCache.size > 5000) astCache.clear();
            a = parse(c.raw.slice(1));
            astCache.set(c.raw, a);
          }
          v = ev(a, X);
        } catch (e) {
          v = e instanceof E ? e : new E('#ERROR!');
        } finally {
          stk.delete(id);
        }
      } else {
        v = lit(c.raw);
      }
      memo.set(id, v);
      return v;
    }
  };
  return X.val;
};

// Desplazamiento de referencias relativas y absolutas ($A$1) ignorando cadenas
const shift = (raw, dr, dc) =>
  raw[0] !== '='
    ? raw
    : raw
        .split(/("(?:[^"]|"")*")/)
        .map((p, i) =>
          i % 2
            ? p
            : p.replace(/(?<![A-Za-z0-9_.])(\$?)([A-Za-z]{1,2})(\$?)(\d+)(?![\w(.])/g, (m, a, L, b, n) => {
                const c = CI(L.toUpperCase()) + (a ? 0 : dc);
                const r = +n + (b ? 0 : dr);
                return c < 0 || r < 1 ? '#REF!' : a + (a ? L.toUpperCase() : CN(c)) + b + r;
              })
        )
        .join('');

// Corrección de Auditoría #2: Traducción completa y segura de fórmulas para exportación .xlsx
const en = f =>
  f
    .split(/("(?:[^"]|"")*")/)
    .map((p, i) =>
      i % 2
        ? p
        : p
            .replace(/;/g, ',')
            .replace(/\b(VERDADERO|FALSO)\b/gi, m => (/^v/i.test(m) ? 'TRUE' : 'FALSE'))
            .replace(/([A-Za-z_][\w.]*)(?=\()/g, m => AL[m.toUpperCase()] || m.toUpperCase())
    )
    .join('');

// Sistema de Modales Personalizados (Sin alert/confirm bloqueantes)
function showModal({ title, html, confirmText = 'Aceptar', cancelText = 'Cancelar', danger = false, onConfirm }) {
  const overlay = $('#modalOverlay');
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = html;
  const footer = $('#modalFooter');
  footer.innerHTML = '';

  const close = () => {
    overlay.classList.add('hidden');
    overlay.classList.remove('flex');
    wrap.focus();
  };

  if (cancelText) {
    const btnCancel = document.createElement('button');
    btnCancel.className = 'px-3.5 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-slate-700 font-medium text-xs transition';
    btnCancel.textContent = cancelText;
    btnCancel.onclick = close;
    footer.appendChild(btnCancel);
  }

  if (confirmText) {
    const btnOk = document.createElement('button');
    btnOk.className = `px-3.5 py-1.5 rounded-lg text-white font-medium text-xs transition shadow-sm ${
      danger ? 'bg-red-600 hover:bg-red-500' : 'bg-teal-700 hover:bg-teal-600'
    }`;
    btnOk.textContent = confirmText;
    btnOk.onclick = () => {
      close();
      if (onConfirm) onConfirm();
    };
    footer.appendChild(btnOk);
  }

  $('#modalCloseX').onclick = close;
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
}

// Construcción de la cuadrícula HTML con soporte de anchos de columna personalizados
function build() {
  let h = '<thead><tr><th class="corner r" title="Seleccionar toda la hoja">◢</th>';
  for (let c = 0; c < COLS; c++) {
    const w = colWidths[c] ? `style="width:${colWidths[c]}px;min-width:${colWidths[c]}px;max-width:${colWidths[c]}px"` : '';
    h += `<th data-c="${c}" ${w} class="relative">${CN(c)}<div class="col-resizer" data-rc="${c}"></div></th>`;
  }
  h += '</tr></thead><tbody>';
  for (let r = 0; r < ROWS; r++) {
    h += `<tr><th class="r" data-r="${r}">${r + 1}</th>`;
    for (let c = 0; c < COLS; c++) {
      const w = colWidths[c] ? `style="width:${colWidths[c]}px;min-width:${colWidths[c]}px;max-width:${colWidths[c]}px"` : '';
      h += `<td data-r="${r}" data-c="${c}" ${w}></td>`;
    }
    h += '</tr>';
  }
  tbl.innerHTML = h + '</tbody>';
  prev = [];
  renderedIds.clear();
  document.body.classList.toggle('freeze-row1', !!sheets[activeSheetIdx].freeze);
  $('#btnFreeze').classList.toggle('bg-teal-100', !!sheets[activeSheetIdx].freeze);
  $('#btnFreeze').classList.toggle('text-teal-800', !!sheets[activeSheetIdx].freeze);
}

// Formateador de números y valores
const fmt = (v, s) => {
  if (v instanceof E) return String(v);
  if (typeof v === 'boolean') return v ? 'VERDADERO' : 'FALSO';
  if (typeof v !== 'number') return v;
  switch (s.fm) {
    case 'd2':
      return v.toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    case 'mil':
      return v.toLocaleString('es-CO', { maximumFractionDigits: 2 });
    case 'cop':
      return '$ ' + v.toLocaleString('es-CO', { maximumFractionDigits: 0 });
    case 'usd':
      return 'US$ ' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    case 'date': return Number.isFinite(v) ? new Date(Date.UTC(1899,11,30)+v*86400000).toISOString().slice(0,10) : String(v);
    case 'pct':
      return (v * 100).toLocaleString('es-CO', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + '%';
  }
  return String(+v.toPrecision(12));
};

// Aplicar estilo sanitizado a una celda DOM
function applyCellStyle(t, s, v, c) {
  const w = colWidths[c];
  t.style.width = w ? w + 'px' : '';
  t.style.minWidth = w ? w + 'px' : '';
  t.style.maxWidth = w ? w + 'px' : '';
  t.style.fontWeight = s.b ? '700' : '';
  t.style.fontStyle = s.i ? 'italic' : '';
  t.style.textDecoration = s.u ? 'underline' : '';
  t.style.textAlign = safeAlign(s.al) || (typeof v === 'number' ? 'right' : v instanceof E || typeof v === 'boolean' ? 'center' : 'left');
  t.style.backgroundColor = safeColor(s.bg);
  t.style.color = safeColor(s.fc);
  t.style.fontSize = s.fs ? cl(Number(s.fs),10,28)+'px' : '';
  t.style.whiteSpace = s.wrap ? 'normal' : '';
  t.style.border = s.border ? '1px solid #64748b' : '';
}

// Corrección de Auditoría de Rendimiento: refresh() diferencial O(N_celdas_activas)
function refresh() {
  val = Engine(cells);
  const toCheck = new Set([...Object.keys(cells), ...renderedIds]);
  const nextRendered = new Set();

  for (const id of toCheck) {
    const [r, c] = PR(id);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
    const t = td(r, c);
    if (!t) continue;
    const k = cells[id];

    if (!k) {
      if (t.textContent !== '') t.textContent = '';
      applyCellStyle(t, {}, '', c);
      t.classList.remove('err');
      continue;
    }

    const v = val(id), s = k.st || {}, x = fmt(v, s);
    if (t.textContent !== x) t.textContent = x;
    applyCellStyle(t, s, v, c);
    t.classList.toggle('err', v instanceof E);
    nextRendered.add(id);
  }
  renderedIds = nextRendered;
}

const box = () => [Math.min(anc[0], foc[0]), Math.max(anc[0], foc[0]), Math.min(anc[1], foc[1]), Math.max(anc[1], foc[1])];

function updateToolbarState() {
  const cell = cells[ID(anc[0], anc[1])];
  const st = (cell && cell.st) || {};
  $('#btnB').classList.toggle('bg-teal-100', !!st.b);
  $('#btnI').classList.toggle('bg-teal-100', !!st.i);
  $('#btnU').classList.toggle('bg-teal-100', !!st.u);
  $('#btnAlL').classList.toggle('bg-teal-100', st.al === 'left');
  $('#btnAlC').classList.toggle('bg-teal-100', st.al === 'center');
  $('#btnAlR').classList.toggle('bg-teal-100', st.al === 'right');
  $('#fm').value = st.fm || 'g';
}

function positionFillHandle() {
  if (editing) {
    fillHandle.style.display = 'none';
    return;
  }
  const [, r1, , c1] = box();
  const cornerTd = td(r1, c1);
  if (!cornerTd) return;
  fillHandle.style.display = 'block';
  fillHandle.style.left = (cornerTd.offsetLeft + cornerTd.offsetWidth - 4) + 'px';
  fillHandle.style.top = (cornerTd.offsetTop + cornerTd.offsetHeight - 4) + 'px';
}

function drawSel(scroll = true) {
  prev.forEach(e => e.classList.remove('s', 'a', 'hl'));
  prev = [];
  const [r0, r1, c0, c1] = box();

  // Sombrear celdas seleccionadas (limitado visualmente si es selección completa)
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const e = td(r, c);
      if (e) { e.classList.add('s'); prev.push(e); }
    }
  }
  for (let c = c0; c <= c1; c++) {
    const e = tbl.rows[0]?.cells[c + 1];
    if (e) { e.classList.add('hl'); prev.push(e); }
  }
  for (let r = r0; r <= r1; r++) {
    const e = tbl.rows[r + 1]?.cells[0];
    if (e) { e.classList.add('hl'); prev.push(e); }
  }

  const a = td(anc[0], anc[1]);
  if (a) { a.classList.add('a'); prev.push(a); }

  const activeId = ID(anc[0], anc[1]);
  $('#nm').value = (r0 === r1 && c0 === c1) ? activeId : `${ID(r0, c0)}:${ID(r1, c1)}`;
  if (!editing && document.activeElement !== fx) {
    fx.value = raw(activeId);
  }

  updateToolbarState();
  positionFillHandle();

  if (scroll) {
    td(foc[0], foc[1])?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  // Cálculo eficiente de estadísticas sobre las celdas pobladas dentro del rango
  const n = [];
  let countNonEmpty = 0;
  for (const id in cells) {
    const [r, c] = PR(id);
    if (r >= r0 && r <= r1 && c >= c0 && c <= c1) {
      const v = val(id);
      if (v !== '' && v != null) countNonEmpty++;
      if (typeof v === 'number') n.push(v);
    }
  }
  if (n.length > 1) {
    const s = +sum(n).toPrecision(12);
    const avg = +(sum(n) / n.length).toPrecision(8);
    const minV = Math.min(...n);
    const maxV = Math.max(...n);
    $('#st').textContent = `Suma: ${s.toLocaleString('es-CO')}  |  Promedio: ${avg.toLocaleString('es-CO')}  |  Mín: ${minV.toLocaleString('es-CO')}  |  Máx: ${maxV.toLocaleString('es-CO')}  |  Recuento: ${countNonEmpty}`;
  } else if (countNonEmpty > 1) {
    $('#st').textContent = `Recuento: ${countNonEmpty}`;
  } else {
    $('#st').textContent = 'Listo';
  }
}

/* ============================================================================
 * 4. TRANSACCIONES CON DESHACER / REHACER Y GESTIÓN DE ESTILOS
 * ============================================================================ */
const put = ch => {
  const b = [];
  for (const [id, n] of ch) {
    b.push([id, cells[id] ? { raw: cells[id].raw, st: { ...cells[id].st } } : null]);
    if (n && (n.raw !== '' || Object.keys(n.st || {}).length)) {
      cells[id] = { raw: n.raw, st: { ...(n.st || {}) } };
    } else {
      delete cells[id];
    }
  }
  return b;
};

const changed = () => {
  refresh();
  drawSel(false);
  save();
};

const tx = ch => {
  if (!ch.length) return;
  const denied=ch.some(([id])=>sheets[activeSheetIdx].locks?.[id]);
  if(denied){msg('Hay celdas protegidas en la selección');return;}
  const invalid=ch.some(([id,n])=>n&&n.raw!==undefined&&!studio.valid(id,String(n.raw)));
  if(invalid){msg('La selección contiene datos que no cumplen la validación');return;}
  const b = put(ch);
  hist.push({ b, a: ch });
  if (hist.length > 300) hist.shift();
  redo.length = 0;
  changed();
};

const undo = () => {
  const h = hist.pop();
  if (!h) return;
  put(h.b.slice().reverse());
  redo.push(h);
  changed();
};

const rdo = () => {
  const h = redo.pop();
  if (!h) return;
  put(h.a);
  hist.push(h);
  changed();
};

const nrm = t => String(t).replace(/^(-?\d+),(\d+)$/, '$1.$2');
const setRaw = (id, t) => [id, { raw: nrm(t), st: cells[id] ? { ...cells[id].st } : {} }];
const each = f => {
  const [r0, r1, c0, c1] = box(), o = [];
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) o.push(f(ID(r, c), r, c));
  }
  return o;
};

function sty(k, v) {
  const a = cells[ID(anc[0], anc[1])];
  if (k === 'b' || k === 'i' || k === 'u') v = a && a.st[k] ? undefined : true;
  if (v === 'g') v = undefined;
  tx(
    each(id => {
      const o = cells[id] || { raw: '', st: {} };
      const st = { ...o.st };
      if (v === undefined) delete st[k];
      else st[k] = v;
      return [id, { raw: o.raw, st }];
    })
  );
  wrap.focus();
}

/* ============================================================================
 * 5. EDICIÓN EN CELDA (#ed), BARRA DE FÓRMULAS (#fx) Y AUTOCOMPLETADO
 * ============================================================================ */
function updateFormulaHint(text) {
  const hintBox = $('#fnHint');
  if (!text || text[0] !== '=') {
    hintBox.classList.add('hidden');
    return;
  }
  const m = /([A-Za-z_][\w.]*)\(?[^()]*$/.exec(text.slice(1));
  if (!m) {
    hintBox.classList.add('hidden');
    return;
  }
  const token = m[1].toUpperCase();
  const matches = FN_DOCS.filter(d => d.es.startsWith(token) || d.en.startsWith(token)).slice(0, 4);
  if (!matches.length) {
    hintBox.classList.add('hidden');
    return;
  }
  hintBox.innerHTML = matches
    .map(
      d => `<div class="py-1 border-b border-slate-800 last:border-0">
        <div class="font-bold text-emerald-400 mono">${d.synt} <span class="text-slate-400 font-normal">(${d.en})</span></div>
        <div class="text-slate-300 text-[11px]">${d.desc}</div>
      </div>`
    )
    .join('');
  hintBox.classList.remove('hidden');
}

function edit(init, mode) {
  const t = td(anc[0], anc[1]);
  if (!t) return;
  editing = true;
  emode = mode;
  fillHandle.style.display = 'none';
  Object.assign(ed.style, {
    display: 'block',
    left: t.offsetLeft + 'px',
    top: t.offsetTop + 'px',
    minWidth: Math.max(t.offsetWidth, 120) + 'px',
    height: t.offsetHeight + 'px'
  });
  ed.value = init != null ? init : raw(ID(anc[0], anc[1]));
  fx.value = ed.value;
  updateFormulaHint(ed.value);
  ed.focus();
  ed.setSelectionRange(ed.value.length, ed.value.length);
}

function commit() {
  $('#fnHint').classList.add('hidden');
  if (!editing) return false;
  editing = false;
  ed.style.display = 'none';
  const id = ID(anc[0], anc[1]);
  if (ed.value !== raw(id)) {
    tx([setRaw(id, ed.value)]);
  } else {
    positionFillHandle();
  }
  return true;
}

function cancel() {
  $('#fnHint').classList.add('hidden');
  editing = false;
  ed.style.display = 'none';
  drawSel(false);
  wrap.focus();
}

function go(dr, dc, ext) {
  const b = ext ? foc : anc;
  const n = [cl(b[0] + dr, 0, ROWS - 1), cl(b[1] + dc, 0, COLS - 1)];
  foc = n;
  if (!ext) anc = n.slice();
  drawSel();
}

ed.addEventListener('input', () => {
  fx.value = ed.value;
  updateFormulaHint(ed.value);
});
ed.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') {
    cancel();
    return;
  }
  const mv =
    { Enter: [e.shiftKey ? -1 : 1, 0], Tab: [0, e.shiftKey ? -1 : 1] }[k] ||
    (emode === 'enter' && { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k]);
  if (mv) {
    e.preventDefault();
    commit();
    go(mv[0], mv[1]);
    wrap.focus();
  }
});
ed.addEventListener('blur', () => {
  if (editing) commit();
});

// Corrección de Auditoría #1: Sincronización completa de barra #fx (input, blur, Enter, Escape)
fx.addEventListener('input', () => {
  if (editing) ed.value = fx.value;
  updateFormulaHint(fx.value);
});
fx.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    $('#fnHint').classList.add('hidden');
    editing = false;
    ed.style.display = 'none';
    tx([setRaw(ID(anc[0], anc[1]), fx.value)]);
    wrap.focus();
    go(1, 0);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    $('#fnHint').classList.add('hidden');
    fx.value = raw(ID(anc[0], anc[1]));
    if (editing) cancel();
    else wrap.focus();
  }
});
fx.addEventListener('blur', () => {
  $('#fnHint').classList.add('hidden');
  if (editing) return;
  const id = ID(anc[0], anc[1]);
  if (fx.value !== raw(id)) {
    tx([setRaw(id, fx.value)]);
  }
});

/* ============================================================================
 * 6. RATÓN, REDIMENSIONAMIENTO DE COLUMNAS Y CUADRO DE RELLENO (FILL HANDLE)
 * ============================================================================ */
let resizingCol = null, resizeStartX = 0, resizeStartW = 96;

tbl.addEventListener('mousedown', e => {
  // ¿Clic en redimensionador de columna?
  const resizer = e.target.closest('.col-resizer');
  if (resizer) {
    e.preventDefault();
    e.stopPropagation();
    const c = +resizer.dataset.rc;
    const th = tbl.rows[0].cells[c + 1];
    resizingCol = c;
    resizeStartX = e.clientX;
    resizeStartW = th.offsetWidth;
    resizer.classList.add('active');
    return;
  }

  const t = e.target.closest('td,th');
  if (!t) return;

  if (t.tagName === 'TD') {
    const r = +t.dataset.r, c = +t.dataset.c;
    // Insertar referencia de celda haciendo clic mientras se edita una fórmula
    const activeInput = editing ? ed : document.activeElement === fx ? fx : null;
    if (activeInput && activeInput.value[0] === '=' && /[-+*\/^&=<>(,;:\s]$/.test(activeInput.value)) {
      e.preventDefault();
      activeInput.value += ID(r, c);
      if (activeInput === ed) fx.value = ed.value;
      return;
    }
    if (document.activeElement === fx) fx.blur();
    commit();
    foc = [r, c];
    if (!e.shiftKey) anc = [r, c];
    drag = true;
  } else if (t.dataset.c != null) {
    commit();
    const c = +t.dataset.c;
    anc = [0, c];
    foc = [ROWS - 1, c];
  } else if (t.dataset.r != null) {
    commit();
    const r = +t.dataset.r;
    anc = [r, 0];
    foc = [r, COLS - 1];
  } else {
    commit();
    anc = [0, 0];
    foc = [ROWS - 1, COLS - 1];
  }
  drawSel(false);
  wrap.focus();
  e.preventDefault();
});

// Iniciar arrastre desde el Fill Handle (esquina inferior derecha)
let fillBaseBox = null;
fillHandle.addEventListener('mousedown', e => {
  e.preventDefault();
  e.stopPropagation();
  commit();
  fillDrag = true;
  fillBaseBox = box();
});

tbl.addEventListener('mouseover', e => {
  if (!drag && !fillDrag) return;
  const t = e.target.closest('td');
  if (t) {
    foc = [+t.dataset.r, +t.dataset.c];
    drawSel(false);
  }
});

document.addEventListener('mousemove', e => {
  if (resizingCol !== null) {
    const w = Math.max(50, Math.min(400, resizeStartW + (e.clientX - resizeStartX)));
    colWidths[resizingCol] = w;
    for (let r = 0; r <= ROWS; r++) {
      const cell = tbl.rows[r]?.cells[resizingCol + 1];
      if (cell) {
        cell.style.width = w + 'px';
        cell.style.minWidth = w + 'px';
        cell.style.maxWidth = w + 'px';
      }
    }
    positionFillHandle();
  }
});

document.addEventListener('mouseup', () => {
  if (resizingCol !== null) {
    document.querySelectorAll('.col-resizer.active').forEach(el => el.classList.remove('active'));
    resizingCol = null;
    save();
  }
  if (fillDrag && fillBaseBox) {
    fillDrag = false;
    const [br0, br1, bc0, bc1] = fillBaseBox;
    const [r0, r1, c0, c1] = box();
    const ch = [];
    // Si se arrastró hacia abajo
    if (r1 > br1) {
      for (let c = bc0; c <= bc1; c++) {
        const srcH = br1 - br0 + 1;
        for (let r = br1 + 1; r <= r1; r++) {
          const srcR = br0 + ((r - br0) % srcH);
          const s = cells[ID(srcR, c)] || { raw: '', st: {} };
          ch.push([ID(r, c), { raw: shift(s.raw, r - srcR, 0), st: { ...s.st } }]);
        }
      }
    }
    // Si se arrastró hacia la derecha
    if (c1 > bc1) {
      for (let r = br0; r <= br1; r++) {
        const srcW = bc1 - bc0 + 1;
        for (let c = bc1 + 1; c <= c1; c++) {
          const srcC = bc0 + ((c - bc0) % srcW);
          const s = cells[ID(r, srcC)] || { raw: '', st: {} };
          ch.push([ID(r, c), { raw: shift(s.raw, 0, c - srcC), st: { ...s.st } }]);
        }
      }
    }
    fillBaseBox = null;
    if (ch.length) tx(ch);
  }
  drag = false;
});

tbl.addEventListener('dblclick', e => {
  const resizer = e.target.closest('.col-resizer');
  if (resizer) {
    autoFitColumns([+resizer.dataset.rc]);
    return;
  }
  if (e.target.closest('td')) edit(null, 'edit');
});

// Autoajuste de ancho de columnas según contenido
function autoFitColumns(colsToFit) {
  for (const c of colsToFit) {
    let maxLen = 4;
    for (const id in cells) {
      const [r, col] = PR(id);
      if (col === c && r < ROWS) {
        const t = td(r, c);
        if (t && t.textContent) maxLen = Math.max(maxLen, t.textContent.length);
      }
    }
    const w = Math.max(64, Math.min(340, maxLen * 8 + 22));
    colWidths[c] = w;
    for (let r = 0; r <= ROWS; r++) {
      const cell = tbl.rows[r]?.cells[c + 1];
      if (cell) {
        cell.style.width = w + 'px';
        cell.style.minWidth = w + 'px';
        cell.style.maxWidth = w + 'px';
      }
    }
  }
  positionFillHandle();
  save();
}

/* ============================================================================
 * 7. ATAJOS DE TECLADO Y PORTAPAPELES CON AJUSTE DE REFERENCIAS
 * ============================================================================ */
function fillD() {
  const [r0, r1, c0, c1] = box(), ch = [];
  for (let c = c0; c <= c1; c++) {
    const s = cells[ID(r0, c)] || { raw: '', st: {} };
    for (let r = r0 + 1; r <= r1; r++) {
      ch.push([ID(r, c), { raw: shift(s.raw, r - r0, 0), st: { ...s.st } }]);
    }
  }
  tx(ch);
}

wrap.addEventListener('keydown', e => {
  if (editing) return;
  const k = e.key, m = e.ctrlKey || e.metaKey;
  if (m) {
    const x = k.toLowerCase();
    if (x === 'z') e.shiftKey ? rdo() : undo();
    else if (x === 'y') rdo();
    else if (x === 'b') sty('b');
    else if (x === 'i') sty('i');
    else if (x === 'u') sty('u');
    else if (x === 'd') fillD();
    else if (x === 'f') toggleFindPanel(true);
    else if (x === 'a') {
      anc = [0, 0];
      foc = [ROWS - 1, COLS - 1];
      drawSel(false);
    } else if (x === 's') save(true);
    else return;
    e.preventDefault();
    return;
  }
  const mv = {
    ArrowUp: [-1, 0],
    ArrowDown: [1, 0],
    ArrowLeft: [0, -1],
    ArrowRight: [0, 1],
    Enter: [e.shiftKey ? -1 : 1, 0],
    Tab: [0, e.shiftKey ? -1 : 1]
  }[k];
  if (mv) {
    go(mv[0], mv[1], e.shiftKey && k.startsWith('Arrow'));
    e.preventDefault();
  } else if (k === 'F2') {
    edit(null, 'edit');
    e.preventDefault();
  } else if (k === 'Delete' || k === 'Backspace') {
    tx(each(id => setRaw(id, '')));
    e.preventDefault();
  } else if (k === 'Home') {
    go(0, -999);
    e.preventDefault();
  } else if (k.length === 1 && !e.altKey) {
    edit(k, 'enter');
    e.preventDefault();
  }
});

// Portapapeles TSV/Excel
const qd = (x, d) => (new RegExp('["\\n\\r' + (d === '\t' ? '\\t' : d) + ']').test(x) ? '"' + x.replace(/"/g, '""') + '"' : x);
const parseD = (s, d) => {
  const rows = [];
  let row = [], f = '', q = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"') {
        if (s[i + 1] === '"') { f += '"'; i++; }
        else q = false;
      } else f += ch;
    } else if (ch === '"' && f === '') q = true;
    else if (ch === d) { row.push(f); f = ''; }
    else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (ch !== '\r') f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
};

const inField = () => ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName);

function doCopy(e, cut) {
  if (inField()) return;
  const [r0, r1, c0, c1] = box(), g = [];
  for (let r = r0; r <= r1; r++) {
    const row = [];
    for (let c = c0; c <= c1; c++) row.push(cells[ID(r, c)] || { raw: '', st: {} });
    g.push(row);
  }
  const tsv = g.map((row,i) => row.map((cell,j) => { const v=val(ID(r0+i,c0+j)); return qd(String(v instanceof E ? v.c : v), '\t'); }).join('\t')).join('\n');
  clip = { tsv, g, r0, c0 };
  e.clipboardData.setData('text/plain', tsv);
  e.preventDefault();
  if (cut) tx(each(id => setRaw(id, '')));
  else msg('Copiado al portapapeles');
}

document.addEventListener('copy', e => doCopy(e, false));
document.addEventListener('cut', e => doCopy(e, true));
document.addEventListener('paste', e => {
  if (inField()) return;
  const t = e.clipboardData.getData('text/plain'), ch = [];
  e.preventDefault();
  if (clip && t.replace(/\r/g, '') === clip.tsv) {
    clip.g.forEach((row, i) =>
      row.forEach((c, j) => {
        const r = anc[0] + i, cc = anc[1] + j;
        if (r < ROWS && cc < COLS) {
          ch.push([ID(r, cc), { raw: shift(c.raw, r - (clip.r0 + i), cc - (clip.c0 + j)), st: { ...c.st } }]);
        }
      })
    );
  } else {
    parseD(t, '\t').forEach((row, i) =>
      row.forEach((v, j) => {
        const r = anc[0] + i, c = anc[1] + j;
        if (r < ROWS && c < COLS) ch.push(setRaw(ID(r, c), v));
      })
    );
  }
  tx(ch);
});

/* ============================================================================
 * 8. ORDENAMIENTO INTELIGENTE (Con preservación de encabezado — Fix Auditoría #4)
 * ============================================================================ */
function sort(dir) {
  let [r0, r1, c0, c1] = box();
  const hasHeader = $('#chkHeader').checked;

  // Si hay una sola celda seleccionada, detectar automáticamente el rango usado
  if (r0 === r1 && c0 === c1) {
    r0 = hasHeader ? 1 : 0;
    c0 = 0;
    r1 = 0;
    c1 = 0;
    for (const id in cells) {
      const [r, c] = PR(id);
      r1 = Math.max(r1, r);
      c1 = Math.max(c1, c);
    }
  } else if (hasHeader && r0 === 0 && r1 > 0) {
    // Si el usuario seleccionó toda la columna desde la fila 1 y tiene "Encabezado" activo
    r0 = 1;
  }

  if (r0 >= r1) {
    msg('Selecciona al menos 2 filas de datos para ordenar');
    return;
  }

  const kc = anc[1], rows = [];
  for (let r = r0; r <= r1; r++) rows.push({ r, k: val(ID(r, kc)) });
  rows.sort((a, b) => {
    const ea = a.k === '', eb = b.k === '';
    if (ea || eb) return ea - eb;
    return dir * cv(a.k, b.k) || a.r - b.r;
  });

  const ch = [];
  rows.forEach((o, i) => {
    for (let c = c0; c <= c1; c++) {
      const s = cells[ID(o.r, c)] || { raw: '', st: {} };
      ch.push([ID(r0 + i, c), { raw: shift(s.raw, r0 + i - o.r, 0), st: { ...s.st } }]);
    }
  });
  tx(ch);
  msg(`Ordenado ${dir > 0 ? 'A → Z' : 'Z → A'} por columna ${CN(kc)}`);
}

/* ============================================================================
 * 10. PERSISTENCIA LOCAL (IndexedDB) E IMPORTACIÓN / EXPORTACIÓN
 * ============================================================================ */
const DB = (() => {
  let p;
  const o = () =>
    p ||
    (p = new Promise((ok, no) => {
      const q = indexedDB.open('hojalibre_pro', 1);
      q.onupgradeneeded = () => q.result.createObjectStore('kv');
      q.onsuccess = () => ok(q.result);
      q.onerror = () => no(q.error);
    }));
  const t = (m, f) =>
    o().then(
      d =>
        new Promise((ok, no) => {
          const txObj = d.transaction('kv', m);
          const r = f(txObj.objectStore('kv'));
          r.onsuccess = () => ok(r.result);
          r.onerror = () => no(r.error);
        })
    );
  return { get: k => t('readonly', x => x.get(k)), set: (k, v) => t('readwrite', x => x.put(v, k)) };
})();

const snap = () => {
  sheets[activeSheetIdx].rows = ROWS;
  return JSON.stringify({ v: 2, activeSheetIdx, sheets });
};

function save(now) {
  clearTimeout(save.t);
  const go = () =>
    DB.set('doc', snap())
      .then(() => now && msg('Guardado en este navegador'))
      .catch(() => msg('Aviso: almacenamiento IndexedDB no disponible'));
  now ? go() : (save.t = setTimeout(go, 400));
}

    sheets = d.sheets.map((s, idx) => ({

      rows: Math.max(200, s.rows || 200),
      cells: s.cells || {},
      colWidths: s.colWidths || {},
      freeze: !!s.freeze
    }));
    activeSheetIdx = cl(d.activeSheetIdx || 0, 0, sheets.length - 1);
  } else {
    sheets = [
      {
        name: 'Hoja 1',
        rows: Math.max(200, d.rows || 200),
        cells: d.cells || {},
        colWidths: d.colWidths || {},
        freeze: false
      }
    ];
    activeSheetIdx = 0;
  }
  ROWS = sheets[activeSheetIdx].rows;
  cells = sheets[activeSheetIdx].cells;
  colWidths = sheets[activeSheetIdx].colWidths;

const inject = t =>
  new Promise((ok, no) => {
    const u = URL.createObjectURL(new Blob([t], { type: 'text/javascript' }));
    const s = document.createElement('script');
    s.src = u;
    s.onload = () => {
      URL.revokeObjectURL(u);
      window.XLSX && typeof window.XLSX.read === 'function' ? ok() : no();
    };
    s.onerror = e => {
      URL.revokeObjectURL(u);
      no(e);
    };
    document.head.append(s);
  });

}

$('#bX').onclick = () => {
  if (!needX()) return;
  sheets[activeSheetIdx].rows = ROWS;
  const wb = XLSX.utils.book_new();

  sheets.forEach(sh => {
    const ws = {};
    const shVal = Engine(sh.cells);
    let mr = 0, mc = 0;
    for (const id in sh.cells) {
      const k = sh.cells[id], v = shVal(id), [r, c] = PR(id), f = k.raw[0] === '=';
      if (v === '' && !f) continue;
      mr = Math.max(mr, r);
      mc = Math.max(mc, c);
      const o =
        typeof v === 'number'
          ? { t: 'n', v }
          : typeof v === 'boolean'
          ? { t: 'b', v }
          : { t: 's', v: String(v) };
      if (f) o.f = en(k.raw.slice(1));
      ws[id] = o;
    }
    ws['!ref'] = 'A1:' + ID(mr, mc);
    XLSX.utils.book_append_sheet(wb, ws, (sh.name || 'Hoja').slice(0, 31));
  });

  XLSX.writeFile(wb, 'HojaLibre.xlsx');
};

// Importación unificada de JSON, CSV/TSV y XLSX (Corrección de Auditoría #5)
$('#fi').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const n = f.name.toLowerCase();
  try {
    if (/\.json$/.test(n)) {
      load(await f.text());
      save(true);
      msg('Libro JSON cargado');
    } else if(/\.(csv|tsv|txt)$/.test(n)) {
      const t = (await f.text()).replace(/^\ufeff/, '');
      const l = t.split('\n')[0] || '';
      const d = [';', '\t', ','].sort((a, b) => l.split(b).length - l.split(a).length)[0];
      const rows = parseD(t, d), o = {};
      let targetRows = Math.max(200, Math.ceil((rows.length + 20) / 100) * 100);
      targetRows = Math.min(5000, targetRows);
      rows.forEach((row, r) =>
        row.forEach((v, c) => {
          if (v !== '' && r < targetRows && c < COLS) o[ID(r, c)] = setRaw(ID(r, c), v)[1];
        })
      );
      load({
        v: 2,
        activeSheetIdx: 0,
        sheets: [{ name: f.name.replace(/\.[^.]+$/, '').slice(0, 31) || 'Importado', rows: targetRows, cells: o, colWidths: {} }]
      });
      save(true);
      msg(`CSV importado (${rows.length} filas)`);
    } else if (needX()) {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      const importedSheets = wb.SheetNames.map(shName => {
        const ws = wb.Sheets[shName], o = {};
        let mr = 0;
        for (const k in ws) {
          if (k[0] === '!') continue;
          const c = ws[k], [r, cc] = PR(k);
          if (cc >= COLS) continue;
          mr = Math.max(mr, r);
          o[k] = {
            raw: c.f ? '=' + c.f : c.t === 'b' ? (c.v ? '=VERDADERO' : '=FALSO') : c.v == null ? '' : String(c.v),
            st: {}
          };
        }
        const targetRows = Math.min(5000, Math.max(200, Math.ceil((mr + 20) / 100) * 100));
        return { name: shName.slice(0, 31), rows: targetRows, cells: o, colWidths: {} };
      });
      load({ v: 2, activeSheetIdx: 0, sheets: importedSheets });
      save(true);
      msg(`Importado libro Excel (${importedSheets.length} hoja${importedSheets.length > 1 ? 's' : ''})`);
    }
  } catch (_) {
    msg('Error al abrir el archivo; verifica su formato');
  }
};
