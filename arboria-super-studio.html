function compositionAudit(L=ui.layout){
 if(!L)return [];
 const issues=[];const items=L.nodes;
 for(const m of items){if(!m.contained)issues.push({id:m.id,type:'text',text:labelOf(m.n)+': el texto necesita una forma más ancha o un tamaño de letra menor.'});if(textOf(m.n).trim()==='')issues.push({id:m.id,type:'empty',text:labelOf(m.n)+': falta completar el texto.'});}

 for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
  const a=items[i],b=items[j],x0=Math.max(a.x-a.bw/2,b.x-b.bw/2),x1=Math.min(a.x+a.bw/2,b.x+b.bw/2),y0=Math.max(a.y-a.bh/2,b.y-b.bh/2),y1=Math.min(a.y+a.bh/2,b.y+b.bh/2);
  if(x1-x0<9||y1-y0<9)continue;
  let hits=0;for(let x=x0+5;x<x1;x+=Math.max(9,(x1-x0)/7))for(let y=y0+5;y<y1;y+=Math.max(9,(y1-y0)/7))if(insideShape(a,x-a.x,y-a.y)&&insideShape(b,x-b.x,y-b.y))hits++;
  if(hits>=2)issues.push({id:a.id,type:'overlap',text:labelOf(a.n)+' se cruza con '+labelOf(b.n)+'. Mueve los elementos o pulsa Ordenar.'});
 }

}

function positiveDraft(n){
 const originals=[ORIGINAL.superEffect,...ORIGINAL.effects,ORIGINAL.trunk,...ORIGINAL.causes,...ORIGINAL.deepCauses];const idx=originals.indexOf(n.text);if(idx>=0)return ORIGINAL_POSITIVES[idx];
 if(n.positive)return n.positive;
 const txt=n.text.trim();const rules=[[/^Baja participación\b/i,'Mayor participación'],[/^Baja retención\b/i,'Mayor retención'],[/^Baja satisfacción\b/i,'Mayor satisfacción'],[/^Bajo logro\b/i,'Mayor logro'],[/^Escaso acompañamiento\b/i,'Acompañamiento suficiente'],[/^Retroalimentación tardía\b/i,'Retroalimentación oportuna'],[/^Limitada actualización\b/i,'Actualización continua'],[/^Desconexión entre\b/i,'Articulación entre'],[/^Inexistencia de alertas tempranas/i,'Implementación de alertas tempranas']];
 for(const [reg,rep]of rules)if(reg.test(txt))return txt.replace(reg,rep);
 return '';
}

async function rasterizeSVG(svgText,width,height,scale=2){
 // No foreignObject, external fonts or images: the SVG is entirely self-contained.
 const pixelLimit=26000000,edgeLimit=8192;
 const safeScale=Math.min(scale,edgeLimit/width,edgeLimit/height,Math.sqrt(pixelLimit/(width*height)));
 const w=Math.max(1,Math.round(width*safeScale)),h=Math.max(1,Math.round(height*safeScale));
 const url=URL.createObjectURL(new Blob([svgText],{type:'image/svg+xml;charset=utf-8'}));
 try{
  const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('El navegador no pudo rasterizar el SVG. Exporta SVG como alternativa.'));image.src=url;});
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const context=canvas.getContext('2d');if(!context)throw new Error('No hay un contexto de imagen disponible.');context.drawImage(image,0,0,w,h);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('No fue posible codificar la imagen PNG.')),'image/png'));
  canvas.width=1;canvas.height=1;return {blob,width:w,height:h,limited:safeScale<scale-.001};
 }finally{URL.revokeObjectURL(url);}
}

  const svg=buildScene(L,{prefix:'export',interactive:false,transparent});

const EXAMPLES={effect:['Incremento de la desmotivación de los participantes','Mayor tiempo necesario para alcanzar los resultados esperados','Disminución de la satisfacción con el servicio recibido'],cause:['Seguimiento tardío a las dificultades de los participantes','Comunicación poco clara entre las personas involucradas','Actividades poco adaptadas al contexto de los usuarios'],deep:['Planificación desarticulada de los procesos de apoyo','Actualización insuficiente de las herramientas de seguimiento','Coordinación limitada entre los equipos responsables']};
function removeNode(id){const n=state.nodes.find(x=>x.id===id);if(!n||['impact','central'].includes(n.role))return;commit(()=>{state.nodes=state.nodes.filter(x=>x.id!==id);for(const x of state.nodes)if(x.parent===id)x.parent=null;delete state.mml[id];if(ui.selected===id)ui.selected=null;});toast('Elemento eliminado. Puedes recuperarlo con Deshacer.');}
function reorderNode(id,direction){const n=state.nodes.find(x=>x.id===id);if(!n)return;const same=state.nodes.filter(x=>x.role===n.role),i=same.indexOf(n),other=same[i+direction];if(!other)return;commit(()=>{const a=state.nodes.indexOf(n),b=state.nodes.indexOf(other);[state.nodes[a],state.nodes[b]]=[state.nodes[b],state.nodes[a]];});}
function resetLayout(){commit(()=>state.nodes.forEach(n=>{n.dx=0;n.dy=0;}));ui.autoFit=true;renderAll(false);toast('Distribución restaurada. Se conservan los textos y estilos.');}

 catch(error){toast('No se importó el archivo: '+error.message);}

}

 undo:()=>historyAction('undo'),redo:()=>historyAction('redo'),project:projectDialog,export:exportDialog,'save-html':saveHTML,'save-json':saveJSON,present:togglePresentation,sidebar:toggleSidebar,

document.addEventListener('click',e=>{
 const tab=e.target.closest('[data-tab]');if(tab){ui.tab=tab.dataset.tab;renderSidebar();return;}
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const fn=ACTIONS[b.dataset.action];if(fn){try{const result=fn(b);if(result&&result.catch)result.catch(err=>{console.error(err);toast('No se completó la operación: '+err.message);});}catch(err){console.error(err);toast('No se completó la operación: '+err.message);}}

document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.content){const n=state.nodes.find(x=>x.id===el.dataset.content);if(!n)return;commit(()=>{if(state.mode==='objectives')n.positive=el.value;else n.text=el.value;},'text-'+n.id,false);if($('#node-char-count'))$('#node-char-count').textContent=el.value.length+'/500';}

 else if(el.dataset.nodeSet){const n=selectedNode();if(!n)return;const key=el.dataset.nodeSet,value=Number(el.value);commit(()=>n[key]=value,'node-'+key,false);const out=$('#out-'+el.id);if(out)out.textContent=value+(el.dataset.unit||'');const preview=$('.node-preview-large');if(preview)preview.outerHTML=nodePreview(n);}
 else if(el.hasAttribute('data-node-color')){const n=selectedNode();if(!n)return;commit(()=>n.color=el.value,'color-'+n.id,false);const preview=$('.node-preview-large');if(preview)preview.outerHTML=nodePreview(n);}
 else if(el.dataset.mmlId){commit(()=>{state.mml[el.dataset.mmlId]||={};state.mml[el.dataset.mmlId][el.dataset.mmlField]=el.value;},'mml-'+el.dataset.mmlId+'-'+el.dataset.mmlField,false);}

document.addEventListener('change',e=>{

let pointer=null;
const viewport=$('#viewport');
viewport.addEventListener('pointerdown',e=>{
 if(e.button!==0||$('#modal').open)return;
 const target=e.target.closest('[data-node]');
 if(target){const id=target.dataset.node,n=state.nodes.find(x=>x.id===id);if(!n)return;pointer={kind:'node',id,sx:e.clientX,sy:e.clientY,dx:n.dx,dy:n.dy,before:JSON.stringify(state),moved:false};ui.selected=id;}
 else{pointer={kind:'pan',sx:e.clientX,sy:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop,moved:false};}
 viewport.setPointerCapture(e.pointerId);e.preventDefault();
});
viewport.addEventListener('pointermove',e=>{
 if(!pointer)return;const dx=e.clientX-pointer.sx,dy=e.clientY-pointer.sy;if(!pointer.moved&&Math.hypot(dx,dy)<4)return;pointer.moved=true;
 if(pointer.kind==='pan'){viewport.classList.add('panning');viewport.scrollLeft=pointer.left-dx;viewport.scrollTop=pointer.top-dy;}
 else{viewport.classList.add('dragging');ui.autoFit=false;const n=state.nodes.find(x=>x.id===pointer.id),m=ui.layout.map.get(pointer.id);if(!n||!m)return;
  n.dx=clamp(pointer.dx+dx/ui.zoom,m.bw/2+24-m.baseX,ui.layout.W-m.bw/2-24-m.baseX);
  n.dy=clamp(pointer.dy+dy/ui.zoom,ui.layout.headerEnd+m.bh/2+8-m.baseY,ui.layout.H-m.bh/2-35-m.baseY);
  scheduleRender(false);
 }
});
function finishPointer(e,cancel=false){
 if(!pointer)return;const p=pointer;pointer=null;viewport.classList.remove('panning','dragging');try{viewport.releasePointerCapture(e.pointerId);}catch(_){}
 if(p.kind==='node'){
  if(cancel){state=JSON.parse(p.before);renderAll(true);return;}
  if(p.moved){ui.history.push(p.before);if(ui.history.length>70)ui.history.shift();ui.redo=[];ui.lastGroup='';state.updated=Date.now();saveLocal();ui.tab='node';renderAll(true);}
  else{const twice=ui.lastClickId===p.id&&Date.now()-(ui.lastClickTime||0)<420;ui.lastClickTime=Date.now();ui.lastClickId=p.id;selectNode(p.id,twice);}
 }
}
viewport.addEventListener('pointerup',e=>finishPointer(e));viewport.addEventListener('pointercancel',e=>finishPointer(e,true));

document.addEventListener('keydown',e=>{
 const input=e.target.matches('input,textarea,select')||e.target.isContentEditable;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveHTML();return;}
 if(e.key==='Escape'&&ui.present&&!$('#modal').open){e.preventDefault();togglePresentation();return;}
 if($('#modal').open)return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!input){e.preventDefault();historyAction(e.shiftKey?'redo':'undo');return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!input){e.preventDefault();historyAction('redo');return;}
 if(input)return;
 const target=e.target.closest('[data-node]');if(e.key==='Enter'&&target){e.preventDefault();selectNode(target.dataset.node,true);return;}
 const n=selectedNode();if(!n)return;
 if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeNode(n.id);return;}
 const dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(dirs[e.key]){e.preventDefault();const amount=e.shiftKey?10:1,m=ui.layout.map.get(n.id);commit(()=>{n.dx=clamp(n.dx+dirs[e.key][0]*amount,m.bw/2+24-m.baseX,ui.layout.W-m.bw/2-24-m.baseX);n.dy=clamp(n.dy+dirs[e.key][1]*amount,ui.layout.headerEnd+m.bh/2+8-m.baseY,ui.layout.H-m.bh/2-35-m.baseY);},'keyboard-move',false);}
});
