    body {

        border: 1px solid #cbd5e1 !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-shadow: none !important;

    function loadState() {

          if (parsed && parsed.items && parsed.schoolProfile) {

      return buildDefaultState();

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 border-emerald-400 text-white',
        warning: 'bg-amber-500 border-amber-300 text-slate-950',
        error: 'bg-rose-600 border-rose-400 text-white',
        info: 'bg-indigo-600 border-indigo-400 text-white'
      };
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-xl text-xs font-semibold flex items-center justify-between gap-3 transition-all duration-300 ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span><button type="button" class="opacity-80 hover:opacity-100 font-bold" onclick="this.parentElement.remove()">✕</button>`;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 4200);
    }

    // ============================================================================
    // AUDITORÍA JURÍDICA AUTOMÁTICA EN TIEMPO REAL
    // ============================================================================
    function runLegalComplianceAudit() {
      const profile = appState.schoolProfile;
      const items = appState.items;
      const findings = [];

      // 1. Verificar incompatibilidad entre Personero y Representante Estudiantil al Consejo Directivo
      const personeriaMembers = items.personeria_estudiantil?.members || [];
      const cdMembers = items.consejo_directivo?.members || [];
      const personeroObj = personeriaMembers.find(m => m.role.toLowerCase().includes('personero'));
      const repEnPersoneria = personeriaMembers.find(m => m.role.toLowerCase().includes('consejo directivo'));
      const repEnCD = cdMembers.find(m => m.role.toLowerCase().includes('estudiante'));

      const personeroName = personeroObj ? personeroObj.name.trim().toLowerCase() : '';
      const repName1 = repEnPersoneria ? repEnPersoneria.name.trim().toLowerCase() : '';
      const repName2 = repEnCD ? repEnCD.name.trim().toLowerCase() : '';

      if (personeroName && ((repName1 && personeroName === repName1) || (repName2 && personeroName === repName2))) {
        findings.push({
          severity: 'error',
          title: 'Incompatibilidad Legal Detectada: Personero vs. Representante al Consejo Directivo',
          detail: `El estudiante "${personeroObj.name}" figura simultáneamente como Personero Estudiantil y como Representante de los Estudiantes ante el Consejo Directivo. Según el Decreto 1860 de 1994 (compilado en el Decreto 1075 de 2015), ambos cargos son incompatibles.`,
          targetView: 'personeria_estudiantil'
        });
      } else {
        findings.push({
          severity: 'ok',
          title: 'Separación Legal Personero Estudiantil vs. Representante al Consejo Directivo',
          detail: 'Los cargos de Personero Estudiantil y Representante de los Estudiantes ante el Consejo Directivo están asignados a estudiantes distintos (cumple Decreto 1075 de 2015).',
          targetView: 'personeria_estudiantil'
        });
      }

      // 2. Verificar los 7 integrantes de ley del Comité Escolar de Convivencia (Ley 1620 de 2013)
      const cecMembers = items.comite_convivencia?.members || [];
      const requiredCecKeywords = [
        { label: 'Rector(a)', kw: 'rector' },
        { label: 'Personero(a) Estudiantil', kw: 'personero' },
        { label: 'Docente con función de Orientación', kw: 'orienta' },
        { label: 'Coordinador(a)', kw: 'coordinador' },
        { label: 'Presidente del Consejo de Padres', kw: 'padres' },
        { label: 'Presidente del Consejo de Estudiantes', kw: 'estudiantes' },
        { label: 'Docente líder de convivencia', kw: 'docente' }
      ];
      const missingCec = requiredCecKeywords.filter(req => !cecMembers.some(m => m.role.toLowerCase().includes(req.kw)));
      if (missingCec.length === 0) {
        findings.push({
          severity: 'ok',
          title: 'Comité Escolar de Convivencia con 7 representaciones completas (Ley 1620 de 2013)',
          detail: 'Están registrados el Rector (presidente), Personero, Orientador, Coordinador, Presidente del Consejo de Padres, Presidente del Consejo de Estudiantes y Docente líder.',
          targetView: 'comite_convivencia'
        });
      } else {
        findings.push({
          severity: 'warning',
          title: `Comité Escolar de Convivencia: faltan ${missingCec.length} representación(es) de la Ley 1620`,
          detail: `Pendiente registrar: ${missingCec.map(x => x.label).join(', ')}.`,
          targetView: 'comite_convivencia'
        });
      }

      // 3. Regla condicional SST: COPASST (>=10 educadores) vs Vigía SST (<10 educadores)
      const isCopasstRequired = Number(profile.teachersCount) >= 10;
      findings.push({
        severity: 'info',
        title: isCopasstRequired
          ? `Ámbito Laboral SST: Corresponde COPASST (${profile.teachersCount} educadores ≥ 10)`
          : `Ámbito Laboral SST: Corresponde Vigía de SST (${profile.teachersCount} educadores < 10)`,
        detail: isCopasstRequired
          ? 'Por contar con 10 o más educadores, el Decreto 1655 de 2015 y el Decreto 1072 de 2015 exigen conformar el Comité Paritario de Seguridad y Salud en el Trabajo (COPASST).'
          : 'Por contar con menos de 10 educadores, el Decreto 1655 de 2015 establece que no se exige comité paritario sino un Vigía de Seguridad y Salud en el Trabajo.',
        targetView: 'copasst_sst'
      });

      // 4. Regla condicional PAE: Comité de Alimentación Escolar (CAE - Res. 003 de 2026)
      const caeMembersCount = (items.comite_pae?.members || []).length;
      if (profile.hasPAE) {
        findings.push({
          severity: caeMembersCount > 0 ? 'ok' : 'warning',
          title: caeMembersCount > 0
            ? 'Comité de Alimentación Escolar (CAE) activo para vigilancia del PAE'
            : 'Atención: Opera el PAE pero el Comité de Alimentación Escolar (CAE) no tiene integrantes',
          detail: 'Como la institución recibe el Programa de Alimentación Escolar (PAE), el CAE es obligatorio conforme a la Resolución 003 de 2026.',
          targetView: 'comite_pae'
        });
      } else {
        findings.push({
          severity: 'info',
          title: 'Comité de Alimentación Escolar (CAE): Condicional (Sede sin operación PAE activa)',
          detail: 'Actualmente el perfil institucional indica que no opera el PAE; el CAE solo es obligatorio en establecimientos donde opera el programa.',
          targetView: 'comite_pae'
        });
      }

      return findings;
    }

    function openModalShell(title, bodyHtml, primaryLabel = 'Guardar') {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      const primaryBtn = document.getElementById('modalPrimaryBtn');
      if (primaryLabel === null) {
        primaryBtn.classList.add('hidden');
      } else {
        primaryBtn.classList.remove('hidden');
        primaryBtn.textContent = primaryLabel;
      }
      const modal = document.getElementById('appModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('appModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      activeModalContext = null;
    }

    function openConfirmModal(title, message, onConfirm) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      pendingConfirmCallback = onConfirm;
      const acceptBtn = document.getElementById('confirmAcceptBtn');
      acceptBtn.onclick = () => {
        const cb = pendingConfirmCallback;
        closeConfirmModal();
        if (cb) cb();
      };
      const modal = document.getElementById('confirmModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeConfirmModal() {
      const modal = document.getElementById('confirmModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      pendingConfirmCallback = null;
    }

              <div class="sm:col-span-2">
                <label class="block font-bold mb-1">Nombre del Documento o Plan</label>
                <input id="inpDocName" type="text" value="${escapeHtml(existing ? existing.name : '')}" placeholder="Nombre completo del instrumento" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
              </div>
            </div>
            <div>
              <label class="block font-bold mb-1">Norma Rectora</label>
              <input id="inpDocLaw" type="text" value="${escapeHtml(existing ? existing.law : '')}" placeholder="Ej. Decreto 1290 de 2009 / Guía 34 MEN" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
            </div>
            <div>
              <label class="block font-bold mb-1">¿Para qué sirve en la organización escolar?</label>
              <input id="inpDocPurpose" type="text" value="${escapeHtml(existing ? existing.purpose : '')}" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block font-bold mb-1">Acto de Adopción (Acuerdo / Resolución)</label>
                <input id="inpDocRes" type="text" value="${escapeHtml(existing ? existing.lastResolution : '')}" placeholder="Ej. Acuerdo Directivo 002 de 2026" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
              </div>
              <div>
                <label class="block font-bold mb-1">Avance de Actualización (%)</label>
                <input id="inpDocProgress" type="number" min="0" max="100" value="${existing ? existing.progress : 100}" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block font-bold mb-1">Estado</label>
                <input id="inpDocStatus" type="text" value="${escapeHtml(existing ? existing.status : 'Vigente y Actualizado')}" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
              </div>
              <div>
                <label class="block font-bold mb-1">Enlace al Documento</label>
                <input id="inpDocLink" type="url" value="${escapeHtml(existing ? existing.link : 'https://')}" class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
              </div>
            </div>
          </div>
        `,
        'Guardar Instrumento'
      );
    }

    // 7. Modal Respaldo JSON y Restauración
    function openBackupModal() {
      activeModalContext = { type: 'backup' };
      openModalShell(
        '💾 Gestión de Datos, Respaldo JSON y Plantillas',
        `
          <div class="space-y-4 text-xs">
            <div class="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/30 space-y-2">
              <div class="font-bold text-indigo-700 dark:text-indigo-300">1. Exportar Respaldo Institucional (.json)</div>
              <p class="text-slate-600 dark:text-slate-300">Descarga toda la organización institucional (integrantes, actas, reuniones, autoevaluación Guía 34 e instrumentos) en un archivo JSON seguro.</p>
              <button type="button" onclick="exportJsonBackup()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold">⬇️ Descargar Respaldo JSON</button>
            </div>

            <div class="p-4 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
              <div class="font-bold text-slate-800 dark:text-slate-200">2. Importar Respaldo JSON</div>
              <input id="inpImportJson" type="file" accept=".json,application/json" onchange="importJsonBackup(this)" class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white">
            </div>

            <div class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 space-y-2">
              <div class="font-bold text-rose-700 dark:text-rose-300">3. Restaurar Datos de Demostración</div>
              <p class="text-slate-600 dark:text-slate-300">Restaura la base de datos inicial pre-cargada con los ejemplos normativos de las 6 ramas.</p>
              <button type="button" onclick="resetToDemoData()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold">🔄 Restaurar Datos de Fábrica</button>
            </div>
          </div>
        `,
        null
      );
    }

    function handleModalSubmit() {
      if (!activeModalContext) return;
      const ctx = activeModalContext;

      if (ctx.type === 'schoolConfig') {
        const name = document.getElementById('cfgName').value.trim();
        const muni = document.getElementById('cfgMuni').value.trim();
        const teachers = parseInt(document.getElementById('cfgTeachers').value, 10) || 1;
        const hasPAE = document.getElementById('cfgPAE').checked;
        const hasAsoc = document.getElementById('cfgAsoc').checked;

        if (!name) {
          showToast('Por favor ingresa el nombre de la Institución Educativa.', 'warning');
          return;
        }
        appState.schoolProfile.name = name;
        appState.schoolProfile.municipality = muni || 'Colombia';
        appState.schoolProfile.teachersCount = Math.max(1, teachers);
        appState.schoolProfile.hasPAE = hasPAE;
        appState.schoolProfile.hasAsociacionPadres = hasAsoc;

        saveState();
        closeModal();
        renderSidebar();
        renderMainContent();
        showToast('Contexto institucional actualizado y reglas legales recalculadas.', 'success');
        return;
      }

      if (ctx.type === 'member') {
        const name = document.getElementById('inpMemberName').value.trim();
        const role = document.getElementById('inpMemberRole').value.trim();
        const gradeOrSector = document.getElementById('inpMemberSector').value.trim();
        const email = document.getElementById('inpMemberEmail').value.trim();

        if (!name || !role) {
          showToast('Por favor completa el nombre y el rol o representación.', 'warning');
          return;
        }

        const item = appState.items[ctx.itemId];
        if (ctx.memberId) {
          const idx = item.members.findIndex(m => m.id === ctx.memberId);
          if (idx !== -1) {
            item.members[idx] = { ...item.members[idx], name, role, gradeOrSector, email };
          }
          showToast('Integrante actualizado correctamente.', 'success');
        } else {
          item.members.push({ id: Date.now(), name, role, gradeOrSector, email });
          showToast('Integrante asignado a la instancia.', 'success');
        }
        saveState();
        closeModal();
        renderSidebar();
        renderMainContent();
        return;
      }

      if (ctx.type === 'meeting') {
        const date = document.getElementById('inpMeetingDate').value;
        const status = document.getElementById('inpMeetingStatus').value;
        const topic = document.getElementById('inpMeetingTopic').value.trim();

        if (!date || !topic) {
          showToast('Selecciona la fecha y escribe el tema de la sesión.', 'warning');
          return;
        }

        const item = appState.items[ctx.itemId];
        if (ctx.meetingId) {
          const idx = item.meetings.findIndex(m => m.id === ctx.meetingId);
          if (idx !== -1) {
            item.meetings[idx] = { ...item.meetings[idx], date, status, topic };
          }
          showToast('Sesión actualizada.', 'success');
        } else {
          item.meetings.push({ id: Date.now(), date, status, topic });
          showToast('Nueva sesión agendada.', 'success');
        }
        saveState();
        closeModal();
        renderSidebar();
        renderMainContent();
        return;
      }

      if (ctx.type === 'record') {
        const number = document.getElementById('inpRecordNumber').value.trim();
        const title = document.getElementById('inpRecordTitle').value.trim();
        const link = document.getElementById('inpRecordLink').value.trim();

        if (!number || !link) {
          showToast('Ingresa el número consecutivo y el enlace del acta.', 'warning');
          return;
        }

        const item = appState.items[ctx.itemId];
        if (ctx.recordId) {
          const idx = item.records.findIndex(r => r.id === ctx.recordId);
          if (idx !== -1) {
            item.records[idx] = { ...item.records[idx], number, title, link };
          }
          showToast('Acta actualizada.', 'success');
        } else {
          item.records.push({ id: Date.now(), number, title, link });
          showToast('Acta vinculada exitosamente.', 'success');
        }
        saveState();
        closeModal();
        renderSidebar();
        renderMainContent();
        return;
      }

      if (ctx.type === 'transversal') {
        const code = document.getElementById('inpTfCode').value.trim() || 'PROY';
        const law = document.getElementById('inpTfLaw').value.trim();
        const name = document.getElementById('inpTfName').value.trim();
        const detail = document.getElementById('inpTfDetail').value.trim();
        const articulatedWith = document.getElementById('inpTfArticulated').value.trim();
        const leader = document.getElementById('inpTfLeader').value.trim();

        if (!name || !law) {
          showToast('Completa al menos el nombre del proyecto/cátedra y la norma.', 'warning');
          return;
        }

        const item = appState.items[ctx.itemId];
        const payload = { code, law, name, detail, articulatedWith, leader };
        if (ctx.fieldIndex !== null && ctx.fieldIndex !== undefined) {
          item.transversalFields[ctx.fieldIndex] = payload;
          showToast('Articulación curricular actualizada.', 'success');
        } else {
          item.transversalFields.push(payload);
          showToast('Proyecto/cátedra agregado a la matriz.', 'success');
        }
        saveState();
        closeModal();
        renderSidebar();
        renderMainContent();
        return;
      }

      if (ctx.type === 'instrument') {
        const acronym = document.getElementById('inpDocAcronym').value.trim();
        const name = document.getElementById('inpDocName').value.trim();
        const law = document.getElementById('inpDocLaw').value.trim();
        const purpose = document.getElementById('inpDocPurpose').value.trim();
        const lastResolution = document.getElementById('inpDocRes').value.trim();
        const progress = Math.min(100, Math.max(0, parseInt(document.getElementById('inpDocProgress').value, 10) || 0));
        const status = document.getElementById('inpDocStatus').value.trim();
        const link = document.getElementById('inpDocLink').value.trim();

        if (!acronym || !name) {
          showToast('Ingresa la sigla y el nombre del documento institucional.', 'warning');
          return;
        }

        const item = appState.items[ctx.itemId];
        const existing = ctx.docIndex !== null ? item.instrumentsList[ctx.docIndex] : null;
        const payload = {
          id: existing ? existing.id : 'doc_' + Date.now(),
          acronym,
          name,
          law,
          purpose,
          competentBody: existing ? existing.competentBody : 'Consejo Directivo / Consejo Académico',
          status,
          lastResolution,
          progress,
          link
        };
        if (ctx.docIndex !== null && ctx.docIndex !== undefined) {
          item.instrumentsList[ctx.docIndex] = payload;
          showToast('Instrumento institucional actualizado.', 'success');
        } else {
          item.instrumentsList.push(payload);
          showToast('Nuevo instrumento registrado.', 'success');
        }
        saveState();
        closeModal();
        renderSidebar();
        renderMainContent();
      }
    }

    function updateProcessScore(itemId, procIndex, newValue) {
      const item = appState.items[itemId];
      if (!item || !item.processes || !item.processes[procIndex]) return;
      item.processes[procIndex].score = parseInt(newValue, 10) || 1;
      saveState();
      renderMainContent();
      showToast('Nivel de autoevaluación Guía 34 actualizado.', 'info');
    }

    function deleteItemRecord(itemId, listName, id) {
      openConfirmModal(
        'Eliminar registro',
        '¿Deseas eliminar este registro de la instancia institucional?',
        () => {
          const item = appState.items[itemId];
          if (!item || !item[listName]) return;
          item[listName] = item[listName].filter(entry => entry.id !== id);
          saveState();
          renderSidebar();
          renderMainContent();
          showToast('Registro eliminado.', 'info');
        }
      );
    }

    function deleteTransversalField(itemId, idx) {
      openConfirmModal(
        'Eliminar línea transversal',
        '¿Deseas quitar este proyecto o cátedra de la matriz de articulación?',
        () => {
          const item = appState.items[itemId];
          if (!item || !item.transversalFields) return;
          item.transversalFields.splice(idx, 1);
          saveState();
          renderSidebar();
          renderMainContent();
          showToast('Elemento eliminado de la matriz.', 'info');
        }
      );
    }

    function deleteInstrument(itemId, idx) {
      openConfirmModal(
        'Eliminar instrumento documental',
        '¿Deseas eliminar este instrumento de la lista?',
        () => {
          const item = appState.items[itemId];
          if (!item || !item.instrumentsList) return;
          item.instrumentsList.splice(idx, 1);
          saveState();
          renderSidebar();
          renderMainContent();
          showToast('Instrumento eliminado.', 'info');
        }
      );
    }

    function exportJsonBackup() {
      const dataStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `organizacion_institucional_${appState.schoolProfile.academicYear || '2026'}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Respaldo JSON descargado.', 'success');
    }

    function importJsonBackup(inputEl) {
      const file = inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.items && parsed.schoolProfile) {
            appState = parsed;
            saveState();
            closeModal();
            renderSidebar();
            renderMainContent();
            showToast('Respaldo institucional importado con éxito.', 'success');
          } else {
            showToast('El archivo JSON no tiene la estructura válida de SIGOI v8.0.', 'error');
          }
        } catch (err) {
          showToast('Error al leer el archivo JSON.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function resetToDemoData() {
      openConfirmModal(
        'Restaurar datos de demostración',
        'Se restablecerán los datos iniciales de ejemplo para las 6 ramas de la organización institucional. ¿Continuar?',
        () => {
          appState = buildDefaultState();
          saveState();
          closeModal();
          renderSidebar();
          renderMainContent();
          showToast('Datos institucionales de demostración restaurados.', 'success');
        }
      );
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      renderMainContent();
    });
  </script>
</body>
</html>
