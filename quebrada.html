const story=['En una pequeña vereda rodeada de montañas vivía Samuel, un niño de diez años que disfrutaba caminar por los senderos cercanos a su escuela. Cada mañana, mientras acompañaba a su abuelo a revisar los cultivos, escuchaba el sonido de una quebrada que atravesaba la parte baja de la finca.','Un lunes, Samuel notó algo extraño. El agua, que antes era transparente, estaba turbia y llevaba pequeñas bolsas de plástico. Preocupado, le preguntó a su abuelo qué estaba sucediendo. El hombre le explicó que algunas personas habían dejado residuos cerca del camino y que las lluvias los habían arrastrado hasta la quebrada.','Al día siguiente, Samuel compartió lo ocurrido con sus compañeros de quinto grado. Entre todos propusieron organizar una jornada de limpieza y elaborar carteles para recordarles a las familias la importancia de cuidar el agua. Su profesora los ayudó a distribuir las tareas y a preparar los materiales.','El sábado, varios estudiantes y familiares se reunieron cerca de la quebrada. Recogieron los residuos que podían retirar de manera segura, separaron los materiales aprovechables y colocaron avisos en los lugares más visitados. También acordaron hablar con los vecinos para evitar que se siguiera arrojando basura.','Una semana después, Samuel regresó al lugar. Aunque todavía quedaba trabajo por hacer, observó que el camino estaba más limpio y que varias familias habían comenzado a utilizar recipientes para depositar sus residuos. Comprendió entonces que cuidar la naturaleza no depende únicamente de una persona, sino del compromiso de toda la comunidad.'];
const qs=[
['¿Quién es el personaje principal de la historia?','El abuelo de Samuel.','Samuel.','La profesora.',2],
['¿Qué problema encontró Samuel en la quebrada?','El agua estaba turbia y tenía residuos.','La quebrada se había secado.','Habían construido un puente.',1],
['¿Qué hicieron los estudiantes para ayudar a solucionar el problema?','Dejaron de visitar la quebrada.','Esperaron a que otras personas limpiaran.','Organizaron una jornada de limpieza y elaboraron carteles.',3],
['¿Por qué Samuel decidió contarles a sus compañeros lo que había observado?','Porque quería faltar a clases.','Porque comprendió que necesitaba ayuda para cuidar la quebrada.','Porque deseaba cambiar de escuela.',2],
['¿Qué se puede deducir de la participación de las familias en la jornada?','Que la comunidad comenzó a interesarse por el cuidado del agua.','Que las familias no querían colaborar.','Que solamente los estudiantes podían resolver el problema.',1],
['¿Qué habría podido suceder si nadie hubiera prestado atención al problema?','La quebrada se habría limpiado inmediatamente.','Los residuos habrían desaparecido sin intervención.','La contaminación podría haber continuado y afectado el entorno.',3]];
const openQ=['¿Consideras que Samuel tomó una buena decisión al organizar la jornada de limpieza? Explica por qué.','¿Qué otra acción propondrías para evitar que las quebradas de tu comunidad se contaminen? Explica cómo ayudaría.'];

uardarlo como PDF desde el navegador.</p></details>';entry.onsubmit=e=>{e.preventDefault();code=student.value.trim().toUpperCase();if(!code){student.focus();return}try{d=JSON.parse(localStorage.getItem(key+code))||{}}catch{d={};warn.textContent='No se pudo recuperar el cuaderno guardado.'}show(d.page||0)}}

if(n===0)html+='<small>SESIÓN 1 · LECTURA</small><h1>El secreto de la quebrada</h1><article class="story">'+reading()+'</article><button onclick="show(1)">Responder las preguntas →</button>';
if(n===1){html+='<h2>Comprendo lo que leí</h2><p>Vuelve al cuento cuando lo necesites. Estas preguntas ayudan a tu docente a conocer cómo lees y escribes.</p><details><summary>Consultar el cuento</summary><div class="story">'+reading()+'</div></details>';qs.forEach((q,i)=>{if(i===0||i===3)html+='<h3>'+(!i?'A. Comprensión literal':'B. Comprensión inferencial')+'</h3>';html+='<fieldset '+(d.sent?'disabled':'')+'><legend>'+(i+1)+'. '+q[0]+'</legend>'+q.slice(1,4).map((s,j)=>'<label><input type="radio" name="q'+i+'" data-k="q'+i+'" value="'+(j+1)+'" '+(+d['q'+i]===j+1?'checked':'')+'> '+s+'</label>').join('')+'</fieldset>'});html+='<small>SESIÓN 2 · OPINIÓN Y PROPUESTA</small><h3>C. Comprensión crítica</h3><fieldset '+(d.sent?'disabled':'')+'>'+openQ.map((t,i)=>field('c'+i,(7+i)+'. '+t)).join('')+'</fieldset>'+(d.sent?'<p>Diagnóstico entregado.</p><button onclick="show(2)">Ir al taller →</button>':'<button onclick="submitDiag()">Entregar diagnóstico</button><p id="msg" role="status"></p>')}
if(n===2){html+='<h2>Una carta para la vereda</h2>';if(!d.sent)html+='<p>Primero entrega el diagnóstico. Después podrás practicar cómo explicar y defender tu propuesta.</p><button onclick="show(1)">Volver al diagnóstico</button>';else html+='<p>Elige a quién escribirás. Convéncele de realizar una acción concreta para cuidar el agua.</p><aside><b>Del hecho a la explicación</b><p>Samuel vio bolsas en el agua. Su abuelo explicó que la lluvia las arrastró desde el camino. Al unir esos dos hechos, puedes deducir por qué conviene recoger los residuos antes de que llueva.</p><b>Prueba esta estructura</b><p>«Queridas familias, les propongo ____. En el cuento observé que ____. Esta acción ayudaría porque ____.»</p></aside>'+field('draft','1. Escribe tu borrador')+'<h3>2. Relee como si recibieras la carta</h3>'+['¿Se entiende a quién le escribo y qué le pido?','¿Relacioné mi propuesta con una pista del cuento?','¿Expliqué cómo mi acción ayudaría a cuidar el agua?'].map((t,i)=>'<label class="check"><input type="checkbox" data-k="r'+i+'" '+(d['r'+i]?'checked':'')+'> '+t+'</label>').join('')+field('final','3. Escribe tu versión final con los cambios que decidiste hacer')+'<button onclick="show(3)">Ver mi informe →</button>'}
if(n===3){html+='<div class="report"><h2>Informe de lectoescritura</h2><p>Grado quinto · Código '+esc(code)+' · '+(d.sent?'Diagnóstico entregado el '+esc(d.sent):'Diagnóstico en curso')+'</p>';if(d.sent){for(let j=0;j<2;j++){const hits=qs.slice(j*3,j*3+3).filter((q,i)=>+d['q'+(j*3+i)]===q[4]).length;html+='<h3>Comprensión '+(j?'inferencial':'literal')+' · '+hits+' de 3</h3>';qs.slice(j*3,j*3+3).forEach((q,i)=>{html+='<p><b>'+q[0]+'</b><br>Tu respuesta: '+q[d['q'+(j*3+i)]]+(+d['q'+(j*3+i)]===q[4]?' ✓':'<br>Al releer, observa esta idea: '+q[q[4]])+'</p>'})}}html+=openQ.map((t,i)=>'<h3>'+t+'</h3><pre>'+esc(d['c'+i]||'Pendiente')+'</pre>').join('')+['Borrador','Carta final'].map((t,i)=>'<h3>'+t+'</h3><pre>'+esc(d[i?'final':'draft']||'Pendiente')+'</pre>').join('')+field('teacher','Observación docente y próximo paso')+'</div><button onclick="print()">Imprimir informe / PDF</button>'}
app.innerHTML=html;window.scrollTo(0,0)}
function submitDiag(){for(const k of [...qs.map((_,i)=>'q'+i),'c0','c1'])if(!String(d[k]||'').trim()){app.querySelector('[data-k="'+k+'"]').focus();msg.textContent='Aún falta responder la pregunta '+(k[0]==='q'?Number(k[1])+1:Number(k[1])+7)+'.';return}if(confirm('¿Entregar tus ocho respuestas? Quedarán guardadas para revisarlas con tu docente.')){d.sent=new Date().toLocaleDateString('es-CO');show(2)}}
app.oninput=e=>{const k=e.target.dataset.k;if(k){d[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;save()}};
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.report textarea').forEach(t=>{t.style.height=t.scrollHeight+6+'px'})});home();
</script></html>
